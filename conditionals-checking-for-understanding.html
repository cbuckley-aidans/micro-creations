<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conditional Statements: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --scr: #10132c;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --mono: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption code { font-family: var(--mono); font-size: .88em; font-weight: 700; }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    @keyframes blink { 50% { opacity: 0; } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 40px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .sctag { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--navy); box-shadow: inset 0 0 0 3px var(--navy); border-radius: 6px; padding: 6px 12px 5px; line-height: 1; }
    .prompt { font-size: 28px; font-weight: 600; margin-top: 6px; line-height: 1.3; }
    .prompt b { color: var(--pink); font-weight: 800; }
    .prompt code, .quote code, .opt code { font-family: var(--mono); font-size: .88em; font-weight: 700; color: var(--pink); }
    .body { flex: 1; min-height: 0; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 30px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* code colouring: dark panels, light panels, svg dark, svg light */
    .dk .k { color: #ff5cb3; font-weight: 700; } .dk .s { color: #ffb0d9; } .dk .n, .dk .v { color: #fff; } .dk .f, .dk .o { color: #9aa3cf; }
    .lt .k { color: var(--pink); font-weight: 800; } .lt .s { color: #c2307f; } .lt .n, .lt .v { color: var(--navy); } .lt .f, .lt .o { color: #6b7199; }
    .c-k { fill: #ff5cb3; font-weight: 700; } .c-s { fill: #ffb0d9; } .c-n, .c-v { fill: #fff; } .c-f, .c-o { fill: #9aa3cf; }
    .l-k { fill: var(--pink); font-weight: 800; } .l-s { fill: #c2307f; } .l-n, .l-v { fill: var(--navy); } .l-f, .l-o { fill: #6b7199; }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .cd { font-family: var(--mono); font-size: 22px; font-weight: 500; white-space: pre; }
    .ln { font-family: var(--mono); font-size: 17px; fill: #6d7299; }
    .plab { font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; fill: #8a90b8; }
    .plab.dk { fill: var(--mid-grey); }
    .otxt { font-family: var(--mono); font-size: 21px; font-weight: 700; fill: #fff; white-space: pre; }
    .otxt.err { fill: #ff5cb3; font-size: 18px; }
    .vname { font-family: var(--mono); font-size: 24px; font-weight: 700; fill: var(--pink); }
    .vval { font-family: var(--mono); font-size: 24px; font-weight: 700; }
    .note { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }
    .pt { font-family: var(--mono); font-size: 19px; font-weight: 700; }
    .dtxt { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 700; fill: var(--navy); }
    .yn { font-family: var(--cond); font-size: 21px; font-weight: 800; letter-spacing: .1em; fill: var(--pink); }
    .btxt { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #fff; }
    .bnum { font-family: var(--cond); font-size: 19px; font-weight: 900; fill: #fff; }
    .tick { font-family: var(--cond); font-size: 18px; font-weight: 800; fill: var(--mid-grey); }
    .cur { animation: blink 1s steps(1) infinite; }

    /* multiple choice */
    .opts { display: grid; gap: 10px; }
    .col .opt { font-size: 23px; padding: 9px 18px; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 20px;
        font-family: inherit; font-size: 25px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .opt .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .opt:hover:not(:disabled) { background: #f6f7fb; }
    .opt.sel { background: var(--tint); }
    .opt.sel .l { background: var(--pink); }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; opacity: 1; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .opt.right code { color: #fff; }
    .opt.wrong { border-style: dashed; opacity: .5; animation: shake .4s; cursor: default; }
    .opt:disabled { cursor: default; }
    .pred .opts { width: 380px; gap: 8px; }
    .pred .opt { min-height: 64px; padding: 7px 14px; }
    .mini { font-family: var(--mono); font-size: 22px; font-weight: 700; background: var(--scr); color: #fff; border-radius: 6px; padding: 8px 14px; flex: 1;
        min-height: 46px; white-space: pre; line-height: 1.25; display: flex; align-items: center; }
    .mini.empty { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-style: italic; color: #8a90b8; }
    .opt.right .mini { background: #fff; color: var(--pink); }

    /* quote */
    .quote { border-left: 8px solid var(--pink); padding: 4px 0 4px 20px; font-size: 25px; font-weight: 600; font-style: italic; line-height: 1.3; margin-bottom: 14px; }
    .quote code { font-style: normal; }
    .col { display: flex; flex-direction: column; }

    /* scenes */
    .scene { position: relative; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #fff; }
    .scene > svg { overflow: hidden; }
    .scene.flat { border: none; background: transparent; }
    .replay { position: absolute; right: 12px; top: 12px; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 5px 12px 4px 9px; cursor: pointer; }
    .replay svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }

    /* flowchart buttons */
    .fbtn { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; font-family: inherit; font-size: 24px; font-weight: 700; line-height: 1.15;
        color: #fff; background: var(--navy); border: 3px solid var(--navy); border-radius: 6px; cursor: pointer; padding: 4px 10px;
        transition: background-color .2s, border-color .2s, box-shadow .2s, opacity .2s; }
    .fbtn:hover:not(:disabled) { background: #2b3166; }
    .fbtn.sel { box-shadow: 0 0 0 5px rgba(234,0,138,.45); border-color: var(--pink); }
    .fbtn.right, .fbtn.right:hover { background: var(--pink); border-color: var(--pink); box-shadow: 0 0 0 5px rgba(234,0,138,.18); }
    .fbtn.wrong { background: #fff; color: var(--navy); border-style: dashed; opacity: .5; animation: shake .4s; }
    .fbtn:disabled { cursor: default; }

    /* tap a line */
    .lines { background: var(--navy); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; width: 580px; flex-shrink: 0; }
    .lbtn { display: flex; align-items: center; gap: 16px; font-family: var(--mono); font-size: 26px; font-weight: 500; color: #fff; background: transparent; border: 3px solid transparent;
        border-radius: 6px; padding: 5px 12px; cursor: pointer; text-align: left; white-space: pre; transition: background-color .25s, border-color .2s, opacity .25s; }
    .lbtn .ln2 { color: #6d7299; font-size: 20px; width: 24px; text-align: right; }
    .lbtn:hover:not(:disabled) { background: rgba(255,255,255,.07); }
    .lbtn.sel { border-color: #fff; background: rgba(255,255,255,.12); }
    .lbtn.right { background: var(--pink); border-color: var(--pink); }
    .lbtn.right span { color: #fff !important; }
    .lbtn.wrong { border-style: dashed; border-color: #6d7299; opacity: .45; animation: shake .4s; }
    .lbtn.on { box-shadow: inset 6px 0 0 var(--pink); background: rgba(234,0,138,.3); }
    .lbtn.skip { opacity: .3; }
    .lbtn:disabled { cursor: default; }

    /* screens and editors */
    .screen { background: var(--scr); border-radius: 8px; padding: 10px 18px 14px; font-family: var(--mono); color: #fff; font-size: 23px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; }
    .screen .err { color: #ff5cb3; font-size: 19px; }
    .lab { display: block; font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a90b8; margin-bottom: 4px; white-space: normal; }
    .curs { display: inline-block; width: 12px; height: 22px; background: var(--pink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }
    .editor { background: var(--navy); border-radius: 8px; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 4px; }
    .erow { display: flex; align-items: center; gap: 12px; min-height: 42px; border-radius: 6px; padding-right: 6px; transition: background-color .25s, box-shadow .25s, opacity .25s; }
    .erow .ln2 { color: #6d7299; font-family: var(--mono); font-size: 20px; width: 26px; text-align: right; flex-shrink: 0; }
    .erow .static { font-family: var(--mono); font-size: 24px; font-weight: 500; padding: 2px 14px; white-space: pre; }
    .erow.on { background: rgba(234,0,138,.3); box-shadow: inset 6px 0 0 var(--pink); }
    .erow.bad { background: rgba(255,92,179,.14); box-shadow: inset 6px 0 0 #ff5cb3; }
    .erow.skip { opacity: .3; }
    .ind { font-family: var(--mono); font-size: 24px; color: #4c5285; white-space: pre; margin-left: 14px; margin-right: -6px; }
    .codein { flex: 1; min-width: 0; font-family: var(--mono); font-size: 24px; font-weight: 500; color: #fff; background: rgba(255,255,255,.06); border: 3px solid #3b4170; border-radius: 6px;
        padding: 1px 11px; caret-color: var(--pink); outline: none; -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s; }
    .codein:focus { border-color: var(--pink); }
    .codein:focus-visible { outline: none; }
    .codein::placeholder { color: #5d6390; }
    .codein.right { border-color: var(--pink); background: rgba(234,0,138,.25); }
    .codein.wrong { border-style: dashed; border-color: #8a90b8; animation: shake .4s; }
    .minicode { background: var(--navy); border-radius: 8px; padding: 10px 16px; font-family: var(--mono); font-size: 20px; font-weight: 500; color: #fff; white-space: pre; line-height: 1.5; }

    /* drag tiles */
    .tile { font-family: inherit; font-size: 24px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 16px; line-height: 1.25;
        cursor: grab; touch-action: none; position: relative; z-index: 2; transition: transform .3s var(--ease), box-shadow .2s, border-color .2s; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; text-align: center; }
    .tile.sm { font-size: 22px; padding: 6px 14px; }
    .tile.code { font-family: var(--mono); font-size: 22px; padding: 5px 12px; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { transition: none; cursor: grabbing; z-index: 30; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; cursor: default; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }

    /* sort */
    .sort { display: grid; grid-template-columns: 1fr 400px 1fr; gap: 18px; width: 100%; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 8px; display: flex; flex-direction: column; overflow: visible; transition: box-shadow .2s; }
    .bin.pk { border-color: var(--pink); }
    .bin h3 { margin: 0; padding: 8px 16px 7px; font-family: var(--mono); font-size: 28px; font-weight: 700; color: #fff; background: var(--navy); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 18px; font-weight: 600; color: var(--mid-grey); padding: 8px 16px 0; }
    .bin .area { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center; border-radius: 0 0 6px 6px; transition: background-color .2s; }
    .bin.hover .area, .bin.armed:hover .area { background: rgba(234,0,138,.06); }
    .bin.armed { box-shadow: 0 0 0 4px rgba(234,0,138,.15); cursor: pointer; }
    .pool { background: var(--blank); border-radius: 8px; padding: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-content: center; justify-content: center; transition: background-color .2s; }
    .pool.hover { background: #e3e7ee; }
    .midcol { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .midcol .pool { flex: 1; }
    .given { align-self: center; font-family: var(--mono); font-size: 24px; font-weight: 700; color: #fff; background: var(--navy); border-radius: 6px; padding: 6px 16px; }
    .given .n { color: #ff5cb3; }

    /* slots */
    .bwrap { position: relative; width: 806px; height: 336px; border: 3px solid var(--navy); border-radius: 8px; flex-shrink: 0; }
    .bwrap > svg { position: absolute; left: 0; top: 0; }
    .slot, .gap, .oslot { border: 3px dashed #c3c6d0; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .slot { position: absolute; width: 200px; height: 50px; background: #fff; }
    .slot.hover, .slot.armed:hover, .gap.hover, .gap.armed:hover, .oslot.hover, .oslot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .slot.armed, .gap.armed, .oslot.armed { border-color: #e7a3c9; cursor: pointer; }
    .slot.filled, .gap.filled, .oslot.filled { border-color: transparent; background: none; }
    .slot .tile, .gap .tile { box-shadow: none; padding: 5px 14px; font-size: 23px; }
    .slot .tile.code { font-size: 21px; padding: 4px 10px; }
    .bside { width: 320px; display: flex; flex-direction: column; gap: 10px; height: 336px; flex-shrink: 0; }
    .bside .pool { flex: 1; }
    .bside .pool.colm { flex-direction: column; flex-wrap: nowrap; align-items: center; }

    /* cloze */
    .cloze { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .crow { display: flex; align-items: stretch; border: 3px solid var(--navy); border-radius: 8px; min-height: 70px; }
    .crow .num { width: 56px; flex-shrink: 0; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .crow .sent { flex: 1; align-self: center; padding: 8px 18px; font-size: 27px; font-weight: 600; line-height: 58px; }
    .cz { font-family: var(--mono); font-size: 25px; font-weight: 500; background: var(--blank); border-radius: 6px; padding: 4px 12px; white-space: pre; }
    .tile.op { min-width: 64px; font-size: 26px; }
    .gap { display: inline-flex; vertical-align: middle; min-width: 140px; height: 54px; margin: 0 2px; }
    .gap.sym { min-width: 84px; }
    .bside .pool.wrap { flex-direction: row; flex-wrap: wrap; align-content: center; gap: 14px; }

    /* working out */
    .ttab { border-collapse: separate; border-spacing: 0; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; }
    .ttab th { background: var(--navy); color: #fff; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 9px 18px 8px; text-align: left; }
    .ttab td { padding: 12px 18px; border-top: 2px solid var(--light-grey); font-size: 24px; font-weight: 600; }
    .ttab tr:first-child td { border-top: none; }
    .ttab td.lno { font-family: var(--cond); font-size: 26px; font-weight: 900; color: #fff; background: var(--navy); text-align: center; width: 52px; padding: 12px 8px; }
    .ttab .cz { font-size: 24px; }
    .numin { width: 110px; font-family: var(--mono); font-size: 25px; font-weight: 700; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 3px 8px; text-align: center; outline: none;
        -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s, color .2s; vertical-align: middle; }
    .numin:focus { border-color: var(--pink); }
    .numin.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .numin.wrong { border-style: dashed; animation: shake .4s; }
    .seg { display: flex; gap: 8px; }
    .seg button { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 6px;
        padding: 6px 0 5px; width: 116px; cursor: pointer; transition: background-color .2s, border-color .2s, color .2s, opacity .2s; }
    .seg button:hover:not(:disabled) { background: #f6f7fb; }
    .seg button.sel { background: var(--tint); border-color: var(--pink); }
    .seg button.right { background: var(--pink); border-color: var(--pink); color: #fff; }
    .seg button.wrong { border-style: dashed; opacity: .45; animation: shake .4s; }
    .seg button:disabled { cursor: default; }

    /* order */
    .ordwrap { display: grid; grid-template-columns: 420px 1fr; gap: 26px; width: 100%; height: 100%; }
    .ordright { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .srow { display: flex; align-items: center; gap: 14px; }
    .srow .num { width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 25px; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .oslot { flex: 1; height: 48px; justify-content: flex-start; padding: 0 4px; }
    .ordright .tile.sm { font-size: 20px; padding: 4px 12px; }
    .oslot .tile { box-shadow: none; }
    .ordright .pool { flex: 1; align-content: center; }

    /* slider */
    .rng { position: absolute; -webkit-appearance: none; appearance: none; background: transparent; height: 40px; margin: 0; cursor: pointer; }
    .rng::-webkit-slider-runnable-track { height: 40px; background: transparent; }
    .rng::-moz-range-track { height: 40px; background: transparent; }
    .rng::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: 5px; border-radius: 50%; background: var(--pink); border: 4px solid #fff; box-shadow: 0 0 0 3px var(--pink); }
    .rng::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--pink); border: 4px solid #fff; box-shadow: 0 0 0 3px var(--pink); }
    .rng:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; border-radius: 6px; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 22px 60px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .scorecard .big { font-family: var(--cond); font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 8px; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }

    /* buckles */
    .hright { display: flex; align-items: flex-end; gap: 28px; }
    .bcount { display: flex; align-items: center; gap: 10px; }
    .counter-icon { width: 34px; height: 34px; display: block; }
    .bcount .num { font-family: var(--cond); font-size: 34px; font-weight: 900; line-height: 1; }
    .bcount .lbl { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    .done-buckle { width: 90px; height: 90px; }
    .scorecard .sub { margin-top: 22px; }
    .award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
        background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
    .award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
    .award-img { width: 140px; height: auto; }
    .award-text { font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
    .confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Checking <span>conditionals</span></h1>
        <div class="hright">
            <div class="counter" id="counter"></div>
            <div class="bcount" title="Buckles earned">
                <img src="buckle.svg" alt="" class="counter-icon" onerror="this.style.visibility='hidden'">
                <div class="num" id="buckleCount">0</div>
                <div class="lbl">Buckles</div>
            </div>
        </div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img" onerror="this.style.display='none'">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', LT = '#f0f3f6', SC = '#10132c', NS = 'http://www.w3.org/2000/svg';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function sel(tag, attrs = {}, html) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }
const fadeIn = (node, d = 300) => { node.setAttribute('opacity', 0); return play(d, k => node.setAttribute('opacity', k)); };

/* ---------- code helpers ---------- */
const KW = new Set(['if', 'else', 'elif', 'True', 'False', 'and', 'or', 'not']);
function tokens(line) {
    const re = /("[^"]*"?|'[^']*'?)|(-?\d+(?:\.\d+)?)|([A-Za-z_]\w*)|(\s+)|(==|!=|<=|>=|.)/g, out = [];
    let m;
    while ((m = re.exec(line))) { const t = m[0]; out.push({ t, k: m[1] ? 's' : m[2] ? 'n' : m[3] ? (KW.has(t) ? 'k' : t === 'print' ? 'f' : 'v') : m[4] ? 'w' : 'o' }); }
    return out;
}
const codeHTML = line => tokens(line).map(x => x.k === 'w' ? x.t : `<span class="${x.k}">${esc(x.t)}</span>`).join('');
const codeTS = (line, p = 'c-') => tokens(line).map(x => x.k === 'w' ? x.t : `<tspan class="${p}${x.k}">${esc(x.t)}</tspan>`).join('');
/* working out: [value] marks a swapped-in value */
const subTS = (s, p = 'l-') => s.split(/\[(.+?)\]/).map((x, i) => i % 2 ? `<tspan fill="${PK}" font-weight="700">${esc(x)}</tspan>` : codeTS(x, p)).join('');
const subHTML = s => s.split(/\[(.+?)\]/).map((x, i) => i % 2 ? `<b style="color:${PK}">${esc(x)}</b>` : esc(x)).join('');

/* ---------- memory box ---------- */
const REST = -18;
function chipSVG(val) {
    const w = Math.max(64, String(val).length * 14.4 + 30), str = /^["']/.test(val);
    return `<rect x="${-w / 2}" y="-22" width="${w}" height="44" rx="8" fill="#fff" stroke="${NV}" stroke-width="3"/><text class="vval" y="8" text-anchor="middle" fill="${str ? PK : NV}">${esc(val)}</text>`;
}
function boxShape(name) {
    const pw = Math.max(96, name.length * 14.4 + 30), fw = Math.max(170, pw + 36), hw = fw / 2, ins = 22;
    const flap = sx => `<polygon points="${sx * hw},0 ${sx * (hw - ins)},-24 ${sx * (hw + 12)},-38 ${sx * (hw + 34)},-14" fill="${LT}" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>`;
    return { pw, fw, hw,
        back: `${flap(-1)}${flap(1)}<polygon points="${-hw},0 ${-hw + ins},-24 ${hw - ins},-24 ${hw},0" fill="#cfd3df" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>`,
        front: `<rect x="${-hw}" y="0" width="${fw}" height="96" fill="${LT}" stroke="${NV}" stroke-width="4" stroke-linejoin="round"/>
            <rect x="${-pw / 2}" y="30" width="${pw}" height="40" rx="6" fill="#fff" stroke="${PK}" stroke-width="3"/>
            <text class="vname" x="0" y="58" text-anchor="middle">${esc(name)}</text>` };
}
function vbox(layer, cx, ry, name, s = 1) {
    const sh = boxShape(name);
    const g = sel('g', { transform: `translate(${cx} ${ry}) scale(${s})` });
    g.innerHTML = `${sh.back}<g class="vals"></g>${sh.front}`;
    layer.appendChild(g);
    const vals = g.querySelector('.vals');
    return {
        g, cur: null, val: null,
        set(val) { vals.innerHTML = ''; this.cur = null; this.val = null; if (val === undefined) return; const c = sel('g', { transform: `translate(0 ${REST})` }, chipSVG(val)); vals.appendChild(c); this.cur = c; this.val = val; },
        appear() { return play(380, k => { const e = easeOut(k); g.setAttribute('opacity', k); g.setAttribute('transform', `translate(${cx} ${ry + 14 * (1 - e)}) scale(${s})`); }); },
        async put(val, from) {
            const old = this.cur, c = sel('g', {}, chipSVG(val));
            vals.appendChild(c); this.cur = c; this.val = val;
            const fx = from ? from.x : 0, fy = from ? from.y : -170;
            c.setAttribute('transform', `translate(${fx} ${fy})`); c.setAttribute('opacity', from ? 1 : 0);
            const outP = old ? play(480, k => { const e = easeInOut(k); old.setAttribute('transform', `translate(${150 * e} ${REST - 110 * easeOut(k)}) rotate(${18 * e})`); old.setAttribute('opacity', 1 - k); }).then(() => old.remove()) : Promise.resolve();
            if (old) await wait(260);
            await play(from ? 700 : 520, k => { const e = easeInOut(k); c.setAttribute('transform', `translate(${fx * (1 - e)} ${fy + (REST - fy) * (from ? e : easeOut(k))})`); if (!from) c.setAttribute('opacity', Math.min(1, k * 2.5)); });
            await outP;
        },
        pulse() {
            const r = this.cur && this.cur.querySelector('rect'); if (!r) return Promise.resolve();
            return play(600, k => { const p = Math.sin(k * Math.PI); r.setAttribute('stroke', p > .15 ? PK : NV); r.setAttribute('stroke-width', 3 + 3 * p); });
        }
    };
}
const replayIcon = `<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>`;

/* ---------- True / False pill ---------- */
function pillSVG(cx, cy, v, small) {
    const w = small ? 78 : 96, h = small ? 26 : 34, fs = small ? 17 : 20;
    const fill = v === true ? PK : v === false ? (small ? '#fff' : NV) : '#fff', tf = v === '?' ? '#9aa0bd' : v === false && small ? NV : '#fff', t = v === true ? 'True' : v === false ? 'False' : '?';
    const st = v === '?' ? `stroke="${GR}" stroke-width="3" stroke-dasharray="6 5"` : v === false && small ? `stroke="${NV}" stroke-width="2"` : '';
    return `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" ${st}/><text class="pt" x="${cx}" y="${cy + fs * .36}" text-anchor="middle" fill="${tf}" style="font-size:${fs}px">${t}</text>`;
}
async function popIn(g, cx, cy) {
    g.setAttribute('opacity', 0);
    await play(320, k => { const s = .6 + .4 * easeOut(k); g.setAttribute('opacity', Math.min(1, k * 2)); g.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`); });
}

/* ---------- condition working-out panel ---------- */
function condBox(layer, x, y, w, h) {
    const g = sel('g'); layer.appendChild(g);
    const row = h < 90, cx = x + w / 2, top = y + 30, av = h - 30;
    const ex = Math.max(0, av - 108) / 2, ye = row ? y + h / 2 + 8 : top + ex + 24, ys = row ? ye : top + ex + 58, yp = row ? y + h / 2 : top + ex + 90;
    const tx = row ? x + 140 : cx, fz = row ? 'style="font-size:19px"' : '', an = row ? 'start' : 'middle', px = row ? x + w - 50 : cx;
    g.innerHTML = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="#f5f6fa"/><text class="plab dk" x="${x + 14}" y="${row ? y + h / 2 + 6 : y + 24}">Condition</text><g class="e"></g><g class="s"></g><g class="r"></g>`;
    const E = g.querySelector('.e'), S = g.querySelector('.s'), R = g.querySelector('.r');
    const B = {
        hasE: false, hasS: false,
        reset() { E.innerHTML = S.innerHTML = R.innerHTML = ''; E.removeAttribute('opacity'); this.hasE = this.hasS = false; },
        async expr(e, now) { this.hasE = true; E.innerHTML = `<text class="cd" x="${tx}" y="${ye}" text-anchor="${an}" ${fz} xml:space="preserve">${codeTS(e, 'l-')}</text>`; if (!now) await fadeIn(E); else E.setAttribute('opacity', 1); },
        async sub(s, now) {
            this.hasS = true;
            if (row && E.innerHTML && !now) await play(200, k => E.setAttribute('opacity', 1 - k));
            if (row) E.setAttribute('opacity', 0);
            S.innerHTML = `<text class="cd" x="${tx}" y="${ys}" text-anchor="${an}" ${fz} xml:space="preserve">${subTS(s)}</text>`; if (!now) await fadeIn(S); else S.setAttribute('opacity', 1);
        },
        async res(v, now) { R.innerHTML = pillSVG(px, yp, v, row); R.removeAttribute('transform'); if (!now) await popIn(R, px, yp); else R.setAttribute('opacity', 1); }
    };
    return B;
}

/* ---------- memory + condition column ---------- */
function Side(layer, x, y, w, h, o = {}) {
    const mh = o.mh || Math.round(h * .47);
    const g = sel('g'); layer.appendChild(g);
    g.innerHTML = `<rect x="${x}" y="${y}" width="${w}" height="${mh}" rx="8" fill="#f5f6fa"/><text class="plab dk" x="${x + 14}" y="${y + 24}">Memory</text><text class="note sn" text-anchor="middle"></text><g class="mm"></g>`;
    const mm = g.querySelector('.mm'), sn = g.querySelector('.sn'), boxes = {}, vars = o.vars || [];
    const cb = condBox(g, x, y + mh + 12, w, h - mh - 12);
    const pos = name => {
        const n = Math.max(1, vars.length), i = Math.max(0, vars.indexOf(name)), s = Math.min(n > 1 ? .5 : .66, (mh - 40) / 140), c = y + 30 + (mh - 38) / 2;
        return { x: x + w * (i + .5) / n, y: c - 28 * s, s };
    };
    const mk = name => { const p = pos(name); boxes[name] = vbox(mm, p.x, p.y, name, p.s); return boxes[name]; };
    return {
        cb, box: n => boxes[n],
        note(t) { const ls = (t || '').split('\n'); sn.innerHTML = t ? ls.map((l, i) => `<tspan x="${x + w / 2}" y="${y + mh / 2 + 12 + (i - (ls.length - 1) / 2) * 24}">${esc(l)}</tspan>`).join('') : ''; },
        reset() { mm.innerHTML = ''; for (const k in boxes) delete boxes[k]; cb.reset(); this.note(''); },
        async assign(name, val) { let b = boxes[name]; if (!b) { b = mk(name); b.g.setAttribute('opacity', 0); this.note(''); await b.appear(); } await b.put(val); },
        set(name, val) { (boxes[name] || mk(name)).set(val); this.note(''); }
    };
}

/* ---------- code runner scene: code panel, screen, memory, condition ---------- */
function codeScene(svg, code, o = {}) {
    const W = o.w || 740, H = o.h || 330, CW = o.cw || 410, FS = o.fs || 21, LH = o.lh || 32, n = code.length, CH = 44 + n * LH + 10;
    const top = i => 14 + 44 + i * LH, base = i => top(i) + LH / 2 + FS * .36;
    let SY = 14 + CH + 12, CRY = null;
    if (o.condRow) { CRY = SY; SY += o.condRow + 12; }
    const SH = H - 14 - SY, compact = SH < 64;
    const oy = k => compact ? SY + SH / 2 + 7 : SY + 50 + k * 27, ox = compact ? 128 : 28;
    let lines = '';
    code.forEach((ln, i) => { lines += `<g class="cl" data-i="${i}"><text class="ln" x="40" y="${base(i)}" text-anchor="end">${i + 1}</text><text class="cd" x="54" y="${base(i)}" style="font-size:${FS}px" xml:space="preserve">${codeTS(ln)}</text></g>`; });
    svg.innerHTML = `<rect x="14" y="14" width="${CW}" height="${CH}" rx="8" fill="${NV}"/><text class="plab" x="28" y="37">Code</text>
        <g class="hl" opacity="0"><rect x="14" y="0" width="${CW}" height="${LH}" fill="rgba(234,0,138,.32)"/><rect x="14" y="0" width="6" height="${LH}" fill="${PK}"/></g>${lines}<g class="pl"></g>
        <rect x="14" y="${SY}" width="${CW}" height="${SH}" rx="8" fill="${SC}"/><text class="plab" x="28" y="${compact ? SY + SH / 2 + 6 : SY + 24}">Screen</text><g class="out"></g>
        <rect class="cur" width="12" height="22" fill="${PK}" style="display:none"/><g class="sd"></g>`;
    const hl = svg.querySelector('.hl'), out = svg.querySelector('.out'), cur = svg.querySelector('.cur'), pl = svg.querySelector('.pl'), sd = svg.querySelector('.sd');
    const side = o.noMem ? null : Side(sd, CW + 30, 14, W - CW - 44, H - 28, { vars: o.vars });
    const cb = side ? side.cb : o.condRow ? condBox(sd, 14, CRY, CW, o.condRow) : null;
    let outN = 0, pillAt = -1;
    const S = {
        side, cb, introDone: false,
        mark(i) { if (i < 0) { hl.setAttribute('opacity', 0); return; } pillAt = i; hl.setAttribute('transform', `translate(0 ${top(i)})`); hl.setAttribute('opacity', 1); },
        dim(list) { list.forEach(i => { const g = svg.querySelector(`.cl[data-i="${i}"]`); if (g) play(300, k => g.setAttribute('opacity', 1 - .7 * k)); }); },
        cursor(on) { cur.setAttribute('x', ox); cur.setAttribute('y', oy(outN) - 18); cur.style.display = on ? '' : 'none'; },
        reset() { out.innerHTML = ''; outN = 0; this.mark(-1); this.cursor(false); pl.innerHTML = ''; svg.querySelectorAll('.cl').forEach(g => g.removeAttribute('opacity')); if (side) side.reset(); else if (cb) cb.reset(); },
        async type(txt, err) {
            const t = sel('text', { class: 'otxt' + (err ? ' err' : ''), x: ox, y: oy(outN), 'xml:space': 'preserve' });
            out.appendChild(t); outN++; this.cursor(false);
            await play(Math.max(250, txt.length * 45), k => { t.textContent = txt.slice(0, Math.round(k * txt.length)); });
        },
        show(lines) { this.cursor(false); [].concat(lines).forEach(l => { out.appendChild(sel('text', { class: 'otxt', x: ox, y: oy(outN), 'xml:space': 'preserve' }, esc(l))); outN++; }); },
        pill: cb ? null : async v => { const g = sel('g'); pl.appendChild(g); const px = 14 + CW - 52, py = top(pillAt) + LH / 2; g.innerHTML = pillSVG(px, py, v, true); await popIn(g, px, py); }
    };
    return S;
}

/* ---------- one step of a trace (works for svg scenes and html editors) ---------- */
async function runStep(S, s) {
    S.mark(s.ln); await wait(420);
    const sd = S.side;
    if (s.r && sd && sd.box(s.r)) { await sd.box(s.r).pulse(); await wait(150); }
    if (s.a && sd) { await sd.assign(s.a[0], s.a[1]); await wait(320); }
    if (s.c) {
        const c = s.c, v = c.e.split(' ')[0];
        if (S.cb) {
            if (!S.cb.hasE) { await S.cb.expr(c.e); await wait(250); }
            if (!S.cb.hasS) { if (sd && sd.box(v)) await sd.box(v).pulse(); await S.cb.sub(c.s); await wait(300); }
            await S.cb.res(c.r);
        }
        if (S.pill) await S.pill(c.r);
        await wait(250);
        if (s.skip) S.dim(s.skip);
        await wait(450);
    }
    if (s.p !== undefined) { for (const l of [].concat(s.p)) await S.type(l, s.err); await wait(320); }
}
async function runAll(S, steps) { S.reset(); await wait(250); for (const s of steps) await runStep(S, s); S.mark(-1); }

/* html editor rows + side svg, driven by the same steps */
function htmlRunner(rows, scr, side) {
    let outN = 0;
    return {
        side, cb: side ? side.cb : null,
        mark(i) { rows.forEach((r, k) => r.classList.toggle('on', k === i)); },
        dim(list) { list.forEach(i => rows[i] && rows[i].classList.add('skip')); },
        reset() { rows.forEach(r => r.classList.remove('on', 'skip', 'bad')); scr.innerHTML = '<span class="lab">Screen</span>'; outN = 0; if (side) side.reset(); },
        async type(txt) { const d = el('div', ''); scr.appendChild(d); outN++; await play(Math.max(250, txt.length * 45), k => { d.textContent = txt.slice(0, Math.round(k * txt.length)); }); }
    };
}

/* ---------- flowcharts ---------- */
function flowSVG(F, o = {}) {
    const { cx, cy, hw, hh, lx, rx, jy, by } = F;
    const ah = x => `<polygon points="${x - 9},${by - 13} ${x + 9},${by - 13} ${x},${by}" fill="${NV}"/>`;
    return `<g stroke="${NV}" stroke-width="3" fill="none"><polyline points="${cx},${cy + hh} ${cx},${jy}"/><polyline points="${lx},${by - 12} ${lx},${jy} ${rx},${jy} ${rx},${by - 12}"/></g>${ah(lx)}${ah(rx)}
        <text class="yn ynl" x="${lx - 12}" y="${by - 10}" text-anchor="end">YES</text><text class="yn ynr" x="${rx + 12}" y="${by - 10}">NO</text>
        <g class="trc"></g>
        <path class="dia" d="M${cx} ${cy - hh} L${cx + hw} ${cy} L${cx} ${cy + hh} L${cx - hw} ${cy} Z" fill="#fff" stroke="${PK}" stroke-width="4" stroke-linejoin="round"/>
        <g class="dt">${o.text ? `<text class="dtxt" x="${cx}" y="${cy + 9}" text-anchor="middle">${o.text}</text>` : ''}</g>`;
}
function flowBox(F, side, label, fill = true) {
    const x = (side ? F.rx : F.lx) - F.bw / 2;
    return fill ? `<rect class="fb${side}" x="${x}" y="${F.by}" width="${F.bw}" height="${F.bh}" rx="5" fill="${NV}" stroke="${NV}" stroke-width="3"/><text class="btxt" x="${x + F.bw / 2}" y="${F.by + F.bh / 2 + 8}" text-anchor="middle">${esc(label)}</text>`
        : `<rect x="${x}" y="${F.by}" width="${F.bw}" height="${F.bh}" rx="5" fill="#fff" stroke="${NV}" stroke-width="3"/>`;
}
async function tracePath(layer, F, side, dur = 750) {
    const x = side ? F.rx : F.lx, pts = [[F.cx, F.cy + F.hh], [F.cx, F.jy], [x, F.jy], [x, F.by - 4]];

function burstConfetti() {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ['#ea008a', '#1b1f45', '#f7a8d4', '#c3c6d0'], cx = innerWidth / 2, cy = innerHeight / 2, parts = [];
    for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 4 + Math.random() * 10;
        parts.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4, size: 5 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * .3, life: 0 });
    }

        parts.forEach(p => {
            p.vx *= drag; p.vy = p.vy * drag + gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;

}

        left.append(ed, scr);
        const memS = el('div', 'scene flat');
        memS.innerHTML = `<svg viewBox="0 0 470 330" width="470" height="330"></svg>`;
        body.append(left, memS);
        const side = Side(memS.querySelector('svg'), 0, 0, 470, 330, { vars: q.vars });
        const R = htmlRunner(rows, scr, side);
        if (q.err) {
            scr.insertAdjacentHTML('beforeend', `<span class="err">${esc(q.err)}</span>`); rows[q.edit].classList.add('bad');
            side.note('Empty. Python found a syntax error,\nso no lines have run.');
        } else if (q.pre) {
            side.set(...q.pre.a); side.cb.expr(q.pre.c.e, true); side.cb.sub(q.pre.c.s, true); side.cb.res(q.pre.c.r, true);
            q.pre.skip.forEach(i => rows[i].classList.add('skip')); scr.insertAdjacentHTML('beforeend', `<div>${esc(q.pre.out)}</div>`);
        }
        inp.addEventListener('input', () => { inp.classList.remove('wrong'); refresh(); });
        enterSubmits(inp);
        setTimeout(() => inp.focus({ preventScroll: true }), 50);
        let last = '';
        return {
            instr: `Edit line ${q.edit + 1}, then press <b>Check</b> to run it.`,
            ready: () => inp.value.trim() !== '' && inp.value.trim() !== q.bug && inp.value !== last,
            check() {
                last = inp.value;
                const n = inp.value.trim().replace(/\s+/g, '');
                if (q.accept(n)) { inp.classList.add('right'); inp.readOnly = true; return { ok: true }; }
                inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong');
                return { ok: false, hint: q.hint(n) };
            },
            done() { runId++; runAll(R, q.steps(inp.value.trim().replace(/\s+/g, ''))); }
        };
    },

    /* sort conditions into True / False */
    sort2(q, body) {
        const wrap = el('div', 'sort');
        const mk = (cls, h, sub) => { const b = el('div', 'bin ' + cls, `<h3>${h}</h3><div class="sub">${sub}</div><div class="area"></div>`); b.tabIndex = 0; return b; };
        const bt = mk('pk', 'True', 'The if branch would run'), bf = mk('', 'False', 'The else branch would run');
        const mid = el('div', 'midcol'), pool = el('div', 'pool');
        mid.append(el('div', 'given', `score = <span class="n">10</span>`), pool);
        wrap.append(bt, mid, bf); body.appendChild(wrap);
        const zones = [{ el: bt, box: bt.querySelector('.area'), cap: Infinity, key: 't' }, { el: bf, box: bf.querySelector('.area'), cap: Infinity, key: 'f' }];
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle(q.items).forEach(([t, k, h]) => { const tl = D.tile(t); tl.classList.add('code'); tl.k = k; tl.h = h; pool.appendChild(tl); });
        return {
            instr: 'Drag each condition into a group (or tap it, then a group), then press <b>Check</b>.',
            ready: () => !pool.querySelector('.tile'),
            check() {
                const wrong = [];
                zones.forEach(z => z.box.querySelectorAll('.tile').forEach(t => {
                    if (t.classList.contains('right')) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === z.key) t.classList.add('right'); else { t.classList.add('wrong'); wrong.push(t.h); }
                }));
                return wrong.length ? { ok: false, hint: (wrong.length > 1 ? `${wrong.length} conditions need moving. ` : '') + wrong[0] } : { ok: true };
            }
        };
    },

    /* code panel + quote + multiple choice */
    mcside(q, body) {
        const side = el('div', 'scene');
        side.innerHTML = `<svg viewBox="0 0 400 330" width="397" height="327"></svg>`;
        const col = el('div', 'col'); col.style.flex = '1';
        if (q.quote) col.appendChild(el('div', 'quote', q.quote));
        const g = el('div', 'opts');
        const els = q.opts.map((o, i) => { const b = el('button', 'opt', `<span class="l">${L[i]}</span><span>${o.t}</span>`); g.appendChild(b); return b; });
        col.appendChild(g); body.append(side, col);
        body.style.justifyContent = 'flex-start';
        const S = codeScene(side.querySelector('svg'), q.code, { noMem: true, cw: 372, w: 400, fs: 20, lh: 32 });
        if (q.pre) S.show(q.pre); else S.cursor(true);
        return mcCore(els, q, { done: () => { runId++; runAll(S, q.steps); } });
    },

    /* tap every line that prints */
    tapmulti(q, body) {
        const panel = el('div', 'lines dk');
        const els = q.code.map((c, i) => {
            const b = el('button', 'lbtn', `<span class="ln2">${i + 1}</span><span>${codeHTML(c)}</span>`); panel.appendChild(b);
            b.onclick = () => { if (mode !== 'check' || b.disabled) return; b.classList.toggle('sel'); refresh(); };
            return b;
        });
        const right = el('div', 'col'); right.style.cssText = 'gap:12px;width:480px';
        const scr = el('div', 'screen', `<span class="lab">Screen</span><span class="curs"></span>`); scr.style.minHeight = '92px';
        const memS = el('div', 'scene flat');
        memS.innerHTML = `<svg viewBox="0 0 480 262" width="480" height="262"></svg>`;
        right.append(scr, memS); body.append(panel, right);
        const side = Side(memS.querySelector('svg'), 0, 0, 480, 262, { vars: q.vars, mh: 106 });
        side.note('Empty until the code runs');
        const R = htmlRunner(els, scr, side);
        return {
            instr: 'Tap to select (tap again to undo), then press <b>Check</b>.',
            ready: () => els.some(b => b.classList.contains('sel')),
            check() {
                let hint = null;
                els.forEach((b, i) => {
                    if (!b.classList.contains('sel')) return;
                    b.classList.remove('sel');
                    if (q.answer.includes(i)) { b.classList.add('right'); b.disabled = true; }
                    else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 900);
                        if (!hint) hint = q.hints[i] || `Line ${i + 1} doesn\u2019t print anything. Only tap lines that show something on the screen.`; }
                });
                if (hint) return { ok: false, hint };
                const miss = q.answer.find(i => !els[i].classList.contains('right'));
                if (miss !== undefined) return { ok: false, hint: q.hints['miss' + miss] };
                els.forEach(b => b.disabled = true);
                return { ok: true };
            },
            done() { runId++; els.forEach(b => b.classList.remove('right')); runAll(R, q.steps).then(() => q.answer.forEach(i => els[i].classList.add('right'))); }
        };
    },

    /* order the steps */
    order(q, body) {
        const wrap = el('div', 'ordwrap');
        const sc = el('div', 'scene');
        sc.innerHTML = `<svg viewBox="0 0 414 350" width="414" height="350"></svg>`;
        const S = codeScene(sc.querySelector('svg'), q.code, { w: 414, h: 350, cw: 386, noMem: true, fs: 20, lh: 30, condRow: 62 });
        S.cursor(true);
        const rightCol = el('div', 'ordright'), zones = [];
        q.steps.forEach((_, i) => {
            const row = el('div', 'srow', `<span class="num">${i + 1}</span>`), z = el('div', 'oslot'); z.tabIndex = 0; z.setAttribute('aria-label', 'Step ' + (i + 1));
            row.appendChild(z); rightCol.appendChild(row);
            zones.push({ el: z, box: z, cap: 1, key: i, onPut: () => z.classList.add('filled'), onTake: () => z.classList.remove('filled') });
        });
        const pool = el('div', 'pool'); rightCol.appendChild(pool);
        wrap.append(sc, rightCol); body.appendChild(wrap);
        const D = dnd({ el: pool, box: pool, cap: Infinity, pool: true }, zones, () => refresh());
        shuffle([...q.steps.map((s, i) => [s[0], i, s[1]]), [q.extra[0], -1, q.extra[1]]]).forEach(([t, k, h]) => { const tl = D.tile(t); tl.classList.add('sm'); tl.k = k; tl.h = h; pool.appendChild(tl); });
        return {
            instr: 'Drag the steps into order (or tap a step, then a space). One step is not needed.',
            ready: () => zones.every(z => z.box.querySelector('.tile')),
            check() {
                let bad = 0, hint = null;
                zones.forEach(z => {
                    const t = z.box.querySelector('.tile'); if (!t || z.locked) return;
                    t.classList.remove('wrong'); void t.offsetWidth;
                    if (t.k === z.key) { t.classList.add('right'); z.locked = true; }
                    else { bad++; t.classList.add('wrong'); if (!hint) hint = t.h; }
                });
                return bad ? { ok: false, hint: (bad > 1 ? `${bad} steps need moving. ` : '') + hint } : { ok: true };
            },
            done: () => { runId++; runAll(S, q.run); }
        };
    },

    /* slide a value to the boundary */
    slider(q, body) {
        const F = { cx: 380, cy: 74, hw: 180, hh: 56, lx: 200, rx: 560, jy: 152, by: 182, bw: 240, bh: 62 };
        const NX0 = 60, NX1 = 700, NY = 292, span = q.max - q.min, nx = v => NX0 + (v - q.min) * (NX1 - NX0) / span;
        const wrap = el('div', 'bwrap'); wrap.style.width = '760px';
        let ticks = '';
        for (let v = q.min; v <= q.max; v++) ticks += `<line x1="${nx(v)}" x2="${nx(v)}" y1="${NY - 9}" y2="${NY + 9}" stroke="${GR}" stroke-width="3"/><text class="tick" x="${nx(v)}" y="${NY + 34}" text-anchor="middle">${v}</text>`;
        wrap.innerHTML = `<svg viewBox="0 0 760 336" width="760" height="336">${flowSVG(F, { text: q.text })}${flowBox(F, 0, q.boxes[0])}${flowBox(F, 1, q.boxes[1])}<g class="hi"></g>
            <line x1="${NX0}" x2="${NX1}" y1="${NY}" y2="${NY}" stroke="${NV}" stroke-width="3"/>${ticks}</svg>`;
        const rng = el('input', 'rng'); rng.type = 'range'; rng.min = q.min; rng.max = q.max; rng.step = 1; rng.value = q.start; rng.setAttribute('aria-label', 'Value of ' + q.name);
        Object.assign(rng.style, { left: (NX0 - 15) + 'px', width: (NX1 - NX0 + 30) + 'px', top: (NY - 20) + 'px' });
        wrap.appendChild(rng);
        const sideW = el('div', 'scene flat'); sideW.innerHTML = `<svg viewBox="0 0 360 336" width="360" height="336"></svg>`;
        body.append(wrap, sideW);
        const svg = wrap.querySelector('svg'), hi = svg.querySelector('.hi'), trc = svg.querySelector('.trc');
        const side = Side(sideW.querySelector('svg'), 0, 0, 360, 336, { vars: [q.name] });
        const cmp = v => q.op === '>=' ? v >= q.target : v > q.target;
        let moved = false, last = null;
        const show = () => {
            runId++; const v = +rng.value;
            side.set(q.name, String(v)); side.cb.expr(`${q.name} ${q.op} ${q.target}`, true); side.cb.sub(`[${v}] ${q.op} ${q.target}`, true); side.cb.res('?', true);
            hi.innerHTML = ''; trc.innerHTML = ''; svg.querySelectorAll('.yn').forEach(t => t.style.fill = '');
        };
        const animate = async v => {
            show(); const r = cmp(v), sd = r ? 0 : 1;
            await side.box(q.name).pulse(); await side.cb.res(r); yesNo(svg, sd);
            await tracePath(trc, F, sd);
            hi.innerHTML = `<rect x="${(sd ? F.rx : F.lx) - F.bw / 2 - 6}" y="${F.by - 6}" width="${F.bw + 12}" height="${F.bh + 12}" rx="9" fill="none" stroke="${PK}" stroke-width="5"/>`;
        };
        rng.addEventListener('input', () => { moved = true; show(); refresh(); });
        show();
        return {
            instr: 'Drag the slider (or use the arrow keys), then press <b>Check</b>.',
            ready: () => moved && +rng.value !== last,
            check() {
                const v = +rng.value; last = v; animate(v);
                if (v === q.target) { rng.disabled = true; return { ok: true }; }
                if (!cmp(v)) return { ok: false, hint: `${v} ${q.op} ${q.target} is False, so ${q.boxes[1]} runs. Try a bigger ${q.name}.` };
                return { ok: false, hint: `${v} works, but a smaller ${q.name} also makes the condition True. Remember <code>${q.op}</code> includes ${q.target}.` };
            }
        };
    },

    /* write the if / else */
    write(q, body) {
        const left = el('div', 'col'); left.style.cssText = 'gap:12px;width:620px';
        const ed = el('div', 'editor dk', `<span class="lab">Your code</span>`), rows = [], ins = [];
        const r0 = el('div', 'erow', `<span class="ln2">1</span><span class="static">${codeHTML('lives = 0')}</span>`); rows.push(r0); ed.appendChild(r0);
        [false, true, false, true].forEach((indent, k) => {
            const r = el('div', 'erow', `<span class="ln2">${k + 2}</span>${indent ? '<span class="ind" title="Indent">\u00b7\u00b7\u00b7\u00b7</span>' : ''}`), inp = el('input', 'codein');
            inp.spellcheck = false; inp.autocomplete = 'off'; inp.setAttribute('autocapitalize', 'off'); inp.setAttribute('aria-label', 'Line ' + (k + 2));
            inp.addEventListener('input', () => { inp.classList.remove('wrong'); refresh(); });
            inp.addEventListener('keydown', e => { if (e.key !== 'Enter') return; e.preventDefault(); if (k < 3) ins[k + 1].focus(); else if (!btn.disabled && mode === 'check') check(); });
            r.appendChild(inp); ed.appendChild(r); rows.push(r); ins.push(inp);
        });
        const scr = el('div', 'screen', `<span class="lab">Screen</span>`); scr.style.minHeight = '84px';
        left.append(ed, scr);
        const memS = el('div', 'scene flat'); memS.innerHTML = `<svg viewBox="0 0 470 330" width="470" height="330"></svg>`;
        body.append(left, memS);
        const side = Side(memS.querySelector('svg'), 0, 0, 470, 330, { vars: ['lives'] });
        side.note('Empty until your code runs');
        const R = htmlRunner(rows, scr, side);
        setTimeout(() => ins[0].focus({ preventScroll: true }), 50);
        const pr = (v, want) => {
            if (!v) return `This line is empty. Print <code>${want}</code>.`;
            if (/^print/i.test(v) && !/^print/.test(v)) return 'Python is case sensitive. <code>print</code> is all lowercase.';
            if (!/^print/.test(v)) return `Use <code>print</code> to show <code>${want}</code>.`;
            if (!/\(/.test(v) || !/\)$/.test(v)) return '<code>print</code> needs brackets around what it shows.';
            if (!/["']/.test(v)) return 'Text needs quotes, at the start and at the end.';
            return `Check the text. It should be exactly <code>${want}</code>, in quotes.`;
        };
        const H = [
            v => !v ? 'This line is empty. Start with <code>if</code>.'
                : /^if/i.test(v) && !/^if/.test(v) ? 'Python is case sensitive. <code>if</code> is all lowercase.'
                : !/^if\b/.test(v) ? 'Line 2 asks the question, so it starts with <code>if</code>.'
                : !/:\s*$/.test(v) ? 'End the if line with a colon.'
                : !/\blives\b/.test(v) ? 'The condition should check the variable <code>lives</code>.'
                : /[^=!<>]=[^=]/.test(v) ? 'One <code>=</code> stores a value. To check if lives is 0, use <code>==</code>.'
                : /(>=|<=|!=|>|<)/.test(v) ? 'Check if lives is <b>exactly</b> 0. Which symbol means equal to?'
                : 'Use the pattern <code>if lives == 0:</code>.',
            v => pr(v, 'Game over'),
            v => !v ? 'This line is empty. Type <code>else:</code>.'
                : /^else/i.test(v) && !/^else/.test(v) ? 'Python is case sensitive. <code>else</code> is all lowercase.'
                : /^else\s*$/.test(v) ? '<code>else</code> needs a colon at the end too.'
                : /^else\s*\w/.test(v) ? '<code>else</code> never has a condition. It catches everything else.'
                : 'Type <code>else</code> followed by a colon.',
            v => pr(v, 'Keep going')
        ];
        const OK = [/^if\s+lives\s*==\s*0\s*:$/, /^print\(\s*(["'])Game over\1\s*\)$/, /^else\s*:$/, /^print\(\s*(["'])Keep going\1\s*\)$/];
        return {
            instr: 'Type lines 2 to 5, then press <b>Check</b> to run your code.',
            ready: () => ins.every(i => i.value.trim() !== ''),
            check() {
                let hint = null;
                ins.forEach((inp, i) => {
                    if (inp.readOnly) return;
                    const v = inp.value.trim();
                    if (OK[i].test(v)) { inp.classList.add('right'); inp.readOnly = true; }
                    else { inp.classList.remove('wrong'); void inp.offsetWidth; inp.classList.add('wrong'); if (!hint) hint = `Line ${i + 2}: ` + H[i](v); }
                });
                return hint ? { ok: false, hint } : { ok: true };
            },
            done() { runId++; runAll(R, q.steps); }
        };
    }
};

/* ---------- drag and drop (drag, or tap a tile then tap a target) ---------- */
function dnd(pool, zones, onChange) {
    let sl = null;
    const all = () => [pool, ...zones];
    const zoneOf = t => all().find(z => z.box.contains(t));
    const armAll = on => zones.forEach(z => z.el.classList.toggle('armed', on && !z.locked));
    const deselect = () => { if (sl) sl.classList.remove('sel'); sl = null; armAll(false); };
    function moveTo(t, z) {
        const from = zoneOf(t);
        t.style.transform = ''; t.classList.remove('wrong');
        z.box.appendChild(t);
        if (from && from !== z && from.onTake) from.onTake(t);
        if (z.onPut) z.onPut(t);
        deselect(); onChange();
    }
    function put(t, z) {
        const from = zoneOf(t);
        if (z.locked || from === z) { t.style.transform = ''; return; }
        if (z.cap === 1) {
            const ex = z.box.querySelector('.tile');
            if (ex) { if (ex.classList.contains('right')) { t.style.transform = ''; return; } moveTo(ex, pool); }
        }
        moveTo(t, z);
    }
    const hit = (x, y) => all().find(z => { const r = z.el.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    all().forEach(z => {
        const act = () => { if (sl && !z.locked) put(sl, z); };
        z.el.addEventListener('click', act);
        z.el.addEventListener('keydown', e => { if (e.target === z.el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(); } });
    });
    function tile(text) {
        const t = el('span', 'tile', esc(text));
        t.tabIndex = 0; t.setAttribute('role', 'button');
        const tap = () => {
            if (t.classList.contains('right') || mode !== 'check') return;
            t.style.transform = '';
            const z = zoneOf(t);
            if (z !== pool) { if (sl && sl !== t && !z.locked) { put(sl, z); return; } put(t, pool); return; }
            if (sl === t) { deselect(); return; }
            deselect(); sl = t; t.classList.add('sel'); armAll(true);
        };
        t.addEventListener('click', e => e.stopPropagation());
        t.addEventListener('pointerdown', e => {
            if (t.classList.contains('right') || mode !== 'check' || e.button > 0) return;
            e.preventDefault(); e.stopPropagation(); t.setPointerCapture(e.pointerId);
            const sx = e.clientX, sy = e.clientY; let moved = false;
            const move = ev => {
                const dx = ev.clientX - sx, dy = ev.clientY - sy;
                if (!moved && Math.hypot(dx, dy) > 6) { moved = true; t.classList.add('drag'); }
                if (!moved) return;
                t.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
                const h = hit(ev.clientX, ev.clientY);
                all().forEach(z => z.el.classList.toggle('hover', z === h));
            };
            const up = ev => {
                t.removeEventListener('pointermove', move); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
                t.classList.remove('drag'); all().forEach(z => z.el.classList.remove('hover'));
                if (!moved) { tap(); return; }
                const h = hit(ev.clientX, ev.clientY);
                if (h) put(t, h); else t.style.transform = '';
            };
            t.addEventListener('pointermove', move); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
        });
        t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); tap(); } });
        return t;
    }
    return { tile };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= TOTAL) finish(); else { qi = Math.max(0, pos); render(); }
});
