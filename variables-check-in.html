<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variables check-in</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .hint { margin-top: 22px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }

    /* cards */
    .cards { display: flex; gap: 32px; }
    .dcard { width: 460px; border: 3px solid var(--navy); border-radius: 8px; padding: 26px 30px; }
    .dcard.pink { border-color: var(--pink); }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-size: 58px; font-weight: 900; margin: 8px 0; }
    .dhow { font-size: 24px; font-weight: 700; }
    .dcard.pink .dhow { color: var(--pink); }

    /* summary */
    .sumgrid { display: grid; grid-template-columns: repeat(2, 540px); gap: 26px 32px; }
    .sumgrid .dcard { width: auto; padding: 22px 30px; }
    .sumgrid .dex { font-size: 48px; margin: 4px 0 6px 0; line-height: 1; }
    .sumgrid .dhow { font-size: 24px; font-weight: 600; }


    /* check-in deck */
    :root { --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace; --cstr: #ff7ac6; --cnum: #7fd8ff; }
    .ck-scene { height: 100%; display: flex; flex-direction: column; }
    .ck-q { font-size: 30px; font-weight: 700; line-height: 1.25; margin-bottom: 20px; }
    .ck-q b { color: var(--pink); font-weight: 800; }
    .ck-q code, .ck-note code, .ck-prints code { font-family: var(--mono); font-size: .9em; font-weight: 500; font-variant-ligatures: none; background: var(--blank); padding: 0 7px; border-radius: 4px; }
    .ck-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 640px 1fr; column-gap: 56px; align-items: center; }
    .ck-left, .ck-right { display: flex; flex-direction: column; gap: 20px; }
    .ck-slot { position: relative; }
    .ck-slot > * { position: absolute; left: 0; top: 0; }
    .ck-stack { display: flex; flex-direction: column; gap: 20px; width: 100%; }

    /* code panel */
    .ck-code { background: var(--navy); color: #fff; border-radius: 10px; padding: 20px 30px 20px 0; font-family: var(--mono); font-size: 34px; line-height: 1.55;
        font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
    .ck-code.inline { display: inline-block; }
    .ck-code.sm { font-size: 26px; padding: 12px 24px 12px 0; }
    .ck-code.tall { padding-bottom: 62px; }
    .ck-cl { display: flex; align-items: center; position: relative; }
    .ck-cl::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--pink); opacity: 0; transition: opacity .25s; }
    .ck-cl.on { background: rgba(255,255,255,.1); }
    .ck-cl.on::before, .ck-cl.bad::before { opacity: 1; }
    .ck-cl.bad { background: rgba(234,0,138,.32); }
    .ck-ln { width: 2.8em; padding-right: 1em; flex-shrink: 0; text-align: right; font-size: .6em; color: #7a7fa8; transition: color .25s; }
    .ck-cl.on .ck-ln, .ck-cl.bad .ck-ln { color: #fff; }
    .ck-cx { white-space: pre; }
    .ck-id { color: #fff; }
    .ck-fn { color: #b8bde6; }
    .ck-str { color: var(--cstr); }
    .ck-num { color: var(--cnum); }
    .ck-op, .ck-p { color: #9aa0c8; }
    .ck-mark { display: inline-block; position: relative; border-radius: 2px; transition: background-color .3s, box-shadow .3s; }
    .ck-mark.on { background: var(--pink); box-shadow: 0 -4px 0 var(--pink), 0 4px 0 var(--pink); }
    .ck-mark.on span:not(.ck-tag) { color: #fff; }
    .ck-tag { position: absolute; left: -5px; right: -5px; top: calc(100% + 12px); padding-top: 7px; border-top: 3px solid var(--pink); text-align: center; white-space: nowrap;
        font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1; color: #fff; }
    .ck-chip { display: inline-block; margin-left: auto; padding: 0 12px; border-radius: 6px; font-family: var(--mono); font-size: 24px; font-weight: 600; line-height: 1.5; }
    .ck-chip.str { background: #fff; color: var(--navy); }
    .ck-chip.int { background: #3a3f78; color: #fff; box-shadow: inset 0 0 0 2px #8f95c9; }
    .ck-chip.float { background: var(--pink); color: #fff; }

    /* output */
    .ck-out .dlbl { margin-bottom: 8px; }
    .ck-screen { min-height: 78px; padding: 12px 22px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; font-family: var(--mono); font-size: 32px; line-height: 1.4; font-variant-ligatures: none; }
    .ck-oline { white-space: pre-wrap; }
    .ck-oline.err { color: var(--pink); font-size: 20px; font-weight: 600; line-height: 1.5; padding: 6px 0; }

    /* prompts and answers */
    .ck-boards { display: inline-flex; align-items: center; gap: 16px; height: 88px; padding: 0 34px; border-radius: 44px; background: var(--pink); color: #fff; white-space: nowrap;
        font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .ck-boards svg { width: 44px; height: 44px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .ck-ans { border: 3px solid var(--pink); border-radius: 8px; padding: 14px 26px 18px; }
    .ck-ans .ck-av { font-family: var(--mono); font-size: 52px; font-weight: 600; color: var(--pink); line-height: 1.15; font-variant-ligatures: none; }
    .ck-note { font-size: 25px; font-weight: 600; line-height: 1.35; border-left: 6px solid var(--pink); padding: 2px 0 2px 18px; }
    .ck-note b { color: var(--pink); font-weight: 800; }
    .ck-fix .dlbl { margin-bottom: 8px; }
    .ck-prints { margin-top: 10px; font-size: 24px; font-weight: 600; }

    /* variable box */
    .ck-vb { position: relative; width: 210px; height: 200px; }
    .ck-vb-body { position: absolute; left: 0; right: 0; bottom: 0; height: 124px; border: 4px solid var(--navy); border-top: none; border-radius: 0 0 10px 10px; background: var(--blank); }
    .ck-vb-body::before, .ck-vb-body::after { content: ''; position: absolute; top: -2px; width: 44px; height: 4px; border-radius: 2px; background: var(--navy); }
    .ck-vb-body::before { left: -42px; transform-origin: right center; transform: rotate(35deg); }
    .ck-vb-body::after { right: -42px; transform-origin: left center; transform: rotate(-35deg); }
    .ck-vb-name { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); padding: 1px 14px; border-radius: 6px; background: var(--navy); color: #fff;
        font-family: var(--mono); font-size: 24px; font-weight: 600; white-space: nowrap; }
    .ck-vb-vals { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .ck-vv { position: absolute; left: 0; right: 0; top: 86px; text-align: center; font-family: var(--mono); font-size: 44px; font-weight: 600; line-height: 1.2; color: var(--pink);
        font-variant-ligatures: none; transition: opacity .45s var(--ease), transform .55s var(--ease); }
    .ck-vv.in { opacity: 0; transform: translateY(-90px); }
    .ck-vv.gone { opacity: 0; transform: translateY(-70px) scale(.7); }
    .ck-vbrow { display: flex; gap: 74px; padding-left: 36px; }

    /* working and trace */
    .ck-work { display: flex; align-items: baseline; gap: 14px; font-family: var(--mono); font-size: 34px; font-weight: 600; font-variant-ligatures: none; }
    .ck-work .dlbl { font-family: 'Barlow Condensed', sans-serif; margin-right: 6px; }
    .ck-work .pk { color: var(--pink); }
    .ck-trace { border-collapse: collapse; width: 100%; }
    .ck-trace th { text-align: left; padding: 0 12px 8px; border-bottom: 4px solid var(--navy); font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .ck-trace th.v { font-family: var(--mono); font-size: 22px; letter-spacing: 0; text-transform: none; color: var(--navy); }
    .ck-trace td { height: 58px; padding: 0 12px; border-bottom: 2px solid var(--light-grey); font-family: var(--mono); font-size: 28px; font-weight: 500; font-variant-ligatures: none; }
    .ck-trace td:first-child { width: 80px; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; }
    .ck-trace td:last-child { width: 130px; color: var(--pink); font-weight: 600; font-size: 34px; }
    .ck-trace tr.on td { background: var(--off-white); }

    /* data type key */
    .ck-key { display: flex; flex-direction: column; gap: 14px; }
    .ck-krow { display: flex; align-items: center; gap: 18px; font-size: 25px; font-weight: 600; }
    .ck-krow .ck-chip { margin-left: 0; min-width: 86px; text-align: center; }
    .ck-key .ck-chip.str { box-shadow: inset 0 0 0 3px var(--navy); }

    /* title steps */
    .ck-steps { display: flex; gap: 28px; margin-top: 46px; }
    .ck-step { width: 320px; border: 3px solid var(--navy); border-radius: 8px; padding: 18px 26px 22px; }
    .ck-step.pink { border-color: var(--pink); }
    .ck-step .n { font-family: 'Barlow Condensed', sans-serif; font-size: 54px; font-weight: 900; line-height: 1; color: var(--pink); }
    .ck-step .t { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; text-transform: uppercase; line-height: 1.1; margin-top: 6px; }
    .ck-step .d { font-size: 22px; font-weight: 600; margin-top: 6px; }

    /* operator symbol card */
    .ck-symc { display: flex; align-items: center; gap: 20px; border: 3px solid var(--pink); border-radius: 8px; padding: 12px 24px; }
    .ck-sym { width: 64px; height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--pink); color: #fff;
        font-family: var(--mono); font-size: 46px; font-weight: 600; line-height: 1; }
    .ck-symw { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 900; text-transform: uppercase; line-height: 1.1; }
    .ck-symd { font-size: 23px; font-weight: 600; }
    .ck-symd code { font-family: var(--mono); font-weight: 600; color: var(--pink); }

    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }
    .ui-pop .ui-mi .ui-ind { width: 14px; height: 14px; border: 2.5px solid var(--navy); border-radius: 3px; flex-shrink: 0; margin-right: 4px; }
    .ui-pop .ui-mi .ui-ind.ui-no { border-color: transparent; }
    .ui-pop .ui-mi.on { background: transparent; color: var(--pink); }
    .ui-pop .ui-mi.on:hover { background: var(--off-white); }
    .ui-pop .ui-mi.on .ui-ind { background: var(--pink); border-color: var(--pink); }
    .ui-pop .ui-mi:disabled { opacity: .35; cursor: default; background: transparent; }
    .ui-pop .ui-mi.ui-eng .ui-ind { border: none; border-radius: 50%; }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-pk { background: var(--pink); }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-nv { background: var(--navy); }
    .ui-pop .ui-swrow { display: flex; gap: 8px; padding: 4px 10px 10px 38px; }
    .ui-pop .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 0 0 1px #c9ccd6; }
    .ui-pop .swatch.cur { box-shadow: 0 0 0 3px var(--navy); }
    .ui-pop .ui-div { height: 1.5px; background: var(--light-grey); margin: 4px 6px; }



    /* highlighter and whiteboard surfaces */
    .ui-hlc { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 4; mix-blend-mode: multiply; }
    .ui-wboard { display: none; position: absolute; left: 0; top: 0; width: 1280px; height: 714px; background: var(--white); z-index: 3; }
    body.ui-wb .ui-wboard { display: block; }
    .ui-wbl { position: absolute; right: 64px; top: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .ui-wbl b { color: var(--navy); }
    .ui-wbg { display: none; }
    body.ui-wb .ui-wbg { display: flex; }
    body.ui-wb .grp.ui-nav { display: none; }
    .ui-wbtag { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); background: var(--pink); border-radius: 6px; padding: 9px 13px; line-height: 1.2; }
    .controls button:disabled { opacity: .35; cursor: default; }
    #ovbtn { padding: 9px 11px; }

    /* overlays */
    .ui-ovw[hidden], .ui-keys[hidden], .ui-blk[hidden] { display: none !important; }
    .ui-ovw { position: fixed; inset: 0; z-index: 45; background: rgba(27,31,69,.96); overflow-y: auto; padding: 40px 48px 60px; opacity: 0; transition: opacity .2s; }
    .ui-ovw.on, .ui-keys.on, .ui-blk.on { opacity: 1; }
    .ui-ovh { display: flex; justify-content: space-between; align-items: flex-end; max-width: 1296px; margin: 0 auto 28px; padding-bottom: 12px; border-bottom: 4px solid var(--white); color: var(--white); }
    .ui-ovh h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .ui-ovh h2 span { color: var(--pink); }
    .ui-ovh .ui-hint, .ui-blk .ui-bh { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .ui-ovh kbd { display: inline-block; padding: 0 6px; border: 1.5px solid currentColor; border-radius: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 13px; line-height: 17px; }
    .ui-ovg { display: grid; grid-template-columns: repeat(auto-fill, 300px); gap: 30px 24px; justify-content: center; max-width: 1296px; margin: 0 auto; }
    .ui-ovc { background: none; border: none; padding: 0; margin: 0; cursor: pointer; text-align: left; color: var(--white); font-family: 'Barlow Condensed', sans-serif; }
    .ui-ovc:focus-visible { outline: none; }
    .ui-ovc .ui-thw { position: relative; width: 300px; height: 168.75px; overflow: hidden; border-radius: 6px; background: var(--white); transition: box-shadow .15s, transform .15s var(--ease); }
    .ui-ovc:hover .ui-thw, .ui-ovc:focus-visible .ui-thw { box-shadow: 0 0 0 3px var(--white); transform: translateY(-3px); }
    .ui-ovc.cur .ui-thw { box-shadow: 0 0 0 4px var(--pink); }
    .ui-ovc .ui-thw .stage { color: var(--navy); position: absolute; left: 0; top: 0; margin: 0; transform: scale(.234375); transform-origin: 0 0; pointer-events: none; }
    .ui-ovc .ui-thw *, .ui-ovc .ui-thw *::before { animation: none !important; transition: none !important; }
    .ui-ovc .ui-lb { display: flex; gap: 10px; margin-top: 10px; font-size: 19px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; line-height: 1.15; }
    .ui-ovc .ui-lb .ui-n { color: var(--pink); min-width: 18px; }
    .ui-ovc .ui-lb .ui-t span { color: var(--pink); }

    .ui-keys { position: fixed; inset: 0; z-index: 45; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(27,31,69,.55); opacity: 0; transition: opacity .2s; }
    .ui-kcard { width: min(1080px, 100%); max-height: 100%; overflow: auto; background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; padding: 22px 36px 30px;
        box-shadow: 0 10px 30px rgba(27,31,69,.25); color: var(--navy); font-family: 'Barlow Condensed', sans-serif; }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- check-in helpers ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const hideEl = e => e.classList.add('hide');

/* tokenise one line of Python; [[ and ]] wrap a markable span */
function tok(s) {
    const re = /\[\[|\]\]|"[^"\[\]]*"|\d+(?:\.\d+)?|[A-Za-z_]\w*|\s+|./g;
    let out = '', m;
    while ((m = re.exec(s))) {
        const t = m[0];
        if (t === '[[') out += '<span class="ck-mark">';
        else if (t === ']]') out += '</span>';
        else if (t[0] === '"') out += `<span class="ck-str">${esc(t)}</span>`;
        else if (/^\d/.test(t)) out += `<span class="ck-num">${t}</span>`;
        else if (t === 'print') out += '<span class="ck-fn">print</span>';
        else if (/^[A-Za-z_]/.test(t)) out += `<span class="ck-id">${t}</span>`;
        else if (/^\s+$/.test(t)) out += t;
        else if ('=+*/'.includes(t)) out += `<span class="ck-op">${t}</span>`;
        else out += `<span class="ck-p">${esc(t)}</span>`;
    }
    return out;
}

function codePanel(lines, o = {}) {
    const p = el('div', 'ck-code' + (o.cls ? ' ' + o.cls : ''));
    if (o.size) p.style.fontSize = o.size + 'px';
    const start = o.start || 1;
    p.lines = lines.map((s, i) => {
        const l = el('div', 'ck-cl' + (o.shown ? '' : ' rev hide'), `<span class="ck-ln">${start + i}</span><span class="ck-cx">${tok(s)}</span>`);
        p.appendChild(l); return l;
    });
    p.marks = i => [...p.lines[i].querySelectorAll('.ck-mark')];
    p.focus = i => p.lines.forEach((l, j) => l.classList.toggle('on', j === i));
    p.reveal = t0 => p.lines.forEach((l, i) => at(t0 + i * 220, () => show(l)));
    return p;
}
function ckTag(mark, text, shown) { const t = el('span', 'ck-tag' + (shown ? '' : ' rev hide'), text); mark.appendChild(t); return t; }
function chip(type) { return el('span', 'ck-chip ' + type, type); }

function outPanel(label = 'Output', cls = '') {
    const o = el('div', 'ck-out' + (cls ? ' ' + cls : ''), `<div class="dlbl">${label}</div><div class="ck-screen"></div>`);
    const s = o.querySelector('.ck-screen');
    o.add = (txt, c) => { const l = el('div', 'ck-oline rev hide' + (c ? ' ' + c : ''), esc(txt)); s.appendChild(l); void l.offsetWidth; show(l); return l; };
    return o;
}

const CK_BOARD = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3.5" width="18" height="12.5" rx="1.5"/><path d="M8 20.5l4-4.5 4 4.5M6.5 8h7M6.5 11.5h4.5"/></svg>';
function boardsUp() { return el('div', 'ck-boards rev hide', CK_BOARD + '<span>Whiteboards up</span>'); }

function vbox(name, w, cls = 'rev hide') {
    const b = el('div', 'ck-vb' + (cls ? ' ' + cls : ''), `<div class="ck-vb-body"><span class="ck-vb-name">${name}</span></div><div class="ck-vb-vals"></div>`);
    if (w) b.style.width = w + 'px';
    const vals = b.querySelector('.ck-vb-vals');
    b.cur = null;
    b.set = v => {
        if (b.cur) { const o = b.cur; o.classList.add('gone'); setTimeout(() => o.remove(), 800); }
        const n = el('div', 'ck-vv in', esc(v));
        vals.appendChild(n); void n.offsetWidth; n.classList.remove('in'); b.cur = n;
    };
    return b;
}

function frame(q) {
    const s = el('div', 'ck-scene'), qe = el('div', 'ck-q rev hide', q), g = el('div', 'ck-grid'), L = el('div', 'ck-left'), R = el('div', 'ck-right');
    g.append(L, R); s.append(qe, g); content.appendChild(s);
    at(200, () => show(qe));
    return { L, R };
}
function slot(h) { const s = el('div', 'ck-slot'); s.style.height = h + 'px'; return s; }
function note(html) { return el('div', 'ck-note rev hide', html); }
function fixCard(label, line, start, extra = '') {
    const f = el('div', 'ck-fix', `<div class="dlbl">${label}</div>`);
    const c = codePanel([line], { size: 26, start, shown: true, cls: 'sm' });
    f.appendChild(c);
    if (extra) f.appendChild(el('div', 'ck-prints', extra));
    f.code = c;
    return f;
}
/* standard stop and jot beats: question, jot, boards up */
function jotBeats(intro, jot, tJot, tUp, bu) {
    beatAt(0, intro);
    beatAt(tJot, '<b>Stop and jot:</b> ' + jot);
    beatAt(tUp, 'Hold up your whiteboards.');
    at(tUp + 300, () => show(bu));
}

/* assignment with an operator: code, symbol card, box, working and output */
function opScene(o) {
    const f = frame('What will this code print?');
    const code = codePanel([`${o.name} = ${o.start}`, `[[${o.name}]] = [[${o.name} ${o.op} ${o.by}]]`, `print(${o.name})`]);
    const [ml, mr] = code.marks(1);
    const sym = el('div', 'ck-symc rev hide', `<span class="ck-sym">${o.sym}</span><div><div class="ck-symw">${o.word}</div><div class="ck-symd">${o.desc}</div></div>`);
    const nt = o.note ? note(o.note) : null;
    f.L.append(code, sym); if (nt) f.L.appendChild(nt);
    const s = slot(380), bu = boardsUp(), st = el('div', 'ck-stack rev hide'), vb = vbox(o.name, 210, '');
    vb.style.marginLeft = '42px';
    const work = el('div', 'ck-work', '<span class="dlbl">Right side</span>');
    const wp = [o.work, '=', o.result].map((t, i) => { const w = el('span', 'rev hide' + (i === 2 ? ' pk' : ''), t); work.appendChild(w); return w; });
    const out = outPanel();
    st.style.gap = '12px';
    st.append(vb, work, out); s.append(bu, st); f.R.appendChild(s);
    code.reveal(600); at(1200, () => show(sym));
    return {
        boards: () => show(bu),
        line1: t => { at(t, () => { hideEl(bu); show(st); code.focus(0); }); at(t + 600, () => vb.set(o.start)); },
        right: t => { at(t, () => { code.focus(1); mr.classList.add('on'); }); wp.forEach((w, i) => at(t + 700 + i * 600, () => show(w))); },
        store: t => { at(t, () => { mr.classList.remove('on'); ml.classList.add('on'); }); at(t + 500, () => vb.set(o.result)); },
        print: t => { at(t, () => { ml.classList.remove('on'); code.focus(2); }); at(t + 500, () => out.add(o.printed)); if (nt) at(t + 900, () => show(nt)); }
    };
}

/* ---------- scenes ---------- */
const scenes = [
{
    title: 'Variables <span>check-in</span>',
    dur: 15000,
    run() {
        const c = el('div', 'center');
        const code = codePanel(['num = 5'], { size: 64, cls: 'inline' });
        const steps = el('div', 'ck-steps');
        const data = [['1', 'Read the code', 'Look carefully at every line.', ''], ['2', 'Jot your answer', 'Write it on your whiteboard.', ' pink'], ['3', 'Hold it up', 'Show your board when asked.', '']];
        const cards = data.map(([n, t, d, p]) => { const k = el('div', 'ck-step rev hide' + p, `<div class="n">${n}</div><div class="t">${t}</div><div class="d">${d}</div>`); steps.appendChild(k); return k; });
        c.append(code, steps); content.appendChild(c);
        beatAt(0, 'Time to check what you know about <b>variables</b>, <b>assignment</b> and <b>print</b>.');
        code.reveal(500);
        beatAt(4500, 'Grab a mini whiteboard and a marker.');
        beatAt(7500, 'For each question, <b>read</b> the code, <b>jot</b> your answer, then <b>hold up</b> your whiteboard when asked.');
        cards.forEach((k, i) => at(8000 + i * 500, () => show(k)));
    }
},
{
    title: 'Name and <span>value</span>',
    cfu: 'sj', time: 30,
    dur: 25000,
    run() {
        const f = frame('Write down the <b>name</b> and the <b>value</b> of this variable.');
        const code = codePanel(['[[city]] = [["Brisbane"]]'], { size: 50, cls: 'tall' });
        const [mn, mv] = code.marks(0), tn = ckTag(mn, 'Name'), tv = ckTag(mv, 'Value');
        f.L.appendChild(code);
        const s = slot(220), bu = boardsUp(), vb = vbox('city', 320);
        s.append(bu, vb); f.R.appendChild(s);
        code.reveal(600);
        jotBeats('Here is one line of Python code.', 'write down the <b>name</b> and the <b>value</b> of this variable.', 3500, 9000, bu);
        beatAt(12000, 'The <b>name</b> is <b>city</b>. It goes on the left of the equals sign.');
        at(12300, () => { hideEl(bu); mn.classList.add('on'); show(tn); });
        beatAt(16000, 'The <b>value</b> is <b>"Brisbane"</b>. It goes on the right.');
        at(16300, () => { mv.classList.add('on'); show(tv); });
        beatAt(20000, 'The equals sign puts the value into a box with that name.');
        at(20300, () => show(vb)); at(20900, () => vb.set('"Brisbane"'));
    }
},
{
    title: 'Spot the <span>data type</span>',
    cfu: 'sj', time: 45,
    dur: 28000,
    run() {
        const f = frame('Write the data type of each value: <code>str</code>, <code>int</code> or <code>float</code>.');
        const code = codePanel(['age = 12', 'height = 1.52', 'pet = "Kiwi"', 'postcode = [["4076"]]']);
        const chips = ['int', 'float', 'str', 'str'].map((t, i) => { const c = chip(t); c.classList.add('rev', 'hide'); code.lines[i].appendChild(c); return c; });
        const [mq] = code.marks(3);
        f.L.appendChild(code);
        const s = slot(360), bu = boardsUp(), st = el('div', 'ck-stack');
        const key = el('div', 'ck-key rev hide',
            '<div class="ck-krow"><span class="ck-chip int">int</span><span>A whole number</span></div>' +
            '<div class="ck-krow"><span class="ck-chip float">float</span><span>A number with a decimal point</span></div>' +
            '<div class="ck-krow"><span class="ck-chip str">str</span><span>Text inside quotation marks</span></div>');
        const nt = note('<b>"4076"</b> is a str. Anything inside quotation marks is text, even if it looks like a number.');
        st.append(key, nt); s.append(bu, st); f.R.appendChild(s);
        code.reveal(600);
        jotBeats('Here are four variables, each storing a different value.', 'next to each line number, write <b>str</b>, <b>int</b> or <b>float</b>.', 4000, 10000, bu);
        beatAt(13000, '<b>12</b> is a whole number, so it is an <b>int</b>. <b>1.52</b> has a decimal point, so it is a <b>float</b>.');
        at(13300, () => { hideEl(bu); show(key); });
        at(13800, () => { code.focus(0); show(chips[0]); });
        at(15600, () => { code.focus(1); show(chips[1]); });
        beatAt(18000, '<b>"Kiwi"</b> is text inside quotation marks, so it is a <b>str</b>.');
        at(18400, () => { code.focus(2); show(chips[2]); });
        beatAt(22000, 'Tricky one! <b>"4076"</b> looks like a number, but it is inside quotation marks, so it is also a <b>str</b>.');
        at(22400, () => { code.focus(3); mq.classList.add('on'); show(chips[3]); });
        at(23200, () => show(nt));
    }
},
{
    title: 'What will it <span>print</span>?',
    cfu: 'sj', time: 30,
    dur: 27000,
    run() {
        const f = frame('What will this code print? Write the output exactly.');
        const code = codePanel(['pet = "Kiwi"', 'print(pet)', 'print("pet")']);
        f.L.appendChild(code);
        const out = outPanel('Output', 'rev hide'), s = slot(170), bu = boardsUp();
        const nt = note('No quotation marks: print shows the <b>value</b> inside the variable. Quotation marks: print shows the <b>text</b> exactly.');
        s.append(bu, nt); f.R.append(out, s);
        code.reveal(600); at(1300, () => show(out));
        jotBeats('Read this code from top to bottom.', 'what will appear on the screen? Write each line exactly.', 3500, 9000, bu);
        beatAt(12000, 'Line 2 prints the variable <b>pet</b>, so it shows the value stored inside it: <b>Kiwi</b>.');
        at(12300, () => { hideEl(bu); code.focus(1); }); at(12900, () => out.add('Kiwi'));
        beatAt(17000, 'Line 3 has quotation marks, so it prints the text exactly as written: <b>pet</b>.');
        at(17300, () => code.focus(2)); at(17900, () => out.add('pet'));
        beatAt(22000, 'Notice that print never shows the quotation marks on the screen.');
        at(22300, () => { code.focus(-1); show(nt); });
    }
},
{
    title: 'Which value <span>survives</span>?',
    cfu: 'sj', time: 30,
    dur: 27000,
    run() {
        const f = frame('What will this code print?');
        const code = codePanel(['lives = 3', 'lives = 2', 'lives = 5', 'print(lives)']);
        f.L.appendChild(code);
        const s = slot(210), bu = boardsUp(), vb = vbox('lives'), out = outPanel('Output', 'rev hide');
        vb.style.left = '42px';
        s.append(bu, vb); f.R.append(s, out);
        code.reveal(600);
        jotBeats('This code changes the same variable three times.', 'what will this code print?', 3500, 8000, bu);
        beatAt(11000, 'Line 1 puts <b>3</b> into the box called lives.');
        at(11300, () => { hideEl(bu); show(vb); code.focus(0); }); at(11900, () => vb.set('3'));
        beatAt(14500, 'Line 2 replaces it with <b>2</b>. The old value is gone.');
        at(14800, () => { code.focus(1); vb.set('2'); });
        beatAt(18000, 'Line 3 replaces it again with <b>5</b>.');
        at(18300, () => { code.focus(2); vb.set('5'); });
        beatAt(21500, 'So line 4 prints <b>5</b>. A variable only remembers its <b>most recent</b> value.');
        at(21800, () => { code.focus(3); show(out); }); at(22400, () => out.add('5'));
    }
},
{
    title: 'Work out the <span>assignment</span>',
    cfu: 'sj', time: 45,
    dur: 31000,
    run() {
        const f = frame('What will this code print?');
        const code = codePanel(['coins = 7', '[[coins]] = [[coins + 3]]', 'print(coins)']);
        const [ml, mr] = code.marks(1);
        f.L.appendChild(code);
        const s = slot(380), bu = boardsUp(), st = el('div', 'ck-stack rev hide'), vb = vbox('coins', 210, '');
        vb.style.marginLeft = '42px';
        const work = el('div', 'ck-work', '<span class="dlbl">Right side</span>');
        const wp = ['7 + 3', '=', '10'].map((t, i) => { const w = el('span', 'rev hide' + (i === 2 ? ' pk' : ''), t); work.appendChild(w); return w; });
        const out = outPanel();
        st.style.gap = '12px';
        st.append(vb, work, out); s.append(bu, st); f.R.appendChild(s);
        code.reveal(600);
        jotBeats('Look at line 2. How can coins be equal to coins + 3?', 'what will this code print?', 4500, 10000, bu);
        beatAt(13000, 'Line 1 puts <b>7</b> into the box called coins.');
        at(13300, () => { hideEl(bu); show(st); code.focus(0); }); at(13900, () => vb.set('7'));
        beatAt(16500, 'Line 2: work out the <b>right side first</b>. coins is 7, so 7 + 3 is <b>10</b>.');
        at(16800, () => { code.focus(1); mr.classList.add('on'); });
        wp.forEach((w, i) => at(17500 + i * 600, () => show(w)));
        beatAt(21500, 'Then store the answer in the box on the <b>left</b>. coins is now <b>10</b>.');
        at(21800, () => { mr.classList.remove('on'); ml.classList.add('on'); }); at(22300, () => vb.set('10'));
        beatAt(25500, 'So line 3 prints <b>10</b>. Right side first, then store it on the left.');
        at(25800, () => { ml.classList.remove('on'); code.focus(2); }); at(26300, () => out.add('10'));
    }
},
{
    title: 'Multiplying a <span>variable</span>',
    cfu: 'sj', time: 45,
    dur: 31000,
    run() {
        const S = opScene({ name: 'cookies', start: '4', op: '*', by: '3', work: '4 * 3', result: '12', printed: '12',
            sym: '*', word: 'Multiply', desc: 'Python uses <code>*</code> instead of ×' });
        beatAt(0, 'In Python, the <b>*</b> symbol means <b>multiply</b>. We use it instead of ×.');

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    uiSetCfu(sc.cfu, sc.time); uiSetSC(sc.sc);
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

/* ---------- whiteboard ---------- */
const wbBtn = $('#wbbtn'), wbl = $('#wbl');
let wbPausedAt = 0;
function loadSurface() { redrawInk(); renderBadges(); }
function syncWB() {
    $('#wbpg').textContent = `Page ${wbPage + 1} of ${wbPages}`;
    wbl.innerHTML = `Whiteboard&nbsp;&nbsp;<b>${wbPage + 1}</b> / ${wbPages}`;
    $('#wbprev').disabled = wbPage === 0; $('#wbnext').disabled = wbPage >= wbPages - 1;
    wbBtn.classList.toggle('on', wbOpen); wbBtn.setAttribute('aria-pressed', wbOpen);
}
function toggleWB() {
    if (document.activeElement) document.activeElement.blur();
    closeMenus(); zoomReset();
    if (!wbOpen) {
        wbPausedAt = now(); clearTimers(); setProgress(wbPausedAt, wbPausedAt);
        wbOpen = true;
    } else {
        wbOpen = false;
    }
    document.body.classList.toggle('ui-wb', wbOpen);
    loadSurface(); syncWB(); fit();
    if (!wbOpen) {
        if (autoplay) play(wbPausedAt, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
        else play(wbPausedAt, beatEnd(beat));
    }
}
function wbGo(p) {
    p = clamp(p, 0, wbPages - 1); if (p === wbPage) return;
    if (document.activeElement) document.activeElement.blur();
    zoomReset(); wbPage = p; loadSurface(); syncWB();
}
function wbNew() { wbPages++; wbGo(wbPages - 1); }
wbBtn.onclick = () => { toggleWB(); wbBtn.blur(); };
$('#wbprev').onclick = () => wbGo(wbPage - 1);
$('#wbnext').onclick = () => wbGo(wbPage + 1);
$('#wbnew').onclick = () => { wbNew(); $('#wbnew').blur(); };
syncWB();

/* ---------- overlays: overview, shortcuts, blackout ---------- */
const modals = { ovw: $('#ovw'), keys: $('#keys'), blk: $('#blk') };
let modal = null;
function openModal(n) {
    if (modal) closeModal();
    closeMenus();
    if (document.activeElement) document.activeElement.blur();
    if (n === 'blk' && autoplay) toggleAuto();
    if (n === 'ovw') renderOverview();
    modal = n; modals[n].hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => modals[n].classList.add('on')));
    if (n === 'ovw') { const c = modals.ovw.querySelector('.ui-ovc.cur'); if (c) c.scrollIntoView({ block: 'center' }); }
}
function closeModal() {
    if (!modal) return;
    const m = modals[modal]; m.classList.remove('on'); m.hidden = true; modal = null;
}
window.addEventListener('keydown', e => {
    if (!modal || /^F\d+$/.test(e.key)) return;
    const k = e.key.toLowerCase();
    e.preventDefault(); e.stopImmediatePropagation();
    if (k === 'escape' || (modal === 'blk' && k === 'k') || (modal === 'ovw' && k === 'g') || (modal === 'keys' && (k === '?' || k === '/'))) closeModal();
}, true);
modals.blk.onclick = closeModal;
modals.keys.addEventListener('click', e => { if (!e.target.closest('.ui-kcard') || e.target.closest('#keysclose')) closeModal(); });
modals.ovw.addEventListener('click', e => { if (!e.target.closest('.ui-ovc')) closeModal(); });
$('#blkbtn').onclick = () => openModal('blk');
$('#keysbtn').onclick = () => openModal('keys');
$('#ovbtn').onclick = () => { openModal('ovw'); };

const thumbs = [];
function renderOverview() {
    const g = $('#ovg'); g.innerHTML = '';
    scenes.forEach((sc, i) => {
        const c = el('button', 'ui-ovc' + (i === idx ? ' cur' : ''));
        c.setAttribute('aria-label', 'Go to scene ' + (i + 1));
        const w = el('div', 'ui-thw'); if (thumbs[i]) w.appendChild(thumbs[i].cloneNode(true));
        c.append(w, el('div', 'ui-lb', `<span class="ui-n">${i + 1}</span><span class="ui-t">${sc.title}</span>`));
        c.onclick = () => { closeModal(); if (i !== idx) go(i); };
        g.appendChild(c);
    });
}

const SHORTCUTS = [
    ['Slides', [['&rarr;', 'Next'], ['&larr;', 'Previous'], ['R', 'Replay scene'], ['Space', 'Autoplay'], ['G', 'Slide overview']]],
    ['Draw', [['P', 'Pen'], ['Y', 'Highlighter'], ['E', 'Eraser'], ['B', 'Text box'], ['C', 'Clear ink'], ['Ctrl|Z', 'Undo'], ['Ctrl|Shift|Z', 'Redo']]],
    ['Focus', [['Z', 'Zoom (scroll to adjust)'], ['L', 'Lock zoom'], ['H', 'Spotlight (scroll to resize)'], ['K', 'Blackout']]],
    ['Engage', [['M', 'Engagement methods'], ['1|5', 'Choose a method'], ['T', 'Timer']]],
    ['Whiteboard', [['W', 'Open or close'], ['&larr;|&rarr;', 'Change page'], ['N', 'New page']]],
    ['View', [['F', 'Fullscreen'], ['U', 'Hide or show UI'], ['S', 'Subtitles'], ['?', 'Shortcuts'], ['Esc', 'Close or stop tool']]]
];
$('#kgrid').innerHTML = SHORTCUTS.map(([h, rows]) => `<div class="ui-kgrp"><h3>${h}</h3>${rows.map(([k, l]) => {
    const keys = k === '1|5' ? '<kbd>1</kbd>to<kbd>5</kbd>' : k.split('|').map(x => `<kbd>${x}</kbd>`).join(k.includes('Ctrl') ? '+' : '');
    return `<div class="ui-krow"><span class="ui-ks">${keys}</span><span>${l}</span></div>`;
}).join('')}</div>`).join('');

/* ---------- export PDF ---------- */
const printBox = $('#print');
let snapN = 0;
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    const sfx = '-s' + (++snapN), ren = {};
    page.querySelectorAll('[id]').forEach(n => { if (n.closest('defs')) { ren[n.id] = n.id + sfx; n.id += sfx; } else n.removeAttribute('id'); });
    if (Object.keys(ren).length) page.querySelectorAll('*').forEach(e => [...e.attributes].forEach(a => {
        const v = a.value.replace(/url\(\s*['"]?#([^)'"\s]+)['"]?\s*\)/g, (m, k) => ren[k] ? `url(#${ren[k]})` : m).replace(/^#(.+)$/, (m, k) => ren[k] && /href$/.test(a.name) ? '#' + ren[k] : m);
        if (v !== a.value) e.setAttribute(a.name, v);
    }));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all(imgs.map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
