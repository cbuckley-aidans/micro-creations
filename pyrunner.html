<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run the code</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    [class] { font-variant-ligatures: none; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 30px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 500; line-height: 1.35; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; transition: opacity .3s, transform .3s var(--ease); }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    .next:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .pop-in { animation: capIn .45s var(--ease); }

    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* code panels */
    .cpanel { border: 3px solid var(--navy); border-radius: 8px; background: #fff; width: 100%; }
    .phead { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey);
        padding: 10px 22px; border-bottom: 2px solid var(--light-grey); }
    .cbody { padding: 14px 0; }
    .cl { position: relative; white-space: pre; font-family: var(--mono); font-size: 26px; font-weight: 500; line-height: 46px; height: 46px; padding: 0 22px 0 16px;
        border-left: 6px solid transparent; transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .25s, border-color .25s; }
    .cl .gn { display: inline-block; width: 38px; color: #c3c6d0; font-weight: 500; }
    .cl.act { background: rgba(234,0,138,.10); border-left-color: var(--pink); }
    .cl.skip { opacity: .28; }
    .kw { color: var(--pink); font-weight: 700; }
    .st { color: #5b6192; }
    .nm { font-weight: 700; }
    .ph { color: var(--mid-grey); font-style: italic; }
    .cpanel.lg .cl { font-size: 36px; line-height: 66px; height: 66px; padding-right: 36px; }
    .cpanel.lg .gn { width: 50px; }
    .colon, .ind { border-radius: 4px; transition: background-color .3s, color .3s; }
    .colon.on { background: var(--pink); color: #fff; }
    .ind { display: inline-block; }
    .ind.on { background: rgba(234,0,138,.16); box-shadow: inset 4px 0 0 var(--pink); }
    .ctag { position: absolute; left: calc(100% + 30px); top: 0; height: 100%; display: flex; align-items: center; gap: 14px; white-space: nowrap;
        font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); }
    .ctag::before { content: ''; width: 30px; height: 4px; background: currentColor; }
    .ctag.pk { color: var(--pink); }
    .ctag.gy { color: var(--mid-grey); }
    .opanel { background: var(--navy); border: 3px solid var(--navy); border-radius: 8px; color: #fff; width: 100%; }
    .opanel .phead { color: #9aa0c4; border-bottom-color: rgba(255,255,255,.14); }
    .obody { font-family: var(--mono); font-size: 28px; font-weight: 500; padding: 18px 22px; min-height: 120px; }
    .oline { animation: capIn .45s var(--ease); }
    .runrow { display: flex; gap: 44px; align-items: flex-start; justify-content: center; height: 100%; padding-top: 6px; }
    .runcol { display: flex; flex-direction: column; gap: 22px; }
    .ctrl { display: flex; align-items: center; gap: 12px; }
    .ctrl .dlbl { margin-right: 8px; }
    .tbox { text-align: left; width: 100%; }
    .trow { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 6px; }
    .expr { font-family: var(--mono); font-size: 38px; font-weight: 700; }

    /* runner */
    .rrow { display: flex; gap: 44px; align-items: flex-start; justify-content: center; height: 100%; padding-top: 10px; }
    .rleft { width: 540px; display: flex; flex-direction: column; gap: 18px; }
    .rright { width: 540px; display: flex; flex-direction: column; gap: 20px; }
    .cpanel .cl { font-size: 28px; line-height: 54px; height: 54px; }
    .cl.err { background: rgba(27,31,69,.08); border-left-color: var(--navy); }
    .run { align-self: flex-start; display: inline-flex; align-items: center; gap: 14px; font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800;
        letter-spacing: .08em; text-transform: uppercase; background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; }
    .run::before { content: ''; border-left: 16px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
    .run:disabled { opacity: .5; cursor: default; }
    .run:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .run.pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(27,31,69,.14); } }
    .opanel .obody { min-height: 150px; }
    .opanel .ph2 { color: #6f7499; font-family: 'Barlow', sans-serif; font-size: 22px; font-style: italic; }
    .oline.er { color: #ff7fc4; }
    .check { border-left: 8px solid var(--pink); padding: 4px 0 4px 26px; opacity: 0; transform: translateY(14px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
    .check.show { opacity: 1; transform: none; }
    .check .ct { font-size: 28px; font-weight: 700; line-height: 1.3; margin-top: 6px; }
    .mcard { width: 520px; border: 3px solid var(--pink); border-radius: 8px; padding: 30px 36px; text-align: center; }
    .mcard .mn { font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 900; color: var(--pink); line-height: 1; }
    .mcard .mt { font-size: 30px; font-weight: 700; margin-top: 10px; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Run the <span>code</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Next</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), nextBtn = $('#next'), counter = $('#counter'), progress = $('#progress');
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- snippets ----------
   Each line: [code html, output or null, error or null].
   Outputs are fixed, so no Python runtime is needed. */
const S = s => `<span class="st">${s}</span>`, N = n => `<span class="nm">${n}</span>`;
const SNIPPETS = [
    { key: 'phase2_a', label: 'A', lines: [[`name = ${S('"Jordan"')}`], ['print(name)', 'Jordan']],
      check: 'Was your prediction right?' },
    { key: 'phase2_b', label: 'B', lines: [[`score = ${N(10)}`], [`score = ${N(25)}`], ['print(score)', '25']],
      check: 'Did the output surprise you? Think about why only one number appeared.' },
    { key: 'phase2_c', label: 'C', lines: [[`first = ${S('"Ada"')}`], [`last = ${S('"Lovelace"')}`], ['print(first)', 'Ada'], ['print(last)', 'Lovelace']],
      check: 'How many lines of output appeared?' },
    { key: 'phase2_d', label: 'D', lines: [[`age = ${N(12)}`], ['print(Age)', null, "NameError: name 'Age' is not defined"]],
      check: 'Look closely at the two spellings of age. Can you spot the difference? What does this tell you about how Python reads variable names?' },
    { key: 'phase2_e', label: 'E', lines: [[`age = ${N(12)}`], [`age = age + ${N(1)}`], ['print(age)', '13']],
      check: 'The same variable appears on both sides of line 2. What does Python work out first, and what happens to the old value?' }
];

/* ---------- one snippet ---------- */
let timers = [];
function snippetStep(sn, i) {
    say('Press <b>Run</b> to see what this code does.');
    const row = el('div', 'rrow');
    const left = el('div', 'rleft');
    left.appendChild(el('div', 'dlbl', `Snippet ${sn.label}`));
    const panel = el('div', 'cpanel', '<div class="phead">Your code</div>');
    const body = el('div', 'cbody');
    const L = sn.lines.map(([h], j) => { const l = el('div', 'cl', `<span class="gn">${j + 1}</span>${h}`); body.appendChild(l); return l; });
    panel.appendChild(body);
    const run = el('button', 'run pulse', 'Run');
    left.append(panel, run);
    const right = el('div', 'rright');
    const out = el('div', 'opanel', '<div class="phead">Output</div><div class="obody"><div class="ph2">Nothing yet</div></div>');
    const ob = out.querySelector('.obody');
    const chk = el('div', 'check', `<div class="dlbl">Check your prediction on Stile</div><div class="ct">${sn.check}</div>`);
    right.append(out, chk);
    row.append(left, right); content.appendChild(row);

    run.onclick = () => {
        timers.forEach(clearTimeout); timers = [];
        run.disabled = true; run.classList.remove('pulse');
        ob.innerHTML = ''; L.forEach(l => l.classList.remove('act', 'err', 'skip'));
        let t = 0, stopped = false;
        sn.lines.forEach(([, o, e], j) => {
            timers.push(setTimeout(() => {
                if (stopped) return;
                L.forEach(l => l.classList.remove('act'));
                if (e) { L[j].classList.add('err'); ob.appendChild(el('div', 'oline er', e)); stopped = true; for (let k = j + 1; k < L.length; k++) L[k].classList.add('skip'); return; }
                L[j].classList.add('act');
                if (o !== undefined && o !== null) ob.appendChild(el('div', 'oline', o));
            }, t));
            t += 650;
        });
        timers.push(setTimeout(() => {
            L.forEach(l => l.classList.remove('act'));
            run.disabled = false; run.textContent = 'Run again';
            chk.classList.add('show');
            say('Head back to Stile and check your original prediction.');
            showNext(i === SNIPPETS.length - 1 ? 'Checked. Finish' : 'Checked. Next snippet');
        }, t + 200));
        run.blur();
    };
}

function finalStep() {
    say('Head back to Stile to continue.');
    const c = el('div', 'center');
    c.appendChild(el('div', 'mcard pop-in', '<div class="mn">5 / 5</div><div class="mt">All snippets complete</div>'));
    content.appendChild(c);
}

/* ---------- flow ---------- */
let cur = 0;
function showNext(label) {
    nextBtn.hidden = false; nextBtn.disabled = false; nextBtn.textContent = label;
    nextBtn.classList.remove('pop-in'); void nextBtn.offsetWidth; nextBtn.classList.add('pop-in');
}
function go(i) {
    timers.forEach(clearTimeout); timers = [];
    cur = i; content.innerHTML = ''; nextBtn.hidden = true;
    const done = i >= SNIPPETS.length;
    counter.innerHTML = done ? '<b>Complete</b>' : `Snippet <b>${i + 1}</b> / ${SNIPPETS.length}`;
    progress.style.width = (done ? 100 : i / SNIPPETS.length * 100) + '%';
    if (done) finalStep(); else snippetStep(SNIPPETS[i], i);
}
nextBtn.onclick = () => go(cur + 1);

function fit() {
    const st = $('#stage'), k = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
/* ?config=phase2_c still starts at that snippet, so existing Stile links keep working */
const startKey = new URLSearchParams(location.search).get('config');
const startAt = Math.max(0, SNIPPETS.findIndex(s => s.key === startKey));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); go(startAt); });
</script>
</body>
</html>
