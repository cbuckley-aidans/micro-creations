<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finding the Jobs</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b1f45;
  --pink:#ea008a;
  --white:#fff;
  --paper:#f2f2f0;
  --line:#e0e0dd;
  --grey:#8b8b93;
  --correct:#16a34a;
  --incorrect:#dc2626;
}
*{box-sizing:border-box;}
body{
  font-family:'Barlow','Helvetica Neue',Helvetica,Arial,sans-serif;
  margin:0;padding:0;background:var(--paper);color:var(--navy);
  display:flex;flex-direction:column;align-items:center;
}
.wrap{width:100%;max-width:960px;padding:32px 28px 60px;}

.masthead{display:flex;align-items:baseline;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:10px;}
.masthead h1{
  font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:900;
  text-transform:uppercase;letter-spacing:.02em;margin:0;
}
.masthead h1 span{color:var(--pink);}
.masthead .syntax{
  margin-left:auto;font-family:'Courier New',monospace;font-size:15px;font-weight:700;
  color:var(--grey);white-space:nowrap;
}

.progress{display:flex;gap:6px;margin:18px 0 26px;}
.pip{flex:1;height:6px;background:var(--line);border:none;padding:0;cursor:pointer;transition:background .15s;}
.pip:hover{background:#c8c8c4;}
.pip.done{background:var(--correct);}
.pip.current{background:var(--pink);}

.card{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--navy);}
.card-head{display:flex;align-items:center;gap:16px;padding:20px 28px 0;flex-wrap:wrap;}
.counter{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:800;letter-spacing:.16em;color:var(--grey);}
.card-head h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;margin:0;}
.chip{margin-left:auto;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--pink);padding:4px 10px;}

.brief{
  margin:16px 28px 0;padding:14px 20px;border-left:5px solid var(--navy);background:#f7f7f6;
  font-size:19px;line-height:1.55;max-width:70ch;
}
.brief b{color:var(--pink);}
.note{margin:12px 28px 0;font-size:16px;color:var(--grey);line-height:1.5;}

.stage{padding:22px 28px 6px;}
.section-label{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--pink);margin:18px 0 10px;
}
.jobs{display:flex;flex-direction:column;gap:10px;}
.job{display:flex;align-items:stretch;gap:0;flex-wrap:nowrap;}
.job .when{
  flex:0 0 40%;background:var(--navy);color:#fff;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;
}
.job .when .k{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6);}
.job .when .v{font-size:18px;font-weight:700;line-height:1.3;}
.job .arrow{flex:0 0 42px;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;}
.job .doit{flex:1;border:2px solid var(--navy);border-left:none;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:4px;background:#fff;}
.job .doit .k{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pink);}

.slot{
  border:2px dashed #b9b9c4;background:#fbfbfa;min-height:48px;border-radius:5px;
  display:flex;align-items:center;padding:4px;transition:border-color .15s,background .15s;cursor:pointer;
}
.job .when .slot{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08);}
.slot.over{border-color:var(--pink);border-style:solid;background:rgba(234,0,138,.12);}
.slot.filled{border-style:solid;border-color:transparent;background:transparent;padding:0;}
.slot.correct{border:3px solid var(--correct)!important;background:rgba(22,163,74,.12)!important;}
.slot.incorrect{border:3px solid var(--incorrect)!important;background:rgba(220,38,38,.12)!important;animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}50%{transform:translateX(5px);}75%{transform:translateX(-3px);}}


.pool{display:flex;flex-wrap:wrap;gap:9px;padding:10px;border:1px dashed var(--line);background:#fafaf9;min-height:58px;}
.pool.over{background:#f7f0f6;border-color:var(--pink);}
.pool-label{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin:16px 0 6px;}

.tile{
  font-size:17px;font-weight:700;line-height:1.25;color:#fff;background:var(--navy);
  padding:9px 14px;border-radius:5px;cursor:grab;user-select:none;max-width:100%;
  box-shadow:0 2px 0 rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s,opacity .15s;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(0,0,0,.2);}
.tile.dragging{opacity:.35;}
.tile.t-action{background:var(--pink);}
.slot .tile{box-shadow:none;border-radius:4px;width:100%;}
.slot .tile:hover{transform:none;box-shadow:none;}

.hint{display:none;margin:16px 0 0;padding:12px 16px;background:#fffbeb;border-left:4px solid #f59e0b;font-size:16px;line-height:1.55;color:#78350f;}
.hint p{margin:0 0 6px;}
.hint p:last-child{margin:0;}

.card-foot{display:flex;align-items:center;gap:14px;padding:18px 28px;border-top:1px solid var(--line);background:#fafaf9;margin-top:22px;flex-wrap:wrap;}
button{font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;}
.btn-primary{font-size:20px;font-weight:800;background:var(--navy);color:#fff;border:none;padding:12px 34px;transition:background .15s;}
.btn-primary:hover{background:#2e3472;}
.btn-primary.ready{background:var(--pink);}
.btn-primary.ready:hover{background:#c5006e;}
.btn-ghost{font-size:17px;font-weight:700;background:none;color:var(--grey);border:2px solid var(--line);padding:11px 20px;}
.btn-ghost:hover{color:var(--navy);border-color:#bbb;}
.btn-ghost.right{margin-left:auto;}
.feedback{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
.f-ok{color:var(--correct);}
.f-no{color:var(--incorrect);}

.score{display:none;flex-direction:column;align-items:center;gap:16px;text-align:center;background:var(--navy);border-top:6px solid var(--pink);padding:44px 40px;}
.score .label{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--pink);margin:0;}
.score .num{font-family:'Barlow Condensed',sans-serif;font-size:84px;font-weight:900;color:#fff;line-height:.9;}
.score .rule{width:56px;height:3px;background:var(--pink);}
.score p.msg{color:rgba(255,255,255,.78);font-size:18px;max-width:460px;margin:0;line-height:1.55;}

@media (max-width:700px){
  .wrap{padding:22px 16px 48px;}
  .masthead .syntax{display:none;}
  .job{flex-wrap:wrap;}
  .job .when{flex:1 1 100%;}
  .job .arrow{flex:1 1 100%;height:26px;}
  .job .doit{flex:1 1 100%;border-left:2px solid var(--navy);}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>Finding the <span>Jobs</span></h1>
    <span class="syntax">event + action = job</span>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="card"></div>

  <div class="score" id="score">
    <p class="label">Your score</p>
    <span class="num" id="score-num">0 / 5</span>
    <div class="rule"></div>
    <p class="msg">Take a screenshot of this panel and paste it into Stile as evidence of your work.</p>
    <button class="btn-ghost" onclick="restart()" style="color:#fff;border-color:rgba(255,255,255,.3)">Start again</button>
  </div>

</div>

<script>
/* =========================================================
   EDIT HERE: one object per problem.
   rows: when  -> string (given) or null (student drags an event)
         doit  -> the correct action
   pools: extra items are distractors
   ========================================================= */
const PROBLEMS = [
  {
    title:'Lemonade Stall', tag:'Worked with you',
    brief:'At the school fete, you are running the lemonade stall. You want the micro:bit to <b>count</b> each cup you <b>sell</b>. When you <b>press</b> button A, it should <b>show</b> how much money you have <b>made</b>. Each cup costs $2.',
    note:'The events are already written in. Drag the matching action beside each one.',
    rows:[
      {when:'a cup is sold', doit:'add one to the count'},
      {when:'button A is pressed', doit:'work out the money (cups x $2)'},
      {when:'straight after', doit:'show the money on the screen'}
    ],
    actionPool:['reset the count to zero','show the number of cups','work out the money (cups + $2)'],
    hint:['Each doing word in the problem becomes an action.','Cups times $2 gives money. Adding $2 to the number of cups would not make sense.','Read the problem again and match each doing word to one job.']
  },
  {
    title:'Star Jumps', tag:'Worked with you',
    brief:'In PE you are doing star jumps. You want the micro:bit to <b>count</b> each star jump. When you <b>press</b> button A, it should <b>show</b> how much energy you have <b>used</b>. Each star jump uses about 0.2 calories.',
    note:'Same shape as the lemonade stall. Watch for the actions that belong to a different problem.',
    rows:[
      {when:'a star jump happens', doit:'add one to the count'},
      {when:'button A is pressed', doit:'work out the energy (jumps x 0.2)'},
      {when:'straight after', doit:'show the energy on the screen'}
    ],
    actionPool:['work out the money (cups x $2)','show how many jumps are left','start a timer'],
    hint:['The count goes up one star jump at a time.','Energy is worked out from the count, so the counting job has to come first.','Showing the energy comes straight after working it out.']
  },
  {
    title:'Water Refill Station', tag:'Your turn',
    brief:'The Green Team wants to track the refill station. Each time a bottle is <b>filled</b>, someone <b>presses</b> button B. When button A is <b>pressed</b>, the micro:bit should <b>show</b> how many litres have been <b>saved</b>. Each bottle holds 0.6 litres.',
    note:'This time you drag in the events as well as the actions.',
    rows:[
      {when:null, eventAnswer:'button B is pressed', doit:'add one to the bottle count'},
      {when:null, eventAnswer:'button A is pressed', doit:'work out the litres (bottles x 0.6)'},
      {when:'straight after', doit:'show the litres on the screen'}
    ],
    eventPool:['button B is pressed','button A is pressed','the micro:bit is shaken','the bottle is empty'],
    actionPool:['empty the bottle','show the bottle count','work out the litres (bottles + 0.6)'],
    hint:['Button B is the one pressed each time a bottle is filled, so that is the counting event.','Button A is the one that asks for a result, so the working out belongs with it.','Litres are worked out by multiplying, not adding.']
  },
  {
    title:'Netball Shooting Practice', tag:'Your turn',
    brief:'At training you want to <b>track</b> your shooting. Button A <b>records</b> a goal. Button B <b>records</b> a miss. When you <b>shake</b> the micro:bit, it should <b>work out</b> and <b>show</b> your total shots.',
    note:'Two buttons here, so look carefully at which event belongs with which action.',
    rows:[
      {when:null, eventAnswer:'button A is pressed', doit:'add one to the goals count'},
      {when:null, eventAnswer:'button B is pressed', doit:'add one to the misses count'},
      {when:null, eventAnswer:'the micro:bit is shaken', doit:'work out the total shots (goals + misses)'},
      {when:'straight after', doit:'show the total shots on the screen'}
    ],
    eventPool:['button A is pressed','button B is pressed','the micro:bit is shaken','the game finishes','the light level drops'],
    actionPool:['take one off the goals count','show the misses count','work out the total shots (goals x misses)','clear both counts'],
    hint:['Each button is its own event with its own action.','Total shots means every attempt, so goals and misses are added together.','Shaking is the event that asks for a result, so the working out belongs with it.']
  },
  {
    title:'Hot Classroom Alarm', tag:'Challenge',
    brief:'Your class is checking how often the room gets too warm. The micro:bit <b>checks</b> the temperature over and over. Every time the temperature <b>goes above</b> 28 degrees, it should <b>count</b> that reading. When button A is <b>pressed</b>, it should <b>show</b> how many hot readings there have been.',
    note:'The first event is not a button. A condition becoming true is an event too.',
    rows:[
      {when:null, eventAnswer:'the temperature goes above 28', doit:'add one to the hot readings count'},
      {when:null, eventAnswer:'button A is pressed', doit:'show the hot readings count on the screen'}
    ],
    eventPool:['the temperature goes above 28','button A is pressed','the temperature drops below 28','the micro:bit is shaken'],
    actionPool:['turn the heater off','set the temperature to 28','take one off the count'],
    hint:['A condition turning true is a trigger, just like a button press.','The micro:bit can measure temperature, but it cannot change it.','Button A is the event that asks to see the result.']
  }
];

const TOTAL = PROBLEMS.length;
let index = 0;
let solved = new Array(TOTAL).fill(false);
let dragged = null;

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function renderProgress(){
  const p = document.getElementById('progress');
  p.innerHTML = '';
  for(let i=0;i<TOTAL;i++){
    const b = document.createElement('button');
    b.className = 'pip' + (solved[i] ? ' done' : '') + (i === index ? ' current' : '');
    b.title = 'Problem ' + (i+1);
    b.onclick = () => { index = i; render(); };
    p.appendChild(b);
  }
}

function render(){
  const q = PROBLEMS[index];
  const card = document.getElementById('card');
  document.getElementById('score').style.display = 'none';
  card.style.display = '';

  const hasEvents = !!q.eventPool;

  let rowsHTML = '';
  q.rows.forEach((r, i) => {
    const whenInner = r.when
      ? `<span class="k">${r.when === 'straight after' ? 'Then' : 'When'}</span><span class="v">${r.when}</span>`
      : `<span class="k">When</span><div class="slot" data-type="event" data-i="${i}"></div>`;
    rowsHTML += `
      <div class="job">
        <div class="when">${whenInner}</div>
        <div class="arrow">&#8594;</div>
        <div class="doit">
          <span class="k">Do this</span>
          <div class="slot" data-type="action" data-i="${i}"></div>
        </div>
      </div>`;
  });

  card.innerHTML = `
    <div class="card-head">
      <span class="counter">${String(index+1).padStart(2,'0')} / ${String(TOTAL).padStart(2,'0')}</span>
      <h2>${q.title}</h2>
      <span class="chip">${q.tag}</span>
    </div>
    <p class="brief">${q.brief}</p>
    <p class="note">${q.note}</p>

    <div class="stage">
      <p class="section-label">The jobs</p>
      <div class="jobs">${rowsHTML}</div>

      ${hasEvents ? '<p class="pool-label">Events</p><div class="pool" id="pool-event"></div>' : ''}
      <p class="pool-label">Actions</p>
      <div class="pool" id="pool-action"></div>

      <div class="hint" id="hint"></div>
    </div>

    <div class="card-foot">
      <button class="btn-primary" id="action-btn">Check</button>
      <span class="feedback" id="feedback"></span>
      ${index > 0 ? '<button class="btn-ghost right" onclick="goBack()">Back</button>' : ''}
    </div>`;

  if(hasEvents){
    fillPool('pool-event', shuffle(q.eventPool), 'event');
  }
  const actions = q.rows.map(r => r.doit).concat(q.actionPool);
  fillPool('pool-action', shuffle(actions), 'action');

  card.querySelectorAll('.slot').forEach(s => {
    s.addEventListener('dragover', overOn);
    s.addEventListener('dragleave', overOff);
    s.addEventListener('drop', dropSlot);
    s.addEventListener('click', () => {
      const t = s.querySelector('.tile');
      if(t) returnTile(t);
    });
  });
  ['pool-event','pool-action'].forEach(id => {
    const p = document.getElementById(id);
    if(!p) return;
    p.addEventListener('dragover', overOn);
    p.addEventListener('dragleave', overOff);
    p.addEventListener('drop', e => {
      e.preventDefault(); p.classList.remove('over');
      if(dragged) returnTile(dragged);
    });
  });

  document.getElementById('action-btn').onclick = check;
  renderProgress();
}

function fillPool(id, values, type){
  const p = document.getElementById(id);
  if(!p) return;
  values.forEach(v => p.appendChild(makeTile(v, type)));
}

function makeTile(v, type){
  const t = document.createElement('span');
  t.className = 'tile t-' + type;
  t.textContent = v;
  t.dataset.value = v;
  t.dataset.type = type;
  t.draggable = true;
  t.addEventListener('dragstart', e => {
    dragged = t; e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => t.classList.add('dragging'), 0);
  });
  t.addEventListener('dragend', () => { t.classList.remove('dragging'); dragged = null; });
  t.addEventListener('click', () => {
    if(t.parentElement.classList.contains('slot')) return;
    const next = [...document.querySelectorAll('.slot')]
      .find(s => s.dataset.type === type && !s.querySelector('.tile'));
    if(next) placeTile(next, t);
  });
  return t;
}

function overOn(e){ e.preventDefault(); e.currentTarget.classList.add('over'); }
function overOff(e){ e.currentTarget.classList.remove('over'); }

function dropSlot(e){
  e.preventDefault(); e.stopPropagation();
  const s = e.currentTarget;
  s.classList.remove('over');
  if(dragged) placeTile(s, dragged);
}

function homePool(type){ return document.getElementById('pool-' + type); }

function placeTile(slot, tile){
  const existing = slot.querySelector('.tile');
  if(existing) homePool(existing.dataset.type).appendChild(existing);
  const prev = tile.parentElement;
  if(prev && prev.classList.contains('slot')) prev.classList.remove('filled','correct','incorrect');
  slot.classList.remove('correct','incorrect');
  slot.appendChild(tile);
  slot.classList.add('filled');
  clearFeedback();
}

function returnTile(tile){
  const prev = tile.parentElement;
  if(prev && prev.classList.contains('slot')) prev.classList.remove('filled','correct','incorrect');
  homePool(tile.dataset.type).appendChild(tile);
  clearFeedback();
}

function clearFeedback(){
  const f = document.getElementById('feedback');
  if(f){ f.textContent = ''; f.className = 'feedback'; }
  const h = document.getElementById('hint');
  if(h){ h.style.display = 'none'; h.innerHTML = ''; }
  const btn = document.getElementById('action-btn');
  if(btn && btn.dataset.mode !== 'next'){ btn.textContent = 'Check'; btn.classList.remove('ready'); }
}

/* ---------- checking ---------- */
function check(){
  const btn = document.getElementById('action-btn');
  if(btn.dataset.mode === 'next'){ advance(); return; }

  const q = PROBLEMS[index];
  let all = true;
  let empty = false;

  document.querySelectorAll('.slot').forEach(s => {
    const i = +s.dataset.i;
    const type = s.dataset.type;
    const tile = s.querySelector('.tile');
    const val = tile ? tile.dataset.value : null;
    let want;
    if(type === 'action') want = q.rows[i].doit;
    else want = q.rows[i].eventAnswer;

    s.classList.remove('correct','incorrect');
    if(!val){ empty = true; all = false; return; }
    if(val === want){ s.classList.add('correct'); }
    else { s.classList.add('incorrect'); all = false; }
  });

  const f = document.getElementById('feedback');
  const h = document.getElementById('hint');

  if(empty){
    f.textContent = 'Fill every slot first';
    f.className = 'feedback f-no';
    return;
  }

  if(all){
    solved[index] = true;
    f.textContent = 'All jobs found';
    f.className = 'feedback f-ok';
    btn.dataset.mode = 'next';
    btn.classList.add('ready');
    btn.textContent = index === TOTAL - 1 ? 'See score' : 'Next problem';
  }else{
    f.textContent = 'Not quite';
    f.className = 'feedback f-no';
    h.innerHTML = q.hint.map(x => '<p>' + x + '</p>').join('');
    h.style.display = 'block';
  }
  renderProgress();
}

function advance(){
  if(index === TOTAL - 1){ showScore(); return; }
  index++;
  render();
}
function goBack(){ if(index > 0){ index--; render(); } }

function showScore(){
  document.getElementById('card').style.display = 'none';
  const s = document.getElementById('score');
  s.style.display = 'flex';
  document.getElementById('score-num').textContent = solved.filter(Boolean).length + ' / ' + TOTAL;
  renderProgress();
}

function restart(){
  index = 0;
  solved = new Array(TOTAL).fill(false);
  render();
}

render();
</script>
</body>
</html>
