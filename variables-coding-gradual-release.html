<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Variables: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --scr: #10132c;

        --mono: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }

    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }

    .left { width: 620px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .lab { display: block; font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a90b8; }
    .editor { background: var(--navy); border-radius: 8px; padding: 10px 16px 14px; display: flex; flex-direction: column; gap: 6px; }
    .ehead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .reset { font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #c3c6d0; background: transparent; border: 2px solid #3b4170;

    .tools { display: flex; gap: 8px; }
    .card.ex { position: relative; }
    .xbtn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 2px solid #c3c6d0; border-radius: 6px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .xbtn svg { width: 12px; height: 12px; stroke: var(--navy); stroke-width: 2.4; stroke-linecap: round; }
    .xbtn:hover { border-color: var(--navy); }

        padding: 4px 10px; caret-color: var(--pink); outline: none; -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s; }
    .blank { font-family: var(--mono); font-size: 27px; font-weight: 500; color: #fff; background: rgba(255,255,255,.08); border: 2px dashed #8a90b8; border-radius: 5px;
        padding: 2px 4px; margin: 0 2px; text-align: center; caret-color: var(--pink); outline: none; -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s; }
    .full:focus, .blank:focus { border-color: var(--pink); border-style: solid; }
    .full:focus-visible, .blank:focus-visible { outline: none; }
    .full::placeholder { color: #5d6390; }
    .full.done, .blank.done { border-color: var(--pink); border-style: solid; background: rgba(234,0,138,.25); }
    .screen { flex: 1; min-height: 96px; background: var(--scr); border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
    .screen > div { padding: 10px 18px 12px; font-family: var(--mono); color: #fff; font-size: 24px; font-weight: 700; line-height: 1.4; white-space: pre-wrap; overflow: hidden; }
    .screen .goal { border-left: 2px dashed #3b4170; color: #8a90b8; }
    .screen .err { color: #ff5cb3; font-size: 19px; line-height: 1.3; }
    .screen .errl { color: #8a90b8; font-size: 15px; font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-weight: 800; margin-top: 4px; }

    /* right column: support card and memory */
    .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .card { border: 3px solid var(--navy); border-radius: 8px; padding: 10px 16px 14px; flex-shrink: 0; }

    .excode { background: var(--navy); border-radius: 6px; padding: 8px 14px; font-family: var(--mono); font-size: 22px; font-weight: 500; white-space: pre; line-height: 1.5; color: #fff; }
    .excode .ln3 { color: #6d7299; font-size: 16px; display: inline-block; width: 22px; }
    .exout { margin-top: 8px; display: flex; align-items: center; gap: 12px; }

    .card .htxt { font-size: 22px; font-weight: 600; line-height: 1.3; }

    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
    /* buckles */
    .hright { display: flex; align-items: flex-end; gap: 28px; }
    .bcount { display: flex; align-items: center; gap: 10px; }
    .counter-icon { width: 34px; height: 34px; display: block; }
    .bcount .num { font-family: var(--cond); font-size: 34px; font-weight: 900; line-height: 1; }
    .bcount .lbl { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    .done-buckle { width: 90px; height: 90px; }
    .scorecard .sub { margin-top: 22px; }
    .award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
        background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
    .award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
    .award-img { width: 140px; height: auto; }
    .award-text { font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
    .confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
    @media (prefers-reduced-motion: reduce) { .caption .in, .pop-in, .curs { animation: none; } .award { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Coding <span>variables</span></h1>
        <div class="hright">
            <div class="counter" id="counter"></div>
            <div class="bcount" title="Buckles earned">
                <img src="buckle.svg" alt="" class="counter-icon" onerror="this.style.visibility='hidden'">
                <div class="num" id="buckleCount">0</div>
                <div class="lbl">Buckles</div>
            </div>
        </div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Run</button></div>
    <div class="progress" id="progress"></div>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img" onerror="this.style.display='none'">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', LT = '#f0f3f6', NS = 'http://www.w3.org/2000/svg';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function sel(tag, attrs = {}, html) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; }

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const RUN_ICON = '<svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>';

/* ---------- animation helpers ---------- */
let runId = 0;

/* ---------- syntax colouring ---------- */
function tokens(line) {
    const re = /("[^"]*"?|'[^']*'?)|(-?\d+(?:\.\d+)?)|([A-Za-z_]\w*)|(\s+)|(.)/g, out = [];

        front: `<rect x="${-hw}" y="0" width="${fw}" height="96" fill="${o.ghost ? '#fff' : LT}" ${st} stroke-width="4" stroke-linejoin="round"/>
            <rect x="${-pw / 2}" y="30" width="${pw}" height="40" rx="6" fill="#fff" stroke="${o.ghost ? '#b8bcc8' : PK}" stroke-width="3" ${o.ghost ? 'stroke-dasharray="6 5"' : ''}/>
            <text class="${o.ghost ? 'ghostlbl' : 'vname'}" x="0" y="58" text-anchor="middle">${esc(name)}</text>` };
}
function vbox(layer, cx, ry, name, s = 1) {
    const sh = boxShape(name);
    const g = sel('g', { transform: `translate(${cx} ${ry}) scale(${s})` });
    g.innerHTML = `${sh.back}<g class="vals"></g>${sh.front}`;
    layer.appendChild(g);
    const vals = g.querySelector('.vals');

        g, cur: null, val: null,
        set(val) { vals.innerHTML = ''; this.cur = null; this.val = null; if (val === undefined) return; const c = sel('g', { transform: `translate(0 ${REST})` }, chipSVG(val)); vals.appendChild(c); this.cur = c; this.val = val; },
        appear() { return play(380, k => { const e = easeOut(k); g.setAttribute('opacity', k); g.setAttribute('transform', `translate(${cx} ${ry + 14 * (1 - e)}) scale(${s})`); }); },

        },
        pulse() {

            return play(600, k => { const p = Math.sin(k * Math.PI); r.setAttribute('stroke', p > .15 ? PK : NV); r.setAttribute('stroke-width', 3 + 3 * p); });
        }
    };

}
function ghostBox(cx, ry, name, s = 1) {
    const sh = boxShape(name, { ghost: true });
    return `<g transform="translate(${cx} ${ry}) scale(${s})">${sh.back}${sh.front}
        <g transform="translate(${sh.hw - 6} -6)"><circle r="20" fill="${PK}"/><path d="M-8 -8 L8 8 M8 -8 L-8 8" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
        <text class="note" x="0" y="126" text-anchor="middle" style="fill:${PK};font-weight:700">No box with this name</text></g>`;
}


/* =========================================================
   MINI PYTHON: variables, print, + - * / // % **, str and numbers
   ========================================================= */
const PyErr = (type, msg) => ({ py: true, type, msg });

function lex(s) {

        if (c === '"' || c === "'") { let j = i + 1; while (j < s.length && s[j] !== c) j++; if (j >= s.length) throw PyErr('SyntaxError', 'unterminated string literal'); T.push({ k: 'str', v: s.slice(i + 1, j) }); i = j + 1; continue; }

        if (num) { i += num[0].length; if (/[A-Za-z_]/.test(s[i] || '')) throw PyErr('SyntaxError', 'invalid decimal literal'); T.push({ k: 'num', v: num[0].includes('.') ? { t: 'float', v: parseFloat(num[0]) } : { t: 'int', v: parseInt(num[0], 10) } }); continue; }

        if (nm) { T.push({ k: 'name', v: nm[0] }); i += nm[0].length; continue; }
        const two = s.slice(i, i + 2);
        if (['==', '//', '**'].includes(two)) { T.push({ k: 'op', v: two }); i += 2; continue; }
        if ('+-*/%(),='.includes(c)) { T.push({ k: 'op', v: c }); i++; continue; }

    }
    return T;

/* ========================== Buckles (localStorage) ======================= */
const PAGE_ID = 'variables-coding';
QS.forEach(q => { q.id = q.title.toLowerCase().replace(/[^a-z0-9]+/g, '-'); q.buckles = 1; });
const Buckles = {
    key: 'buckles-shared',
    posKey: 'pos-' + PAGE_ID,
    ns(id) { return PAGE_ID + ':' + id; },
    load() { try { return JSON.parse(localStorage.getItem(this.key)) || {}; } catch (e) { return {}; } },
    save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) {} },
    isDone(id) { return !!this.load()[this.ns(id)]; },
    award(id, n) { const d = this.load(); const k = this.ns(id); if (!d[k]) { d[k] = n; this.save(d); } },
    total() { return Object.values(this.load()).reduce((a, b) => a + b, 0); },
    setPos(i) { try { localStorage.setItem(this.posKey, String(i)); } catch (e) {} },
    getPos() { try { const v = parseInt(localStorage.getItem(this.posKey), 10); return isNaN(v) ? 0 : v; } catch (e) { return 0; } }
};
function refreshCount() { $('#buckleCount').textContent = Buckles.total(); }
function celebrate(n) {
    const a = $('#award');
    $('#awardText').textContent = '+' + n + ' Buckle' + (n > 1 ? 's' : '') + '!';
    a.classList.remove('hide'); a.classList.add('show');
    burstConfetti();
    setTimeout(() => { a.classList.remove('show'); a.classList.add('hide'); setTimeout(() => a.classList.remove('hide'), 360); }, 1100);
}
function burstConfetti() {
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ['#ea008a', '#1b1f45', '#f7a8d4', '#c3c6d0'], cx = innerWidth / 2, cy = innerHeight / 2, parts = [];
    for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 4 + Math.random() * 10;
        parts.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4, size: 5 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * .3, life: 0 });
    }
    const gravity = 0.22, drag = 0.992; let frame = 0;
    (function tick() {
        frame++;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        parts.forEach(p => {
            p.vx *= drag; p.vy = p.vy * drag + gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1 - p.life / 95);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore();
        });
        if (frame < 95) requestAnimationFrame(tick); else canvas.remove();
    })();
}

/* ---------- flow ---------- */
let si = 0, firstTry = [], tries = 0, mode = 'check', cur = null;
function header(q) { return `<div class="qhead"><div class="qtitle">${q.title}</div></div>`; }
function render() {
    runId++;
    content.innerHTML = ''; tries = 0;
    const item = SEQ[si];
    btn.hidden = false;
    const q = item;
    mode = 'check';
    counter.innerHTML = `Question <b>${q.num}</b> / ${TOTAL}`;
    Buckles.setPos(si);
    progress.style.width = ((q.num - 1) / TOTAL * 100) + '%';
    const wrap = el('div', 'q');
    wrap.insertAdjacentHTML('beforeend', header(q));
    wrap.appendChild(el('div', 'prompt', q.prompt));
    const body = el('div', 'body'); wrap.appendChild(body); content.appendChild(wrap);
    cur = buildQ(q, body);
    say(Buckles.isDone(q.id) ? `${STAGES[q.st].instr} You\u2019ve already earned this buckle.` : STAGES[q.st].instr);
    btn.innerHTML = `${RUN_ICON}Run`;
    refresh();
}
function refresh() { if (mode === 'check') btn.disabled = !cur.ready(); }
async function run() {
    const q = SEQ[si];
    tries++; mode = 'running'; btn.disabled = true;
    const lines = cur.lines(), res = pyRun(lines);
    say('Running\u2026');
    await cur.animate(res);
    const v = judge(q, lines, res);
    if (v.ok) {
        if (tries === 1) firstTry[q.num - 1] = true;
        if (!Buckles.isDone(q.id)) { Buckles.award(q.id, q.buckles); refreshCount(); celebrate(q.buckles); }
        cur.lock();
        say(`<b>Correct.</b> ${q.msg}`);
        mode = 'next'; btn.disabled = false; btn.innerHTML = q.num === TOTAL ? 'Finish' : 'Next';
        btn.classList.remove('pop-in'); void btn.offsetWidth; btn.classList.add('pop-in');
        btn.focus({ preventScroll: true });
    } else {
        say(`<b class="no">Not quite.</b> ${v.hint}`);
        if (q.st === 2) cur.unlock();
        mode = 'check'; refresh();
    }
}
btn.onclick = () => {
    if (btn.disabled) return;
    if (mode === 'check') run();
    else if (mode === 'next') { if (si === SEQ.length - 1) finish(); else { si++; render(); } }
};
function finish() {
    runId++;
    content.innerHTML = '';
    btn.hidden = true;
    counter.innerHTML = '<b>Complete</b>';
    progress.style.width = '100%';
    const n = firstTry.filter(Boolean).length;
    Buckles.setPos(SEQ.length);
    say('Take a screenshot of this screen and paste it into Stile as evidence of your work.');
    const c = el('div', 'center');
    const groups = QS.map(q => `<span class="${firstTry[q.num - 1] ? 'y' : ''}">${q.num}</span>`).join('');
    const earned = QS.filter(q => Buckles.isDone(q.id)).length;
    const card = el('div', 'scorecard pop-in', `<img src="buckle.svg" alt="" class="done-buckle" onerror="this.style.display='none'"><div class="big">${earned} / ${TOTAL}</div><div class="dlbl">Buckles earned</div>
        <div class="dlbl sub">Correct on the first run: ${n} / ${TOTAL}</div><div class="dots">${groups}</div>`);
    const again = el('button', 'again', 'Start again');
    again.onclick = () => { si = 0; firstTry = []; Buckles.setPos(0); render(); };
    c.append(card, again); content.appendChild(c);
}

/* ---------- question builder ---------- */
const fixQuotes = s => s.replace(/[\u201c\u201d\u201e\u2033]/g, '"').replace(/[\u2018\u2019\u201a\u2032]/g, "'");
function buildQ(q, body) {
    const left = el('div', 'left'), right = el('div', 'right');
    const ed = el('div', 'editor dk' + (q.lines.length > 3 ? ' compact' : ''));
    const head = el('div', 'ehead', '<span class="lab">Code</span>'), rst = el('button', 'reset', 'Reset');
    const tools = el('div', 'tools');
    let exBtn = null;
    if (q.example) { exBtn = el('button', 'reset', 'Show example'); tools.appendChild(exBtn); }
    tools.appendChild(rst); head.appendChild(tools); ed.appendChild(head);
    const rows = [], inputs = [];
    const mkInput = (cls, val, ph, w) => {
        const i = el('input', cls); i.value = val || ''; i.placeholder = ph || ''; i.spellcheck = false; i.autocomplete = 'off';
        i.setAttribute('autocapitalize', 'off'); i.setAttribute('autocorrect', 'off'); i.dataset.init = val || '';
        if (w) { i.dataset.w = w; i.style.width = (w + 1) + 'ch'; }
        i.addEventListener('input', () => {
            const p = i.selectionStart, v = fixQuotes(i.value); if (v !== i.value) { i.value = v; i.setSelectionRange(p, p); }
            if (i.dataset.w) i.style.width = (Math.max(+i.dataset.w, i.value.length) + 1) + 'ch';
            refresh();
        });
        i.addEventListener('keydown', e => {
            if (e.key !== 'Enter') return; e.preventDefault();
            const k = inputs.indexOf(i);
            if (k < inputs.length - 1) inputs[k + 1].focus(); else if (!btn.disabled && mode === 'check') run();
        });
        inputs.push(i); return i;
    };
    const getters = q.lines.map((ln, li) => {
        const r = el('div', 'erow', `<span class="ln2">${li + 1}</span>`); rows.push(r); ed.appendChild(r);
        if (typeof ln === 'string') { r.appendChild(el('span', 'code', codeHTML(ln))); return () => ln; }
        if ('e' in ln) { const i = mkInput('full', ln.e, ln.ph); i.setAttribute('aria-label', 'Line ' + (li + 1)); r.appendChild(i); return () => i.value; }
        const holder = el('span', 'code'), parts = ln.p.map(pt => {
            if (typeof pt === 'string') { holder.appendChild(el('span', '', codeHTML(pt))); return () => pt; }
            const i = mkInput('blank', '', '', pt.b); i.setAttribute('aria-label', 'Blank on line ' + (li + 1)); holder.appendChild(i); return () => i.value;
        });
        r.appendChild(holder); return () => parts.map(f => f()).join('');
    });
    const scr = el('div', 'screen'), outEl = el('div', 'outp'), goalEl = el('div', 'goal');
    goalEl.innerHTML = `<span class="lab">Goal</span>${esc(q.expect.join('\n'))}`;
    const clearOut = () => { outEl.innerHTML = `<span class="lab">Your screen</span><span class="curs"></span>`; };
    clearOut(); scr.append(outEl, goalEl);
    left.append(ed, scr);
    const card = supportCard(q), mem = el('div', 'mem');
    if (card && !q.example) right.appendChild(card);
    if (card && q.example) {
        const x = el('button', 'xbtn', '<svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg>'); x.setAttribute('aria-label', 'Hide example');
        card.classList.add('ex'); card.appendChild(x);
        const toggle = on => {
            if (on === !!card.parentNode) return;
            if (on) { right.insertBefore(card, right.firstChild); card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in'); } else card.remove();
            exBtn.textContent = on ? 'Hide example' : 'Show example';
            const oldH = H; remeasure(); const t = (memG.getAttribute('transform') || '').match(/-?[\d.]+\)$/);
            memG.setAttribute('transform', `translate(0 ${(t ? parseFloat(t[0]) : 0) + (H - oldH) / 2})`);
        };
        exBtn.onclick = () => toggle(!card.parentNode);
        x.onclick = () => toggle(false);
    }
    right.appendChild(mem);
    body.append(left, right);
    let H = mem.offsetHeight || 180, W = mem.offsetWidth || 500;
    mem.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><text class="plab" x="14" y="26">Memory</text><text class="note emp" x="${W / 2}" y="${H / 2 + 6}" text-anchor="middle">Empty until your code runs</text><g class="m"></g></svg>`;
    const memG = mem.querySelector('.m'), emp = mem.querySelector('.emp');
    const resetMem = () => { memG.innerHTML = ''; memG.removeAttribute('transform'); emp.style.display = ''; };
    const remeasure = () => { H = mem.offsetHeight || H; W = mem.offsetWidth || W; mem.querySelector('svg').setAttribute('viewBox', `0 0 ${W} ${H}`); emp.setAttribute('x', W / 2); emp.setAttribute('y', H / 2 + 6); };
    rst.onclick = () => { if (mode !== 'check') return; inputs.forEach(i => { i.value = i.dataset.init; i.dispatchEvent(new Event('input')); }); rows.forEach(r => r.classList.remove('on', 'bad')); clearOut(); resetMem(); refresh(); inputs[0] && inputs[0].focus(); };
    setTimeout(() => { const f = inputs.find(i => !i.value) || inputs[0]; if (f) f.focus({ preventScroll: true }); }, 60);
    const layout = n => {
        const s = Math.min(n <= 2 ? .74 : n === 3 ? .6 : .5, (H - 56) / 140), gapX = W / n;
        return [...Array(n)].map((_, i) => ({ x: gapX * (i + .5), y: H / 2 + 12 - 26 * s, s }));
    };
    return {
        ready: () => inputs.every(i => i.value.trim() !== '') && (!q.fix || inputs.some(i => i.value !== i.dataset.init)),
        lines: () => getters.map(g => g()),
        async animate(res) {
            rows.forEach(r => r.classList.remove('on', 'bad'));
            outEl.innerHTML = '<span class="lab">Your screen</span>'; resetMem();
            remeasure();
            const names = [...new Set(res.events.filter(e => e.a).map(e => e.name))], pos = layout(names.length), boxes = {};
            if (names.length) emp.style.display = 'none';
            for (const e of res.events) {
                rows.forEach(r => r.classList.remove('on')); rows[e.i].classList.add('on');
                await wait(170);
                if (e.a) {
                    let b = boxes[e.name];
                    if (!b) { const p = pos[names.indexOf(e.name)]; b = boxes[e.name] = vbox(memG, p.x, p.y, e.name, p.s); b.g.setAttribute('opacity', 0); await b.appear(); }
                    await b.put(e.disp);
                } else {
                    const d = el('div', ''); outEl.appendChild(d);
                    await play(Math.max(200, e.text.length * 40), k => { d.textContent = e.text.slice(0, Math.round(k * e.text.length)); });
                }
                await wait(140);
            }
            rows.forEach(r => r.classList.remove('on'));
            if (res.err) {
                rows[res.err.line].classList.add('bad');
                outEl.insertAdjacentHTML('beforeend', `<div class="err">${esc(res.err.type)}: ${esc(res.err.msg)}</div><div class="errl">Error on line ${res.err.line + 1}</div>`);
            } else if (judge(q, getters.map(g => g()), res).ok) goalEl.classList.add('match');
        },
        lock() { inputs.forEach(i => { i.readOnly = true; i.classList.add('done'); }); },
        unlock() {
            if (right.querySelector('.card')) return;
            right.insertBefore(el('div', 'card pop-in', `<div class="lab2">Hint</div><div class="htxt">${q.hint}</div>`), mem);
            const oldH = H; remeasure(); memG.setAttribute('transform', `translate(0 ${(H - oldH) / 2})`);
        }
    };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= SEQ.length) { si = SEQ.length - 1; finish(); } else { si = Math.max(0, pos); render(); }
});
</script>
</body>
