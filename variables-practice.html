<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice: Python Variables</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
<script src="https://skulpt.org/js/skulpt.min.js"></script>
<script src="https://skulpt.org/js/skulpt-stdlib.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
<style>
:root {
    --navy: #1b1f45; --pink: #ea008a; --mid-grey: #9a9a9a; --light-grey: #e8e8e8; --blank: #f0f3f6;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
[class], .CodeMirror * { font-variant-ligatures: none; }
html, body { margin: 0; }
body { font-family: 'Barlow', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy); }
.page { max-width: 1280px; min-height: 100vh; margin: 0 auto; background: #fff; border-top: 6px solid var(--navy); padding: 36px 64px 48px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; gap: 20px; }
h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
h1 span { color: var(--pink); }
.counter { display: flex; align-items: center; gap: 10px; }
.counter-icon { width: 34px; height: 34px; display: block; }
.counter .num { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; line-height: 1; }
.counter .lbl, .dlbl, .mlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

/* progress */
.progress { display: flex; gap: 6px; margin: 18px 0 30px; }
.progress .seg { flex: 1; height: 8px; background: var(--light-grey); border: none; padding: 0; cursor: pointer; border-radius: 2px; transition: background-color .3s; }
.progress .seg.done { background: var(--pink); }
.progress .seg.current { background: var(--navy); }
.progress .seg.done.current { background: var(--pink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); }

/* stage */
.stage-num { margin-bottom: 4px; }
.stage-title { font-size: 36px; font-weight: 800; margin: 0 0 8px; line-height: 1.1; }
.stage-task { font-size: 24px; font-weight: 500; line-height: 1.4; margin: 0; max-width: 62ch; }
.stage-task strong { font-weight: 800; color: var(--pink); }
.stage-task code { font-family: var(--mono); font-weight: 700; font-size: .92em; background: var(--blank); padding: 1px 8px; border-radius: 4px; }

.work { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 26px; }
@media (max-width: 860px) { .work { grid-template-columns: 1fr; } .page { padding: 28px 24px 40px; } }
.panel { border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.phead { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 20px; border-bottom: 2px solid var(--light-grey); }
.phead b { color: var(--pink); }
.panel.out { background: var(--navy); }
.panel.out .phead { color: #9aa0c4; border-bottom-color: rgba(255,255,255,.14); }

.CodeMirror { height: auto; min-height: 240px; font-family: var(--mono); font-size: 22px; line-height: 1.75; color: var(--navy); }
.CodeMirror-lines { padding: 12px 0; }
.CodeMirror-gutters { background: #fff; border-right: none; }
.CodeMirror-linenumber { color: #c3c6d0; padding: 0 10px 0 14px; }
.CodeMirror-cursor { border-left: 3px solid var(--pink); }
.CodeMirror-focused .CodeMirror-selected, .CodeMirror-selected { background: rgba(234,0,138,.14); }
.cm-s-default .cm-keyword { color: var(--pink); font-weight: 700; }
.cm-s-default .cm-builtin { color: var(--navy); font-weight: 600; }
.cm-s-default .cm-string { color: #5b6192; }
.cm-s-default .cm-number { color: var(--navy); font-weight: 700; }
.cm-s-default .cm-comment { color: var(--mid-grey); font-style: italic; }
.cm-s-default .cm-variable, .cm-s-default .cm-operator { color: var(--navy); }

.terminal { flex: 1; min-height: 240px; padding: 18px 22px; font-family: var(--mono); font-size: 22px; line-height: 1.6; color: #fff; white-space: pre-wrap; overflow: auto; }
.terminal .ready { color: #6f7499; font-family: 'Barlow', sans-serif; font-style: italic; }
.terminal .err { color: #ff7fc4; }

/* feedback */
.feedback { min-height: 0; }
.msg { display: none; margin-top: 22px; font-size: 24px; font-weight: 600; line-height: 1.35; animation: in .4s var(--ease); }
.msg.show { display: block; }
.msg b { font-weight: 800; }
.msg.result.ok b { color: var(--pink); }
.msg.curated-hint { border-left: 8px solid var(--pink); padding: 4px 0 4px 24px; }
.msg.curated-hint .mlbl { margin-bottom: 2px; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* controls */
.controls { display: flex; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.btn { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    border-radius: 8px; padding: 10px 26px; cursor: pointer; border: 3px solid var(--navy); background: #fff; color: var(--navy); }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .btn-ghost:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.btn-run { background: var(--navy); color: #fff; display: inline-flex; align-items: center; gap: 12px; }
.btn-run::before { content: ''; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.btn-back { margin-left: auto; border-color: transparent; color: var(--mid-grey); }
.btn-back:hover:not(:disabled) { color: var(--navy); }
.btn-next.ready { background: var(--pink); border-color: var(--pink); color: #fff; }

/* done */
section.done { display: none; flex-direction: column; align-items: center; text-align: center; padding-top: 30px; }
section.done.show { display: flex; }
.scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 26px 70px 30px; display: flex; flex-direction: column; align-items: center; }
.done-buckle { width: 90px; height: 90px; }
section.done .big { font-family: 'Barlow Condensed', sans-serif; font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 10px; }
section.done h2 { font-size: 30px; font-weight: 800; margin: 26px 0 6px; }
section.done p { font-size: 22px; font-weight: 500; margin: 0; max-width: 46ch; }
.keys { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin-top: 18px; font-size: 20px; font-weight: 600; }
.kbd { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: .06em; border: 2px solid var(--navy); border-radius: 5px; padding: 0 8px; margin: 0 2px; }
.btn-ghost { margin-top: 30px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: none; border: none; color: var(--mid-grey); cursor: pointer; }
.btn-ghost:hover { color: var(--navy); }

/* award */
.award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
    background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
.award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
.award-img { width: 140px; height: auto; }
.award-text { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
.confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

/* practice */
.intro { display: flex; align-items: flex-start; gap: 16px; font-size: 24px; font-weight: 500; line-height: 1.4; margin: 24px 0 0; max-width: 64ch; }
.intro::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; margin-top: 12px; }
.intro b { color: var(--pink); font-weight: 800; }
.CodeMirror, .terminal { min-height: 320px; }
.btn-chal { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; background: var(--pink); border-color: var(--pink); color: #fff; }
.btn-chal .oc { font-family: var(--mono); font-size: 18px; font-weight: 700; background: rgba(255,255,255,.22); border-radius: 4px; padding: 2px 8px; letter-spacing: 0; }
.scrim { position: fixed; inset: 0; background: rgba(27,31,69,.35); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
.scrim.show { opacity: 1; pointer-events: auto; }
.sidebar { position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 92vw); background: #fff; border-top: 6px solid var(--pink); z-index: 21;
    transform: translateX(100%); transition: transform .4s var(--ease); display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(27,31,69,.2); }
.sidebar.open { transform: none; }
.sidebar-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 26px 30px 12px; margin: 0 30px; padding-left: 0; padding-right: 0; border-bottom: 4px solid var(--navy); }
.sidebar-head .ttl { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900; text-transform: uppercase; margin: 0; line-height: 1; }
.sidebar-count { font-size: 18px; font-weight: 600; color: var(--mid-grey); margin-top: 6px; }
.sidebar-count span { color: var(--pink); font-weight: 800; }
.sidebar-close { background: none; border: none; font-size: 38px; line-height: 1; color: var(--navy); cursor: pointer; padding: 0 4px; }
.sidebar-close:focus-visible { outline: 3px solid var(--pink); }
.sidebar-body { overflow: auto; padding: 8px 30px 30px; }
.cat { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); margin: 22px 0 8px; }
.chal { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 2px solid var(--light-grey); cursor: pointer; }
.chal:hover .txt strong { color: var(--pink); }
.chal .box { width: 30px; height: 30px; flex-shrink: 0; border: 3px solid #c3c6d0; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 18px; margin-top: 1px; }
.chal.done .box { background: var(--pink); border-color: var(--pink); }
.chal .txt { flex: 1; display: flex; flex-direction: column; }
.chal .txt strong { font-size: 20px; font-weight: 700; line-height: 1.25; transition: color .2s; }
.chal .txt span { font-size: 17px; font-weight: 500; color: #6b6f8c; margin-top: 2px; }
.chal.done .txt strong { color: var(--mid-grey); }
.chal .bk { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 900; color: var(--pink); }
.chal.done .bk { color: #c3c6d0; }
</style>
</head>
<body>
<div class="page">
    <div class="top">
        <h1>Practice: <span>variables</span></h1>
        <div class="counter" title="Buckles earned">
            <img src="buckle.svg" alt="" class="counter-icon">
            <div class="num" id="buckleCount">0</div>
            <div class="lbl">Buckles</div>
        </div>
    </div>

    <p class="intro"><span>Write any Python you like, then press <b>Run</b>. Open <b>Challenges</b> for ideas. You earn buckles automatically when your code does what a challenge asks.</span></p>

    <section class="stage">
        <div class="work">
            <div class="panel">
                <div class="phead">Your code</div>
                <textarea id="editor"># Type your Python here, then press Run
</textarea>
            </div>
            <div class="panel out">
                <div class="phead">Output</div>
                <div class="terminal" id="terminal"><span class="ready">Press Run to see the output</span></div>
            </div>
        </div>
        <div class="controls">
            <button class="btn btn-run" id="runBtn" title="Ctrl + Enter">Run</button>
            <button class="btn btn-back" id="clearBtn" style="margin-left:0">Clear editor</button>
            <button class="btn btn-chal" id="openBtn" aria-controls="sidebar" aria-expanded="false">Challenges <span class="oc" id="openCount">0 / 0</span></button>
        </div>
    </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar" aria-label="Challenges">
    <div class="sidebar-head">
        <div>
            <h2 class="ttl">Challenges</h2>
            <div class="sidebar-count"><span id="chalDone">0</span> of <span id="chalTotal">0</span> earned. Tap one to add it to your code.</div>
        </div>
        <button class="sidebar-close" id="closeBtn" aria-label="Close">&times;</button>
    </div>
    <div class="sidebar-body" id="chalList"></div>
</aside>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const PAGE_ID = "variables-practice";
const $ = id => document.getElementById(id);

/* =========================================================================
   CHALLENGE PROMPTS: each has an auto-check that runs after every execution.
   check(code, out) -> true when satisfied. Buckles are awarded once per id.
   Tapping a prompt's text drops it into the editor as a comment to get going.
   ========================================================================= */
function lines(out){ return out.trim().split("\n").map(l=>l.trim()).filter(l=>l.length); }
function ok(out){ return !/Error|Traceback/i.test(out); }
function assigned(code){
  const names=[]; const re=/(^|\n)\s*([A-Za-z_]\w*)\s*(?:=|\+=|-=|\*=|\/=)(?!=)/g; let m;
  while((m=re.exec(code))) names.push(m[2]); return names;
}
function printedNames(code){
  return [...code.matchAll(/print\s*\(\s*([A-Za-z_]\w*)\s*\)/g)].map(m=>m[1]);
}

const CHALLENGES = [
  { cat:"Warm up", items:[
    { id:"print-var", title:"Print a variable", hint:"Store something, then print it.", buckles:1,
      check:(c,o)=>ok(o)&&lines(o).length>0&&printedNames(c).some(v=>assigned(c).includes(v)) },
    { id:"print-int", title:"Print an integer", hint:"A whole number, no quote marks.", buckles:1,
      check:(c,o)=>ok(o)&&lines(o).some(l=>/^-?\d+$/.test(l)) },
    { id:"print-str", title:"Print a string", hint:"Text inside quote marks.", buckles:1,
      check:(c,o)=>ok(o)&&lines(o).some(l=>/[A-Za-z]/.test(l)&&!/^(True|False|None)$/.test(l)) },
    { id:"print-float", title:"Print a float", hint:"A number with a decimal point.", buckles:1,
      check:(c,o)=>ok(o)&&lines(o).some(l=>/^-?\d+\.\d+$/.test(l)) },
    { id:"print-multi", title:"Print more than one line", hint:"Use two or more print() lines.", buckles:1,
      check:(c,o)=>ok(o)&&lines(o).length>=2 }
  ]},
  { cat:"Variables", items:[
    { id:"store-name", title:"Store your name and print it", hint:"name = \"...\" then print(name).", buckles:1,
      check:(c,o)=>{ const m=c.match(/([A-Za-z_]\w*)\s*=\s*(['"]).*?\2/); if(!m) return false;
        return ok(o)&&lines(o).length>0&&new RegExp("print\\s*\\(\\s*"+m[1]+"\\b").test(c); } },
    { id:"two-vars", title:"Make two variables and print both", hint:"One number, one string.", buckles:1,
      check:(c,o)=>ok(o)&&[...new Set(assigned(c))].length>=2&&lines(o).length>=1 },
    { id:"change-value", title:"Change a variable's value, then print it", hint:"Assign it again with a new value.", buckles:1,
      check:(c,o)=>{ const a=assigned(c),n={}; a.forEach(x=>n[x]=(n[x]||0)+1);
        return ok(o)&&Object.values(n).some(v=>v>=2); } },
    { id:"combine", title:"Print text and a variable together", hint:"Try print(\"Hi\", name).", buckles:1,
      check:(c,o)=>{ const args=[...c.matchAll(/print\s*\(([^()]*)\)/g)].map(m=>m[1]);
        return ok(o)&&args.some(a=>/['"]/.test(a)&&/[,+]/.test(a)&&/[A-Za-z_]\w*/.test(a.replace(/(['"]).*?\1/g,""))); } }
  ]},
  { cat:"Numbers", items:[
    { id:"add", title:"Add two numbers and print the result", hint:"total = a + b", buckles:1,
      check:(c,o)=>ok(o)&&/(^|[^+])\+(?!=)/.test(c)&&lines(o).some(l=>/^-?\d+(\.\d+)?$/.test(l)) },
    { id:"plus-equals", title:"Use += to increase a number", hint:"score += 1", buckles:1,
      check:(c,o)=>ok(o)&&/[A-Za-z_]\w*\s*\+=/.test(c) },
    { id:"counter", title:"Start at 0 and count up three times", hint:"Repeat likes = likes + 1.", buckles:1,
      check:(c,o)=>{ const p=(c.match(/\w+\s*\+=\s*1\b/g)||[]).length;
        let l=0; for(const _ of c.matchAll(/(\w+)\s*=\s*\1\s*\+\s*1\b/g)) l++;
        return ok(o)&&(p+l)>=3; } }
  ]},
  { cat:"Going further", items:[
    { id:"boolean", title:"Make a True/False variable and print it", hint:"is_ready = True", buckles:1,
      check:(c,o)=>ok(o)&&/\b(True|False)\b/.test(c)&&lines(o).some(l=>/^(True|False)$/.test(l)) },
    { id:"swap-type", title:"Reassign a variable to a different type", hint:"Make it a number, then later text.", buckles:1,
      check:(c,o)=>{ const s={},n={};
        for(const m of c.matchAll(/([A-Za-z_]\w*)\s*=\s*(['"])/g)) s[m[1]]=1;
        for(const m of c.matchAll(/([A-Za-z_]\w*)\s*=\s*-?\d/g)) n[m[1]]=1;
        return ok(o)&&Object.keys(s).some(v=>n[v]); } },
    { id:"capstone", title:"Earn every other challenge", hint:"A bonus 3 buckles once all the others are done.", buckles:3, capstone:true,
      check:()=>false }
  ]}
];

/* ===================== Buckles (shared localStorage) ===================== */
/* One shared ledger so the buckle total stays consistent across every page.
   Point other resources at this same key to unify their totals.            */
const Buckles = {
  key:"buckles-shared",
  load(){ try{ return JSON.parse(localStorage.getItem(this.key)) || {}; }catch(e){ return {}; } },
  save(d){ try{ localStorage.setItem(this.key, JSON.stringify(d)); }catch(e){} },
  isDone(id){ return !!this.load()[id]; },
  award(id, n){ const d=this.load(); if(!d[id]){ d[id]=n; this.save(d); } },
  total(){ return Object.values(this.load()).reduce((a,b)=>a+b,0); }
};
const nsId = id => PAGE_ID + ":" + id;

let editor;

/* ============================== Sidebar ================================= */
function allItems(){ return CHALLENGES.flatMap(g=>g.items); }
function nonCapstone(){ return allItems().filter(i=>!i.capstone); }

function buildChallenges(){
  const list = $("chalList"); list.innerHTML = "";
  CHALLENGES.forEach(group=>{
    const h = document.createElement("div"); h.className="cat"; h.textContent=group.cat;
    list.appendChild(h);
    group.items.forEach(item=>{
      const done = Buckles.isDone(nsId(item.id));
      const row = document.createElement("div");
      row.className = "chal" + (done ? " done" : "");
      row.id = "row-" + item.id;
      row.innerHTML =
        '<div class="box">' + (done ? "&#10003;" : "") + '</div>' +
        '<div class="txt"><strong></strong><span></span></div>' +
        '<div class="bk">+' + item.buckles + '</div>';
      row.querySelector("strong").textContent = item.title;
      row.querySelector("span").textContent = item.hint;
      row.addEventListener("click", ()=> insertPrompt(item.title));
      list.appendChild(row);
    });
  });
  $("chalTotal").textContent = allItems().length;
  refreshDoneCount();
}

function markDone(id){
  const row = $("row-" + id);
  if(row && !row.classList.contains("done")){
    row.classList.add("done");
    row.querySelector(".box").innerHTML = "&#10003;";
  }
  refreshDoneCount();
}

function refreshDoneCount(){
  const n = allItems().filter(i=>Buckles.isDone(nsId(i.id))).length;
  $("chalDone").textContent = n;
  $("openCount").textContent = n + " / " + allItems().length;
}
function refreshCount(){ $("buckleCount").textContent = Buckles.total(); }

function insertPrompt(title){
  const doc = editor.getDoc();
  doc.replaceRange("\n# Challenge: " + title + "\n", { line: doc.lastLine() + 1, ch: 0 });
  editor.focus(); editor.setCursor(doc.lastLine(), 0);
}

function openSidebar(){ $("sidebar").classList.add("open"); $("scrim").classList.add("show"); $("openBtn").setAttribute("aria-expanded","true"); }
function closeSidebar(){ $("sidebar").classList.remove("open"); $("scrim").classList.remove("show"); $("openBtn").setAttribute("aria-expanded","false"); }

/* ===================== Evaluate challenges after a run =================== */
function evaluate(code, out){
  let gained = 0;
  nonCapstone().forEach(item=>{
    if(Buckles.isDone(nsId(item.id))) return;
    try{ if(item.check(code, out) === true){ Buckles.award(nsId(item.id), item.buckles); gained += item.buckles; markDone(item.id); } }catch(e){}
  });
  const cap = allItems().find(i=>i.capstone);
  if(cap && !Buckles.isDone(nsId(cap.id)) && nonCapstone().every(i=>Buckles.isDone(nsId(i.id)))){
    Buckles.award(nsId(cap.id), cap.buckles); gained += cap.buckles; markDone(cap.id);
  }
  if(gained > 0){ refreshCount(); celebrate(gained); }
}

/* ===================== Award popup + confetti =========================== */
function celebrate(n){
  const a = $("award");
  $("awardText").textContent = "+" + n + " Buckle" + (n>1?"s":"") + "!";
  a.classList.remove("hide"); a.classList.add("show");
  burstConfetti();
  setTimeout(()=>{ a.classList.remove("show"); a.classList.add("hide");
    setTimeout(()=> a.classList.remove("hide"), 360); }, 1100);
}
function burstConfetti(){
  const canvas = document.createElement("canvas");
  canvas.className = "confetti-canvas";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ["#ea008a","#1b1f45","#f7a8d4","#c3c6d0"];
  const cx = innerWidth/2, cy = innerHeight/2; const parts = [];
  for(let i=0;i<150;i++){
    const angle = Math.random()*Math.PI*2; const speed = 4 + Math.random()*10;
    parts.push({ x:cx, y:cy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 4,
      size:5 + Math.random()*7, color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI, vrot:(Math.random()-.5)*.3, life:0 });
  }
  const gravity = 0.22, drag = 0.992; let frame = 0;
  (function tick(){
    frame++; ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{
      p.vx *= drag; p.vy = p.vy*drag + gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life/95); ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6); ctx.restore();
    });
    if(frame < 95) requestAnimationFrame(tick); else canvas.remove();
  })();
}

/* =============================== Run code =============================== */
let outputBuffer = "";
function runCode(){
  const code = editor.getValue();
  const runBtn = $("runBtn");
  outputBuffer = "";
  runBtn.disabled = true; runBtn.textContent = "Running";
  setTerminal('<span class="ready">Running</span>');

  Sk.configure({
    output: t => { outputBuffer += t; },
    read: x => {
      if(Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
        throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    },
    __future__: Sk.python3,
    execLimit: 5000
  });

  Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => {
      const out = outputBuffer;
      setTerminal('<span class="out">' + (out ? escapeHtml(out) : "(no output)") + '</span>');
      evaluate(code, out);
    })
    .catch(err => {
      let msg = err.toString().replace(/Sk\.builtin\./g, "").replace(/ on line \d+/g, "");
      setTerminal('<span class="err">' + escapeHtml(msg) + '</span>');
    })
    .finally(() => { runBtn.disabled = false; runBtn.textContent = "Run"; });
}

function setTerminal(html){ $("terminal").innerHTML = html; }
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =============================== Wiring ================================= */
function init(){
  editor = CodeMirror.fromTextArea($("editor"), {
    mode:"python", lineNumbers:true, indentUnit:4, indentWithTabs:false,
    lineWrapping:true, autoCloseBrackets:true, matchBrackets:true,
    extraKeys:{
      "Ctrl-Enter": runCode, "Cmd-Enter": runCode,
      "Tab": cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ","end")
    }
  });

  $("runBtn").addEventListener("click", runCode);
  $("clearBtn").addEventListener("click", ()=>{ editor.setValue(""); editor.focus(); });
  $("openBtn").addEventListener("click", openSidebar);
  $("closeBtn").addEventListener("click", closeSidebar);
  $("scrim").addEventListener("click", closeSidebar);
  document.addEventListener("keydown", e=>{ if(e.key === "Escape") closeSidebar(); });

  buildChallenges();
  refreshCount();
  setTimeout(()=>editor.focus(), 60);
}

(function ready(){
  if(typeof CodeMirror === "undefined" || typeof Sk === "undefined") return setTimeout(ready, 80);
  init();
})();
</script>
