<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variables: Named Containers</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    [class] { font-variant-ligatures: none; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 30px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 500; line-height: 1.35; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; transition: opacity .3s, transform .3s var(--ease); }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    .next:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .pop-in { animation: capIn .45s var(--ease); }

    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* containers */
    .boxes { display: flex; gap: 48px; }
    .bcol { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .vbox { width: 240px; border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; background: #fff; transition: border-color .2s, box-shadow .2s, opacity .3s; }
    .vbox .vl { background: var(--navy); color: #fff; font-family: var(--mono); font-size: 24px; font-weight: 700; text-align: center; padding: 8px; transition: background-color .2s; }
    .vbox .vv { height: 120px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .vbox .val { font-family: var(--mono); font-size: 40px; font-weight: 700; position: absolute; }
    .vbox .empty { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #c3c6d0; }
    .vbox.hover, .vbox.pick { border-color: var(--pink); box-shadow: 0 0 0 5px rgba(234,0,138,.14); }
    .vbox.hover .vl { background: var(--pink); }
    .vbox.full .vl { background: var(--navy); }
    .vbox.target { border-color: var(--pink); animation: pulse 1.6s ease-in-out infinite; }
    .vbox.target .vl { background: var(--pink); }
    .vbox.dim { opacity: .35; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 8px rgba(234,0,138,.14); } }
    .vbox.shake { animation: shake .4s; }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .val.snap { animation: snap .45s var(--ease); }
    @keyframes snap { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
    .val.out { animation: out .4s ease forwards; }
    @keyframes out { to { transform: translateY(-90px) rotate(-8deg); opacity: 0; } }
    .val.dropin { animation: dropin .5s var(--ease); }
    @keyframes dropin { from { transform: translateY(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
    .cline { font-family: var(--mono); font-size: 24px; font-weight: 700; color: var(--pink); min-height: 32px; opacity: 0; transition: opacity .35s; white-space: pre; }
    .cline.show { opacity: 1; }

    /* value chip */
    .tray { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 46px; min-height: 104px; }
    .chip { font-family: var(--mono); font-size: 34px; font-weight: 700; background: var(--pink); color: #fff; border-radius: 8px; padding: 10px 28px; cursor: grab;
        touch-action: none; position: relative; z-index: 2; transition: transform .35s var(--ease), box-shadow .2s, opacity .3s; box-shadow: 0 6px 16px rgba(234,0,138,.25); }
    .chip.drag { transition: none; cursor: grabbing; box-shadow: 0 16px 34px rgba(234,0,138,.4); z-index: 10; }
    .chip.sel { outline: 3px solid var(--navy); outline-offset: 4px; }
    .chip.gone { opacity: 0; pointer-events: none; }
    .chip.idle { background: #c3c6d0; box-shadow: none; cursor: default; }
    .ttag { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* feedback */
    .fb { margin-top: 18px; min-height: 40px; font-size: 26px; font-weight: 600; text-align: center; max-width: 900px; line-height: 1.3; }
    .fb b { font-weight: 800; }
    .fb.ok b { color: var(--pink); }
    .fb.hint { color: var(--navy); }
    .fb.hint b { color: var(--navy); }

    /* principle banner */
    .pban { margin-top: 44px; border-left: 8px solid var(--pink); padding: 6px 0 6px 28px; max-width: 900px; }
    .pban .pt { font-size: 36px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
    .pban .ps { font-size: 24px; font-weight: 600; margin-top: 6px; }

    /* predict */
    .prow { display: flex; gap: 70px; align-items: center; justify-content: center; height: 100%; }
    .pq { font-size: 34px; font-weight: 800; line-height: 1.2; margin-bottom: 24px; max-width: 700px; }
    .opts { display: flex; flex-direction: column; gap: 14px; width: 700px; }
    .opt { display: flex; align-items: center; gap: 18px; text-align: left; font-family: 'Barlow', sans-serif; font-size: 25px; font-weight: 600; color: var(--navy);
        background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 14px 20px; cursor: pointer; transition: border-color .2s, background-color .2s, opacity .3s; }
    .opt .lt { width: 40px; height: 40px; flex-shrink: 0; border-radius: 6px; border: 3px solid var(--navy); display: flex; align-items: center; justify-content: center;
        font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 900; transition: background-color .2s, color .2s, border-color .2s; }
    .opt:hover { border-color: var(--pink); }
    .opt.chosen { border-color: var(--pink); background: rgba(234,0,138,.07); }
    .opt.chosen .lt { background: var(--pink); border-color: var(--pink); color: #fff; }
    .with99 { display: flex; flex-direction: column; align-items: center; gap: 26px; }

    /* summary */
    .mcards { display: flex; gap: 28px; }
    .mcard { width: 340px; border: 3px solid var(--navy); border-radius: 8px; padding: 22px 26px 26px; opacity: 0; transform: translateY(14px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
    .mcard.show { opacity: 1; transform: none; }
    .mcard.pink { border-color: var(--pink); }
    .mcard .mn { font-family: 'Barlow Condensed', sans-serif; font-size: 60px; font-weight: 900; color: var(--pink); line-height: 1; margin-bottom: 12px; }
    .mcard .mt { font-size: 28px; font-weight: 700; line-height: 1.25; }
    .endnote { margin-top: 44px; font-size: 26px; font-weight: 600; text-align: center; max-width: 820px; opacity: 0; transition: opacity .5s; }
    .endnote.show { opacity: 1; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Variables: <span>named containers</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Next</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), nextBtn = $('#next'), counter = $('#counter'), progress = $('#progress');
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }

/* ---------- state ---------- */
const KEYS = ['name', 'age', 'sport'];
const state = { name: null, age: null, sport: null };
let prediction = null;
const PRED = [
    'Both values are kept side by side.',
    'The new value replaces the old one.',
    'Nothing happens, because the container is already full.'
];
const isText = v => v.charAt(0) === '"';

/* ---------- containers ---------- */
function containers() {
    const row = el('div', 'boxes');
    const boxes = {};
    KEYS.forEach(k => {
        const col = el('div', 'bcol');
        const b = el('div', 'vbox', `<div class="vl">${k}</div><div class="vv"></div>`);
        b.key = k;
        const line = el('div', 'cline');
        col.append(b, line); row.appendChild(col);
        b.line = line;
        b.render = (anim) => {
            const vv = b.querySelector('.vv'); vv.innerHTML = '';
            const v = state[k];
            b.classList.toggle('full', v !== null);
            if (v === null) { vv.appendChild(el('span', 'empty', 'Empty')); line.classList.remove('show'); return; }
            const s = el('span', 'val' + (anim ? ' ' + anim : ''), v); vv.appendChild(s);
            line.textContent = `${k} = ${v}`; line.classList.add('show');
        };
        b.render();
        boxes[k] = b;
    });
    row.boxes = boxes;
    return row;
}
function shake(b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }

/* ---------- drag or tap a chip ---------- */
function chipFor(value, boxes, onDrop) {
    const chip = el('div', 'chip', value);
    chip.tabIndex = 0; chip.setAttribute('role', 'button'); chip.setAttribute('aria-label', 'Value ' + value);
    const list = Object.values(boxes);
    const hit = (x, y) => list.find(b => { const r = b.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    const setPick = on => { chip.classList.toggle('sel', on); list.forEach(b => b.classList.toggle('pick', on)); };
    const attempt = b => { setPick(false); const ok = onDrop(b); if (!ok) chip.style.transform = ''; };
    chip.addEventListener('pointerdown', e => {
        if (chip.classList.contains('gone') || chip.classList.contains('idle')) return;
        e.preventDefault(); chip.setPointerCapture(e.pointerId);
        const sx = e.clientX, sy = e.clientY; let moved = false;
        chip.classList.add('drag');
        const move = ev => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            if (Math.hypot(dx, dy) > 6) moved = true;
            chip.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px) scale(1.06)`;
            const h = hit(ev.clientX, ev.clientY);
            list.forEach(b => b.classList.toggle('hover', b === h));
        };
        const up = ev => {
            chip.removeEventListener('pointermove', move); chip.removeEventListener('pointerup', up); chip.removeEventListener('pointercancel', up);
            chip.classList.remove('drag'); list.forEach(b => b.classList.remove('hover'));
            if (!moved) { chip.style.transform = ''; setPick(!chip.classList.contains('sel')); return; }
            const b = hit(ev.clientX, ev.clientY);
            if (b) attempt(b); else chip.style.transform = '';
        };
        chip.addEventListener('pointermove', move); chip.addEventListener('pointerup', up); chip.addEventListener('pointercancel', up);
    });
    chip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setPick(!chip.classList.contains('sel')); } });
    list.forEach(b => { b.onclick = () => { if (chip.classList.contains('sel')) attempt(b); }; });
    return chip;
}

/* ---------- steps ---------- */
const PLACE = [
    { v: '"Mia"', key: 'name', type: 'Text, in quotes' },
    { v: '14', key: 'age', type: 'Number, no quotes' },
    { v: '"soccer"', key: 'sport', type: 'Text, in quotes' }
];
function wrongMsg(v, k) {
    if (state[k] !== null) return `<b>${k}</b> already holds a value. Choose an empty container.`;
    if (isText(v) && k === 'age') return `Quotes mean <b>text</b>. age is usually a number, with no quotes. Try another container.`;
    if (!isText(v)) return `${v} has no quotes, so it is a <b>number</b>. ${k} is usually text. Try another container.`;
    return `${v} is not a ${k}. Read the label again and try another container.`;
}

function placeStep(i) {
    const p = PLACE[i];
    return {
        run() {
            say(i === 0 ? 'Drag the value into the container where it belongs.' : 'Drag this value into the container where it belongs.');
            const c = el('div', 'center');
            const row = containers();
            const tray = el('div', 'tray');
            const fb = el('div', 'fb');
            const chip = chipFor(p.v, row.boxes, b => {
                if (b.key !== p.key) { shake(b); fb.className = 'fb hint pop-in'; fb.innerHTML = wrongMsg(p.v, b.key); return false; }
                chip.classList.add('gone'); tray.lastChild.style.visibility = 'hidden';
                state[p.key] = p.v; b.render('snap');
                fb.className = 'fb ok pop-in'; fb.innerHTML = `<b>Correct.</b> The container called ${p.key} now holds ${p.v}.`;
                showNext();
                return true;
            });
            tray.append(chip, el('div', 'ttag', p.type));
            c.append(row, tray, fb); content.appendChild(c);
        }
    };
}

const steps = [
    placeStep(0), placeStep(1), placeStep(2),
    {
        run() {
            say('Each container has a <b>name</b> on its label, and holds a <b>value</b> inside.');
            const c = el('div', 'center');
            const row = containers();
            const ban = el('div', 'pban pop-in', '<div class="dlbl">Key idea 1</div><div class="pt">A variable is a named container.</div><div class="ps">The name tells you what is stored inside.</div>');
            c.append(row, ban); content.appendChild(c);
            showNext();
        }
    },
    {
        run() {
            say('Make a prediction first. There is no wrong answer yet.');
            const row = el('div', 'prow');
            const left = el('div', 'with99');
            const boxes = containers();
            const age = boxes.boxes.age, col = age.parentNode;
            const chip = el('div', 'chip idle', '99');
            left.append(chip, col);
            const right = el('div');
            right.appendChild(el('div', 'pq', 'The <span style="font-family:var(--mono)">age</span> container already holds 14. What happens if you put 99 into it?'));
            const opts = el('div', 'opts');
            PRED.forEach((t, j) => {
                const o = el('button', 'opt', `<span class="lt">${'ABC'[j]}</span><span>${t}</span>`);
                o.type = 'button';
                o.onclick = () => { prediction = j; opts.querySelectorAll('.opt').forEach(x => x.classList.toggle('chosen', x === o)); nextBtn.disabled = false; nextBtn.textContent = 'Lock it in'; o.blur(); };
                opts.appendChild(o);
            });
            right.appendChild(opts);
            row.append(left, right); content.appendChild(row);
            showNext(true, 'Lock it in');
        }
    },
    {
        run() {
            say('Now test your prediction. Drag <b>99</b> onto the <b>age</b> container.');
            const c = el('div', 'center');
            const row = containers();
            const B = row.boxes;
            B.age.classList.add('target');
            const tray = el('div', 'tray');
            const fb = el('div', 'fb');
            const chip = chipFor('99', B, b => {
                if (b.key !== 'age') { shake(b); fb.className = 'fb hint pop-in'; fb.innerHTML = 'Drop 99 onto the <b>age</b> container.'; return false; }
                chip.classList.add('gone'); tray.lastChild.style.visibility = 'hidden'; b.classList.remove('target');
                const old = b.querySelector('.val'); if (old) old.classList.add('out');
                setTimeout(() => {
                    state.age = '99'; b.render('dropin');
                    const right = prediction === 1;
                    fb.className = 'fb ok pop-in';
                    fb.innerHTML = (right ? '<b>Your prediction was right.</b> The new value replaced the old one. ' : '<b>Not quite.</b> The new value replaced the old one. ') + '14 is gone for good.';
                    say('The name stays the same. Only the <b>value</b> changes.');
                    showNext();
                }, 420);
                return true;
            });
            tray.append(chip, el('div', 'ttag', 'Number, no quotes'));
            c.append(row, tray, fb); content.appendChild(c);
        }
    },
    {
        run() {
            say('Head back to Stile to complete the next activity, or refresh this page to try again.');
            const c = el('div', 'center');
            const row = el('div', 'mcards');
            const txt = ['A variable is a named container.', 'The name stays; the value can change.', 'One name holds one value at a time.'];
            const cards = txt.map((t, i) => { const k = el('div', 'mcard' + (i === 1 ? ' pink' : ''), `<div class="mn">0${i + 1}</div><div class="mt">${t}</div>`); row.appendChild(k); return k; });
            c.appendChild(row); content.appendChild(c);
            cards.forEach((k, i) => setTimeout(() => k.classList.add('show'), 300 + i * 300));
        },
        final: true
    }
];

/* ---------- flow ---------- */
let cur = 0;
const QCOUNT = steps.length - 1;
function showNext(disabled = false, label = 'Next') {
    nextBtn.hidden = false; nextBtn.disabled = disabled; nextBtn.textContent = label;
    nextBtn.classList.remove('pop-in'); void nextBtn.offsetWidth; nextBtn.classList.add('pop-in');
    if (!disabled) setTimeout(() => nextBtn.focus({ preventScroll: true }), 50);
}
function go(i) {
    cur = i;
    content.innerHTML = '';
    nextBtn.hidden = true;
    const s = steps[i];
    counter.innerHTML = s.final ? '<b>Complete</b>' : `Step <b>${i + 1}</b> / ${QCOUNT}`;
    progress.style.width = (s.final ? 100 : (i / QCOUNT) * 100) + '%';
    s.run();
}
nextBtn.onclick = () => { if (!nextBtn.disabled && cur < steps.length - 1) go(cur + 1); };

function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); go(0); });
</script>
</body>
</html>
