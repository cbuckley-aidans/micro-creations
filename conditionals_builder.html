<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build a conditional statement</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    [class] { font-variant-ligatures: none; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 30px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 27px; font-weight: 500; line-height: 1.35; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }

    .next { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; transition: opacity .3s, transform .3s var(--ease); }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    .next:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
    .pop-in { animation: capIn .45s var(--ease); }

    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* builder */
    .brow2 { display: flex; gap: 56px; align-items: center; justify-content: center; height: 100%; }
    .chart { position: relative; width: 560px; height: 430px; flex-shrink: 0; }
    .chart svg { position: absolute; inset: 0; overflow: visible; }
    .chart .dia { fill: #fff; stroke: var(--pink); stroke-width: 4; stroke-linejoin: round; }
    .chart .ln { stroke: var(--navy); stroke-width: 3.5; fill: none; }
    .chart .ah { fill: var(--navy); }
    .slot { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; text-align: center;
        border: 3px dashed #c3c6d0; border-radius: 8px; background: #fff; font-size: 22px; font-weight: 700; line-height: 1.15; padding: 0 8px; cursor: pointer;
        transition: border-color .2s, background-color .2s, color .2s; }
    .slot.cond { width: 250px; height: 60px; }
    .slot.lab { width: 120px; height: 46px; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: .06em; }
    .slot.act { width: 230px; height: 72px; }
    .slot.hover, .slot.pick { border-color: var(--pink); background: #fdf0f7; }
    .slot.filled { border-style: solid; border-color: var(--navy); }
    .slot.act.filled { background: var(--navy); color: #fff; }
    .slot.lab.filled.t { background: var(--pink); border-color: var(--pink); color: #fff; }
    .slot.lab.filled.f { background: var(--navy); color: #fff; }
    .slot.fixed { cursor: default; border-style: solid; }
    .slot.wrong { border: 3px dashed var(--navy) !important; background: #eef0f6 !important; color: var(--navy) !important; animation: shake .4s; }
    .slot.right { box-shadow: 0 0 0 4px rgba(234,0,138,.25); }
    @keyframes shake { 20%, 60% { margin-left: -8px; } 40%, 80% { margin-left: 8px; } }
    .side { width: 480px; display: flex; flex-direction: column; gap: 22px; }
    .rnote { font-size: 26px; font-weight: 700; line-height: 1.3; }
    .bank { display: flex; flex-wrap: wrap; gap: 12px; min-height: 120px; align-content: flex-start; }
    .chip { font-family: 'Barlow', sans-serif; font-size: 22px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px;
        padding: 8px 16px; cursor: grab; touch-action: none; position: relative; z-index: 2; box-shadow: 0 4px 0 #c3c6d0; transition: transform .3s var(--ease); }
    .chip.drag { transition: none; cursor: grabbing; z-index: 20; border-color: var(--pink); box-shadow: 0 14px 30px rgba(27,31,69,.25); }
    .chip.sel { border-color: var(--pink); background: #fdf0f7; }
    .chip:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .rules { display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--light-grey); padding-top: 18px; }
    .rules div { font-size: 21px; font-weight: 600; color: #b3b6c2; transition: color .25s; display: flex; gap: 12px; }
    .rules div::before { content: ''; width: 8px; height: 8px; margin-top: 10px; background: #c3c6d0; flex-shrink: 0; transition: background-color .25s; }
    .rules div.on { color: var(--navy); }
    .rules div.on::before { background: var(--pink); }
    .rules b { font-weight: 800; }
    .reset { align-self: flex-start; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: none; border: none; color: var(--mid-grey); cursor: pointer; padding: 0; }
    .reset:hover { color: var(--navy); }
    .mcards { display: flex; gap: 28px; }
    .mcard { width: 340px; border: 3px solid var(--navy); border-radius: 8px; padding: 22px 26px 26px; opacity: 0; transform: translateY(14px); transition: opacity .45s var(--ease), transform .45s var(--ease); }
    .mcard.show { opacity: 1; transform: none; }
    .mcard.pink { border-color: var(--pink); }
    .mcard .mn { font-family: 'Barlow Condensed', sans-serif; font-size: 60px; font-weight: 900; color: var(--pink); line-height: 1; margin-bottom: 12px; }
    .mcard .mt { font-size: 26px; font-weight: 700; line-height: 1.25; }
    .mcard .mt b { color: var(--pink); }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Build a <span>conditional</span></h1>
        <div class="counter" id="counter"></div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Check</button></div>
    <div class="progress" id="progress"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* =========================================================
   EDIT HERE: each object is one round.
   ========================================================= */
const ROUNDS = [
    { note: 'Most of the chart is built. Drop the three missing pieces into place.',
      scenario: { condition: 'Is it dark?', trueAction: 'Turn on the light', falseAction: 'Leave it off' },
      prefilled: { trueLabel: 'true', falseLabel: 'false' },
      bank: ['Is it dark?', 'Turn on the light', 'Leave it off'] },
    { note: 'This time, place the true and false labels as well.',
      scenario: { condition: 'Is it raining?', trueAction: 'Take an umbrella', falseAction: 'Wear sunglasses' },
      prefilled: {},
      bank: ['Is it raining?', 'true', 'false', 'Take an umbrella', 'Wear sunglasses', 'maybe'] },
    { note: 'Nothing is given. Build the whole chart yourself.',
      scenario: { condition: 'Are you hungry?', trueAction: 'Eat a snack', falseAction: 'Keep working' },
      prefilled: {},
      bank: ['Are you hungry?', 'true', 'false', 'Eat a snack', 'Keep working', 'perhaps', 'later'] }
];
const RULES = [
    'A <b>condition</b> is a true or false question the computer checks.',
    'If the condition is <b>true</b>, the first action runs.',
    'If the condition is <b>false</b>, the other action runs.'
];
const SLOTS = {
    condition:   { cls: 'cond', x: 280, y: 90,  g: 0 },
    trueLabel:   { cls: 'lab',  x: 120, y: 262, g: 1 },
    falseLabel:  { cls: 'lab',  x: 440, y: 262, g: 2 },
    trueAction:  { cls: 'act',  x: 120, y: 380, g: 1 },
    falseAction: { cls: 'act',  x: 440, y: 380, g: 2 }
};
const NAMES = Object.keys(SLOTS);

let ri = 0, state = {}, fixed = {}, order = [], selected = null, mode = 'check', tries = 0, firstTry = [];
let slotEls = {}, bankEl, rulesEl;
const answer = (n, r) => n === 'trueLabel' ? 'true' : n === 'falseLabel' ? 'false' : r.scenario[n];

function round() {
    const r = ROUNDS[ri];
    state = {}; fixed = {}; selected = null; mode = 'check'; tries = 0;
    NAMES.forEach(n => state[n] = null);
    Object.entries(r.prefilled).forEach(([n, v]) => { state[n] = v; fixed[n] = true; });
    order = shuffle(r.bank);
    counter.innerHTML = `Round <b>${ri + 1}</b> / ${ROUNDS.length}`;
    progress.style.width = (ri / ROUNDS.length * 100) + '%';
    content.innerHTML = '';
    const row = el('div', 'brow2');
    const chart = el('div', 'chart', `<svg viewBox="0 0 560 430" width="560" height="430" aria-hidden="true">
        <polygon class="dia" points="280,10 480,90 280,170 80,90"/>
        <path class="ln" d="M280 170 V200 M120 200 H440 M120 200 V328 M440 200 V328"/>
        <polygon class="ah" points="110,326 130,326 120,342"/><polygon class="ah" points="430,326 450,326 440,342"/></svg>`);
    slotEls = {};
    NAMES.forEach(n => {
        const s = SLOTS[n], e = el('div', 'slot ' + s.cls);
        e.style.left = s.x + 'px'; e.style.top = s.y + 'px'; e.tabIndex = 0; e.name = n;
        e.onclick = () => { if (fixed[n] || mode !== 'check') return; if (selected) place(n, selected); else clear(n); };
        e.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); e.click(); } };
        chart.appendChild(e); slotEls[n] = e;
    });
    const side = el('div', 'side');
    side.appendChild(el('div', 'rnote', r.note));
    bankEl = el('div', 'bank');
    rulesEl = el('div', 'rules', RULES.map(t => `<div><span>${t}</span></div>`).join(''));
    const reset = el('button', 'reset', 'Reset round'); reset.onclick = round;
    side.append(bankEl, rulesEl, reset);
    row.append(chart, side); content.appendChild(row);
    say('Drag each piece onto the chart, or tap a piece then tap a slot. Tap a placed piece to send it back.');
    btn.hidden = false; btn.textContent = 'Check';
    draw();
}

function draw() {
    NAMES.forEach(n => {
        const e = slotEls[n], v = state[n];
        e.classList.remove('filled', 'fixed', 't', 'f', 'pick');
        e.textContent = v || '';
        if (v) e.classList.add('filled');
        if (fixed[n]) e.classList.add('fixed');
        if (v === 'true') e.classList.add('t');
        if (v === 'false') e.classList.add('f');
        if (selected && !fixed[n]) e.classList.add('pick');
    });
    bankEl.innerHTML = '';
    const used = new Set(Object.values(state));
    order.forEach(text => { if (!used.has(text)) bankEl.appendChild(chip(text)); });
    if (mode === 'check') btn.disabled = NAMES.some(n => !state[n]);
}

function lightRule(g) { [...rulesEl.children].forEach((d, i) => { if (i === g) d.classList.add('on'); }); }
function place(n, text) {
    if (fixed[n]) return;
    NAMES.forEach(k => { if (state[k] === text && !fixed[k]) state[k] = null; });
    state[n] = text; selected = null;
    NAMES.forEach(k => slotEls[k].classList.remove('wrong', 'right'));
    lightRule(SLOTS[n].g);
    draw();
}
function clear(n) { if (fixed[n] || !state[n]) return; state[n] = null; slotEls[n].classList.remove('wrong'); draw(); }

function chip(text) {
    const c = el('button', 'chip' + (selected === text ? ' sel' : ''), text);
    const hit = (x, y) => NAMES.find(n => { const r = slotEls[n].getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; });
    c.addEventListener('pointerdown', e => {
        if (mode !== 'check') return;
        e.preventDefault(); c.setPointerCapture(e.pointerId);
        const sx = e.clientX, sy = e.clientY; let moved = false;
        c.classList.add('drag');
        const move = ev => {
            const dx = ev.clientX - sx, dy = ev.clientY - sy;
            if (Math.hypot(dx, dy) > 6) moved = true;
            c.style.transform = `translate(${dx / scaleK}px, ${dy / scaleK}px)`;
            const h = hit(ev.clientX, ev.clientY);
            NAMES.forEach(n => slotEls[n].classList.toggle('hover', n === h && !fixed[n]));
        };
        const up = ev => {
            c.removeEventListener('pointermove', move); c.removeEventListener('pointerup', up); c.removeEventListener('pointercancel', up);
            c.classList.remove('drag'); NAMES.forEach(n => slotEls[n].classList.remove('hover'));
            if (!moved) { c.style.transform = ''; selected = selected === text ? null : text; draw(); return; }
            const h = hit(ev.clientX, ev.clientY);
            if (h && !fixed[h]) place(h, text); else c.style.transform = '';
        };
        c.addEventListener('pointermove', move); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    });
    c.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selected = selected === text ? null : text; draw(); } });
    return c;
}

function check() {
    const r = ROUNDS[ri]; tries++;
    let wrong = 0;
    NAMES.forEach(n => {
        const e = slotEls[n]; if (fixed[n]) return;
        e.classList.remove('wrong', 'right'); void e.offsetWidth;
        if (state[n] === answer(n, r)) e.classList.add('right'); else { e.classList.add('wrong'); wrong++; }
    });
    if (!wrong) {
        if (tries === 1) firstTry[ri] = true;
        mode = 'next';
        [...rulesEl.children].forEach(d => d.classList.add('on'));
        bankEl.style.visibility = 'hidden';
        say(`<b>Chart complete.</b> ${ri === ROUNDS.length - 1 ? 'You built it with no help.' : 'Press <b>Next</b> when you are ready.'}`);
        btn.disabled = false; btn.textContent = ri === ROUNDS.length - 1 ? 'Finish' : 'Next';
        btn.classList.remove('pop-in'); void btn.offsetWidth; btn.classList.add('pop-in');
    } else {
        say(`<b>Not quite.</b> ${wrong} ${wrong === 1 ? 'piece is' : 'pieces are'} in the wrong place. Tap a highlighted piece to send it back, then try again.`);
    }
}

function finish() {
    content.innerHTML = ''; btn.hidden = true;
    counter.innerHTML = '<b>Complete</b>'; progress.style.width = '100%';
    say('Screenshot this screen and paste it into Stile as evidence. Refresh the page to try again.');
    const c = el('div', 'center');
    const row = el('div', 'mcards');
    const cards = RULES.map((t, i) => { const k = el('div', 'mcard' + (i === 0 ? ' pink' : ''), `<div class="mn">0${i + 1}</div><div class="mt">${t}</div>`); row.appendChild(k); return k; });
    c.appendChild(row); content.appendChild(c);
    cards.forEach((k, i) => setTimeout(() => k.classList.add('show'), 300 + i * 300));
}

btn.onclick = () => {
    if (btn.disabled) return;
    if (mode === 'check') check();
    else if (ri === ROUNDS.length - 1) finish();
    else { ri++; round(); }
};

function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); round(); });
</script>
</body>
</html>
