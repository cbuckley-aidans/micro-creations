<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Extension: If / Else</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
<script src="https://skulpt.org/js/skulpt.min.js"></script>
<script src="https://skulpt.org/js/skulpt-stdlib.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
<style>
:root {
    --navy: #1b1f45; --pink: #ea008a; --mid-grey: #9a9a9a; --light-grey: #e8e8e8; --blank: #f0f3f6;
    --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
    --ease: cubic-bezier(.2,.8,.2,1);
}
* { box-sizing: border-box; }
[class], .CodeMirror * { font-variant-ligatures: none; }
html, body { margin: 0; }
body { font-family: 'Barlow', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy); }
.page { max-width: 1280px; min-height: 100vh; margin: 0 auto; background: #fff; border-top: 6px solid var(--navy); padding: 36px 64px 48px; }

/* header */
.top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; gap: 20px; }
h1 { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
h1 span { color: var(--pink); }
.counter { display: flex; align-items: center; gap: 10px; }
.counter-icon { width: 34px; height: 34px; display: block; }
.counter .num { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; line-height: 1; }
.counter .lbl, .dlbl, .mlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

/* progress */
.progress { display: flex; gap: 6px; margin: 18px 0 30px; }
.progress .seg { flex: 1; height: 8px; background: var(--light-grey); border: none; padding: 0; cursor: pointer; border-radius: 2px; transition: background-color .3s; }
.progress .seg.done { background: var(--pink); }
.progress .seg.current { background: var(--navy); }
.progress .seg.done.current { background: var(--pink); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); }

/* stage */
.stage-num { margin-bottom: 4px; }
.stage-title { font-size: 36px; font-weight: 800; margin: 0 0 8px; line-height: 1.1; }
.stage-task { font-size: 24px; font-weight: 500; line-height: 1.4; margin: 0; max-width: 62ch; }
.stage-task strong { font-weight: 800; color: var(--pink); }
.stage-task code { font-family: var(--mono); font-weight: 700; font-size: .92em; background: var(--blank); padding: 1px 8px; border-radius: 4px; }

.work { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 26px; }
@media (max-width: 860px) { .work { grid-template-columns: 1fr; } .page { padding: 28px 24px 40px; } }
.panel { border: 3px solid var(--navy); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
.phead { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 20px; border-bottom: 2px solid var(--light-grey); }
.phead b { color: var(--pink); }
.panel.out { background: var(--navy); }
.panel.out .phead { color: #9aa0c4; border-bottom-color: rgba(255,255,255,.14); }

.CodeMirror { height: auto; min-height: 240px; font-family: var(--mono); font-size: 22px; line-height: 1.75; color: var(--navy); }
.CodeMirror-lines { padding: 12px 0; }
.CodeMirror-gutters { background: #fff; border-right: none; }
.CodeMirror-linenumber { color: #c3c6d0; padding: 0 10px 0 14px; }
.CodeMirror-cursor { border-left: 3px solid var(--pink); }
.CodeMirror-focused .CodeMirror-selected, .CodeMirror-selected { background: rgba(234,0,138,.14); }
.cm-s-default .cm-keyword { color: var(--pink); font-weight: 700; }
.cm-s-default .cm-builtin { color: var(--navy); font-weight: 600; }
.cm-s-default .cm-string { color: #5b6192; }
.cm-s-default .cm-number { color: var(--navy); font-weight: 700; }
.cm-s-default .cm-comment { color: var(--mid-grey); font-style: italic; }
.cm-s-default .cm-variable, .cm-s-default .cm-operator { color: var(--navy); }

.terminal { flex: 1; min-height: 240px; padding: 18px 22px; font-family: var(--mono); font-size: 22px; line-height: 1.6; color: #fff; white-space: pre-wrap; overflow: auto; }
.terminal .ready { color: #6f7499; font-family: 'Barlow', sans-serif; font-style: italic; }
.terminal .err { color: #ff7fc4; }

/* worked example */
.example { margin-top: 20px; max-width: 760px; border: 3px solid var(--light-grey); border-left: 8px solid var(--pink); border-radius: 8px; display: grid; grid-template-columns: 1fr auto; }
.example pre { margin: 4px 0 0; font-family: var(--mono); font-size: 19px; line-height: 1.55; font-weight: 500; white-space: pre; }
.example .ex-code { padding: 12px 20px 14px; }
.example.noout { grid-template-columns: 1fr; }
.example .ex-out { padding: 12px 20px 14px; background: var(--navy); color: #fff; min-width: 200px; border-radius: 0 5px 0 0; }
.example .ex-out .mlbl { color: #9aa0c4; }
.example .ex-note { grid-column: 1 / -1; padding: 10px 20px 12px; font-size: 19px; font-weight: 600; border-top: 2px solid var(--light-grey); }
.example .mlbl { color: var(--pink); }
/* feedback */
.feedback { min-height: 0; }
.msg { display: none; margin-top: 22px; font-size: 24px; font-weight: 600; line-height: 1.35; animation: in .4s var(--ease); }
.msg.show { display: block; }
.msg b { font-weight: 800; }
.msg.result.ok b { color: var(--pink); }
.msg.curated-hint { border-left: 8px solid var(--pink); padding: 4px 0 4px 24px; }
.msg.curated-hint .mlbl { margin-bottom: 2px; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* controls */
.controls { display: flex; align-items: center; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.btn { font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    border-radius: 8px; padding: 10px 26px; cursor: pointer; border: 3px solid var(--navy); background: #fff; color: var(--navy); }
.btn:disabled { opacity: .35; cursor: default; }
.btn:focus-visible, .btn-ghost:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
.btn-run { background: var(--navy); color: #fff; display: inline-flex; align-items: center; gap: 12px; }
.btn-run::before { content: ''; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.btn-back { margin-left: auto; border-color: transparent; color: var(--mid-grey); }
.btn-back:hover:not(:disabled) { color: var(--navy); }
.btn-next.ready { background: var(--pink); border-color: var(--pink); color: #fff; }

/* done */
.done { display: none; flex-direction: column; align-items: center; text-align: center; padding-top: 30px; }
.done.show { display: flex; }
.scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 26px 70px 30px; display: flex; flex-direction: column; align-items: center; }
.done-buckle { width: 90px; height: 90px; }
.done .big { font-family: 'Barlow Condensed', sans-serif; font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 10px; }
.done h2 { font-size: 30px; font-weight: 800; margin: 26px 0 6px; }
.done p { font-size: 22px; font-weight: 500; margin: 0; max-width: 46ch; }
.keys { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin-top: 18px; font-size: 20px; font-weight: 600; }
.kbd { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; letter-spacing: .06em; border: 2px solid var(--navy); border-radius: 5px; padding: 0 8px; margin: 0 2px; }
.btn-ghost { margin-top: 30px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    background: none; border: none; color: var(--mid-grey); cursor: pointer; }
.btn-ghost:hover { color: var(--navy); }

/* award */
.award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
    background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
    box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
.award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
.award-img { width: 140px; height: auto; }
.award-text { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
.confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="page">
    <div class="top">
        <h1>Extension: <span>if / else</span></h1>
        <div class="counter" title="Buckles earned">
            <img src="buckle.svg" alt="" class="counter-icon">
            <div class="num" id="buckleCount">0</div>
            <div class="lbl">Buckles</div>
        </div>
    </div>

    <div class="progress" id="progress"></div>

    <section class="stage" id="stageCard">
        <div class="dlbl stage-num">Stage <span id="stageOf"></span></div>
        <h2 class="stage-title" id="stageTitle"></h2>
        <p class="stage-task" id="stageTask"></p>
        <div id="stageExample"></div>

        <div class="work">
            <div class="panel">
                <div class="phead">Your code: <b>edit this</b></div>
                <textarea id="editor"></textarea>
            </div>
            <div class="panel out">
                <div class="phead">Output</div>
                <div class="terminal" id="terminal"></div>
            </div>
        </div>

        <div class="feedback">
            <div class="msg curated-hint" id="hintMsg"></div>
            <div class="msg result" id="resultMsg"></div>
        </div>

        <div class="controls">
            <button class="btn btn-run" id="runBtn" title="Ctrl + Enter">Run</button>
            <button class="btn btn-hint" id="hintBtn">Hint</button>
            <button class="btn btn-back" id="backBtn">Back</button>
            <button class="btn btn-next" id="nextBtn">Next</button>
        </div>
    </section>

    <section class="done" id="doneCard">
        <div class="scorecard">
            <img src="buckle.svg" alt="" class="done-buckle">
            <div class="big"><span id="doneTotal">0</span></div>
            <div class="dlbl">Buckles earned</div>
        </div>
        <h2>All stages complete</h2>
        <p>Screenshot this screen and paste it into Stile, so your teacher can see you finished every Extension task.</p>
        <div class="keys">
            <span><span class="kbd">Win</span> + <span class="kbd">Shift</span> + <span class="kbd">S</span> to screenshot</span>
            <span><span class="kbd">Ctrl</span> + <span class="kbd">V</span> to paste in Stile</span>
        </div>
        <button class="btn-ghost" id="reviewBtn">Back to the questions</button>
    </section>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
/* =========================================================================
   STAGE CONTENT: edit here to reuse this template for other Extension lessons.
   id        unique key (used for the buckle saved in localStorage)
   title     short heading
   task      explicit instruction (HTML allowed)
   code      starter code loaded into the editor
   buckles   buckles awarded on first correct run
   hint      curated hint shown by the Hint button
   example   { label, code, output, note } shown above the editor
   check(code, output) -> true | "specific feedback string"
   ========================================================================= */
const PAGE_ID = "conditionals-extension";

const num = (code, name) => parseFloat((code.match(new RegExp("\\b" + name + "\\s*=\\s*(-?[\\d.]+)")) || [])[1]);
const str = (code, name) => (code.match(new RegExp("\\b" + name + "\\s*=\\s*\"([^\"]*)\"")) || [])[1];
const lines = out => out.trim().split("\n").map(x => x.trim()).filter(Boolean);
const hasIfElse = code => /^\s*if\b.*:\s*$/m.test(code) && /^\s*else\s*:\s*$/m.test(code);

const STAGES = [
  {
    id:"from-scratch",
    title:"Write it from scratch",
    task:'Write a complete <code>if</code> / <code>else</code> with no help. If <code>steps</code> is 10000 or more, print <code>Goal reached!</code>. Otherwise, print <code>Keep walking</code>.',
    code:'steps = 12000\n# write a complete if / else below\n',
    buckles:1,
    hint:'Start with: if steps >= 10000:  Then indent the print on the next line. Do the same for else.',
    example:{ label:"Remember the shape", code:'if condition:\n    do this\nelse:\n    do something else', note:'Condition, colon, indent. Then else, colon, indent.' },
    check(code, out){
      if(!hasIfElse(code)) return "You need an if line and an else line, each ending with a colon.";
      if(!/>=\s*10000/.test(code)) return "10000 or more means you need >= 10000.";
      const s = num(code, "steps");
      const exp = s >= 10000 ? "Goal reached!" : "Keep walking";
      if(lines(out).join("\n") !== exp) return "With steps = " + s + ", it should print " + exp + " and nothing else.";
      return true;
    }
  },
  {
    id:"not-equal",
    title:"Use not equal to",
    task:'Use <code>!=</code> to check the PIN. If <code>pin</code> is not equal to <code>"1234"</code>, print <code>Access denied</code>. Otherwise, print <code>Welcome</code>.',
    code:'pin = "0000"\n# if pin is not equal to "1234", print Access denied\n# otherwise, print Welcome\n',
    buckles:1,
    hint:'The condition is pin != "1234". Keep the quote marks, because the PIN is stored as text.',
    example:{ code:'colour = "red"\nif colour != "blue":\n    print("Not blue")\nelse:\n    print("Blue!")', output:'Not blue', note:'!= means not equal to. It is true when the two values are different.' },
    check(code, out){
      if(!/!=/.test(code)) return "Use the != operator in your condition.";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      const p = str(code, "pin");
      const exp = p !== "1234" ? "Access denied" : "Welcome";
      if(lines(out).join("\n") !== exp) return "With pin = \"" + p + "\", it should print " + exp + ".";
      return true;
    }
  },
  {
    id:"boundary",
    title:"Include the boundary",
    task:'The player is out when <code>lives</code> is 0 or less. Use <code>&lt;=</code> so it prints <code>Game over</code> when lives is 0 or less, and <code>Keep playing</code> otherwise.',
    code:'lives = 0\n# Game over when lives is 0 or less\n# otherwise, Keep playing\n',
    buckles:1,
    hint:'"0 or less" includes 0 itself, so use lives <= 0.',
    example:{ code:'stock = 5\nif stock <= 5:\n    print("Order more")\nelse:\n    print("Plenty left")', output:'Order more', note:'<= is true when the value is less than the number, or exactly equal to it.' },
    check(code, out){
      if(!/<=\s*0/.test(code)) return "Use <= 0 so that 0 lives counts as game over.";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      const l = num(code, "lives");
      const exp = l <= 0 ? "Game over" : "Keep playing";
      if(lines(out).join("\n") !== exp) return "With lives = " + l + ", it should print " + exp + ".";
      return true;
    }
  },
  {
    id:"two-variables",
    title:"Compare two variables",
    task:'A condition can compare two variables. If <code>score</code> is greater than <code>high_score</code>, print <code>New high score!</code>. Otherwise, print <code>Try again</code>.',
    code:'score = 85\nhigh_score = 70\n# compare score with high_score\n',
    buckles:1,
    hint:'Put both variable names in the condition: if score > high_score:',
    example:{ code:'my_age = 12\nfriend_age = 13\nif my_age < friend_age:\n    print("I am younger")\nelse:\n    print("I am not younger")', output:'I am younger', note:'Python swaps each name for its value, then compares: 12 < 13 is true.' },
    check(code, out){
      if(!/if\s+(score\s*>\s*high_score|high_score\s*<\s*score)\s*:/.test(code)) return "Compare the two variables directly: if score > high_score:";
      if(!hasIfElse(code)) return "You need an else line for the other path.";
      const exp = num(code, "score") > num(code, "high_score") ? "New high score!" : "Try again";
      if(lines(out).join("\n") !== exp) return "It should print " + exp + ".";
      return true;
    }
  },
  {
    id:"update-then-decide",
    title:"Update, then decide",
    task:'You have 8 coins and earn 5 more. Add a line that increases <code>coins</code> by 5. Then, if coins is 10 or more, print <code>You can buy the hat</code>. Otherwise, print <code>Keep saving</code>.',
    code:'coins = 8\n# add 5 to coins\n# then decide: 10 or more coins buys the hat\n',
    buckles:1,
    hint:'Update first: coins = coins + 5. Then write the if / else underneath, using >= 10.',
    example:{ code:'points = 4\npoints = points + 3\nif points > 6:\n    print("Level up")\nelse:\n    print("Keep going")', output:'Level up', note:'The if line uses whatever value points holds when Python reaches it: 7, not 4.' },
    check(code, out){
      if(!/coins\s*=\s*coins\s*\+\s*5/.test(code)) return "Add a line that updates coins: coins = coins + 5.";
      if(!/>=\s*10/.test(code)) return "10 or more means >= 10.";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      if(lines(out).join("\n") !== "You can buy the hat") return "8 + 5 is 13, so it should print You can buy the hat.";
      return true;
    }
  },
  {
    id:"calculate-then-decide",
    title:"Calculate, then decide",
    task:'Make a variable called <code>total</code> by multiplying <code>price</code> by <code>quantity</code>. If the total is more than 20, print <code>Free delivery</code>. Otherwise, print <code>Delivery costs $5</code>.',
    code:'price = 6\nquantity = 4\n# work out total, then decide about delivery\n',
    buckles:1,
    hint:'First: total = price * quantity. Then: if total > 20:',
    example:{ code:'length = 3\nwidth = 4\narea = length * width\nif area > 10:\n    print("Big room")\nelse:\n    print("Small room")', output:'Big room', note:'Work out the value and store it first, then the condition can test it.' },
    check(code, out){
      if(!/total\s*=\s*(price\s*\*\s*quantity|quantity\s*\*\s*price)/.test(code)) return "Make the total first: total = price * quantity.";
      if(!/if\s+total\s*>\s*20\s*:/.test(code)) return "Test the total: if total > 20:";
      if(!hasIfElse(code)) return "You need an else line for the other path.";
      const exp = num(code, "price") * num(code, "quantity") > 20 ? "Free delivery" : "Delivery costs $5";
      if(lines(out).join("\n") !== exp) return "It should print " + exp + ".";
      return true;
    }
  },
  {
    id:"value-in-message",
    title:"Show the value in the message",
    task:'If <code>score</code> is 50 or more, print <code>You scored 72. You passed!</code>. Otherwise, print <code>You scored 72. Keep practising.</code>. Use the <code>score</code> variable in the message, not the number 72.',
    code:'score = 72\n# include the score in each message using str(score)\n',
    buckles:1,
    hint:'Join text and the number with str(): print("You scored " + str(score) + ". You passed!")',
    example:{ code:'lives = 3\nif lives > 0:\n    print("Lives left: " + str(lives))\nelse:\n    print("No lives left")', output:'Lives left: 3', note:'str() turns a number into text so it can be joined into a message with +.' },
    check(code, out){
      if(/Error/i.test(out)) return "A number must be turned into text before joining. Wrap it in str(score).";
      if(!/str\s*\(\s*score\s*\)/.test(code)) return "Use str(score) in your messages, so they change if the score changes.";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      const s = num(code, "score");
      const o = lines(out).join(" ");
      if(!o.includes(String(s))) return "The message should include the score.";
      if(s >= 50 ? !/passed/i.test(o) : !/practis|practic/i.test(o)) return "With score = " + s + ", the " + (s >= 50 ? "You passed!" : "Keep practising.") + " message should print.";
      return true;
    }
  },
  {
    id:"even-odd",
    title:"Even or odd?",
    task:'The <code>%</code> sign gives the remainder after dividing. Print <code>Even</code> if <code>number</code> divides evenly by 2. Otherwise, print <code>Odd</code>.',
    code:'number = 7\n# use % to check the remainder when number is divided by 2\n',
    buckles:1,
    hint:'A number is even when its remainder after dividing by 2 is 0: if number % 2 == 0:',
    example:{ label:"New idea", code:'print(7 % 3)\nprint(10 % 2)', output:'1\n0', note:'7 divided by 3 is 2, remainder 1. So 7 % 3 gives 1. Any even number % 2 gives 0.' },
    check(code, out){
      if(!/%\s*2/.test(code)) return "Use % 2 to find the remainder when dividing by 2.";
      if(!/==\s*0|!=\s*0/.test(code)) return "Compare the remainder with 0, for example: if number % 2 == 0:";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      const n = num(code, "number");
      const exp = n % 2 === 0 ? "Even" : "Odd";
      if(lines(out).join("\n") !== exp) return "With number = " + n + ", it should print " + exp + ".";
      return true;
    }
  },
  {
    id:"and-range",
    title:"Check a range with and",
    task:'A teen ticket is for ages 13 to 17. Use <code>and</code> to check both ends. If <code>age</code> is at least 13 <strong>and</strong> at most 17, print <code>Teen ticket</code>. Otherwise, print <code>Other ticket</code>.',
    code:'age = 15\n# check both ends of the range using and\n',
    buckles:1,
    hint:'Join two conditions: if age >= 13 and age <= 17:',
    example:{ label:"New idea", code:'temp = 22\nif temp >= 18 and temp <= 26:\n    print("Comfortable")\nelse:\n    print("Too hot or too cold")', output:'Comfortable', note:'and means both conditions must be true for the whole condition to be true.' },
    check(code, out){
      if(!/\band\b/.test(code)) return "Use and to join the two conditions.";
      if(!/>=\s*13/.test(code) || !/<=\s*17/.test(code)) return "Check both ends: age >= 13 and age <= 17.";
      if(!hasIfElse(code)) return "You need both an if line and an else line.";
      const a = num(code, "age");
      const exp = (a >= 13 && a <= 17) ? "Teen ticket" : "Other ticket";
      if(lines(out).join("\n") !== exp) return "With age = " + a + ", it should print " + exp + ".";
      return true;
    }
  },
  {
    id:"elif",
    title:"The big one: three paths with elif",
    task:'Some decisions have more than two paths. Use <code>if</code>, <code>elif</code> and <code>else</code> to print <code>Hot</code> when <code>temp</code> is above 30, <code>Warm</code> when it is above 15, and <code>Cold</code> otherwise. <strong>Careful:</strong> the order of your conditions matters.',
    code:'temp = 22\n# Hot above 30, Warm above 15, otherwise Cold\n',
    buckles:3,
    hint:'Check the biggest value first: if temp > 30:, then elif temp > 15:, then else:. Each line ends with a colon.',
    example:{ label:"New idea", code:'score = 65\nif score >= 80:\n    print("Gold")\nelif score >= 50:\n    print("Silver")\nelse:\n    print("Bronze")', output:'Silver', note:'elif means else if. Python checks each condition from the top and runs only the first one that is true.' },
    check(code, out){
      if(!/^\s*elif\b.*:\s*$/m.test(code)) return "Add an elif line between the if and the else, ending with a colon.";
      if(!hasIfElse(code)) return "You need an if line at the top and an else line at the bottom.";
      const t = num(code, "temp");
      const exp = t > 30 ? "Hot" : t > 15 ? "Warm" : "Cold";
      const o = lines(out).join("\n");
      const i30 = code.search(/>\s*30/), i15 = code.search(/>\s*15/);
      if(i30 < 0 || i15 < 0) return "Use temp > 30 and temp > 15 in your conditions.";
      if(i15 < i30) return "Check your order: test temp > 30 first, then temp > 15.";
      if(o !== exp) return "With temp = " + t + ", it should print " + exp + " and nothing else.";
      return true;
    }
  }
];


function exampleHTML(ex){
  if(!ex) return "";
  const label = ex.label || "New idea";
  const out = (ex.output != null) ? '<div class="ex-out"><div class="mlbl">Output</div><pre>' + escapeHtml(ex.output) + '</pre></div>' : '';
  const note = ex.note ? '<div class="ex-note">' + escapeHtml(ex.note) + '</div>' : '';
  return '<div class="example' + (ex.output == null ? ' noout' : '') + '"><div class="ex-code"><div class="mlbl">' + label + '</div><pre>' + escapeHtml(ex.code) + '</pre></div>' + out + note + '</div>';
}

/* ========================== Buckles (localStorage) ======================= */
const Buckles = {
  key:"buckles-shared",
  posKey:"pos-" + PAGE_ID,
  ns(id){ return PAGE_ID + ":" + id; },
  load(){ try{ return JSON.parse(localStorage.getItem(this.key)) || {}; }catch(e){ return {}; } },
  save(d){ try{ localStorage.setItem(this.key, JSON.stringify(d)); }catch(e){} },
  isDone(id){ return !!this.load()[this.ns(id)]; },
  award(id, n){ const d=this.load(); const k=this.ns(id); if(!d[k]){ d[k]=n; this.save(d);} },
  total(){ return Object.values(this.load()).reduce((a,b)=>a+b,0); },
  setPos(i){ try{ localStorage.setItem(this.posKey, String(i)); }catch(e){} },
  getPos(){ try{ const v=parseInt(localStorage.getItem(this.posKey),10); return isNaN(v)?0:v; }catch(e){ return 0; } }
};

/* ============================== App state =============================== */
let editor, current = 0;
const $ = id => document.getElementById(id);

function buildProgress(){
  const p = $("progress"); p.innerHTML = "";
  STAGES.forEach((s,i)=>{
    const seg = document.createElement("button");
    seg.className = "seg" + (Buckles.isDone(s.id) ? " done" : "") + (i===current ? " current" : "");
    seg.title = "Stage " + (i+1);
    seg.addEventListener("click", ()=>loadStage(i));
    p.appendChild(seg);
  });
}

function refreshCount(){
  $("buckleCount").textContent = Buckles.total();
  $("doneTotal").textContent = Buckles.total();
}

function setTerminal(html){ $("terminal").innerHTML = html; }
function hideMsgs(){ $("hintMsg").className="msg curated-hint"; $("resultMsg").className="msg result"; }

function loadStage(i){
  $("doneCard").classList.remove("show");
  $("stageCard").style.display = "";
  current = i;
  Buckles.setPos(i);
  const s = STAGES[i];
  $("stageOf").textContent = (i+1) + " of " + STAGES.length;
  $("stageTitle").textContent = s.title;
  $("stageTask").innerHTML = s.task;
  $("stageExample").innerHTML = exampleHTML(s.example);
  setTerminal('<span class="ready">Press Run to see the output</span>');
  hideMsgs();
  if(Buckles.isDone(s.id)){
    $("resultMsg").innerHTML = "<b>Done.</b> You have already earned this buckle. You can run it again any time.";
    $("resultMsg").className = "msg result ok show";
  }
  $("backBtn").disabled = (i === 0);
  $("nextBtn").textContent = (i === STAGES.length-1) ? "Finish" : "Next";
  $("nextBtn").classList.toggle("ready", Buckles.isDone(s.id));
  editor.setValue(s.code);
  editor.refresh();
  buildProgress();
  setTimeout(()=>editor.focus(), 60);
}

/* ======================= Award popup + confetti ========================= */
function celebrate(n){
  const a = $("award");
  $("awardText").textContent = "+" + n + " Buckle" + (n>1?"s":"") + "!";
  a.classList.remove("hide");
  a.classList.add("show");
  burstConfetti();
  setTimeout(()=>{
    a.classList.remove("show");
    a.classList.add("hide");
    setTimeout(()=> a.classList.remove("hide"), 360);
  }, 1100);
}

function burstConfetti(){
  const canvas = document.createElement("canvas");
  canvas.className = "confetti-canvas";
  document.body.appendChild(canvas);
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  ctx.scale(dpr, dpr);
  const colors = ["#ea008a","#1b1f45","#f7a8d4","#c3c6d0"];
  const cx = innerWidth/2, cy = innerHeight/2;
  const parts = [];
  for(let i=0;i<150;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 4 + Math.random()*10;
    parts.push({
      x:cx, y:cy,
      vx:Math.cos(angle)*speed,
      vy:Math.sin(angle)*speed - 4,
      size:5 + Math.random()*7,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*Math.PI, vrot:(Math.random()-.5)*.3, life:0
    });
  }
  const gravity = 0.22, drag = 0.992;
  let frame = 0;
  (function tick(){
    frame++;
    ctx.clearRect(0,0,innerWidth,innerHeight);
    parts.forEach(p=>{
      p.vx *= drag; p.vy = p.vy*drag + gravity;
      p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, 1 - p.life/95);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    if(frame < 95) requestAnimationFrame(tick);
    else canvas.remove();
  })();
}

/* =============================== Run code =============================== */
let outputBuffer = "";
function runCode(){
  const code = editor.getValue();
  const runBtn = $("runBtn");
  outputBuffer = "";
  runBtn.disabled = true; runBtn.textContent = "Running";
  setTerminal('<span class="ready">Running</span>');

  Sk.configure({
    output: t => { outputBuffer += t; },
    read: x => {
      if(Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
        throw "File not found: '" + x + "'";
      return Sk.builtinFiles["files"][x];
    },
    __future__: Sk.python3,
    execLimit: 5000
  });

  Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => {
      setTerminal('<span class="out">' + (outputBuffer ? escapeHtml(outputBuffer) : "(no output)") + '</span>');
      finishRun(code, outputBuffer);
    })
    .catch(err => {
      let msg = err.toString().replace(/Sk\.builtin\./g, "").replace(/ on line \d+/g, "");
      setTerminal('<span class="err">' + escapeHtml(msg) + '</span>');
      finishRun(code, "Error: " + msg);
    })
    .finally(() => { runBtn.disabled = false; runBtn.textContent = "Run"; });
}

function finishRun(code, out){
  const result = STAGES[current].check(code, out);
  if(result === true){
    $("resultMsg").innerHTML = "<b>Correct.</b> Well done.";
    $("nextBtn").classList.add("ready");
    $("resultMsg").className = "msg result ok show";
    const s = STAGES[current];
    if(!Buckles.isDone(s.id)){
      Buckles.award(s.id, s.buckles);
      refreshCount();
      buildProgress();
      celebrate(s.buckles);
    }
  } else if(typeof result === "string"){
    $("resultMsg").innerHTML = "<b>Not quite.</b> " + escapeHtml(result);
    $("resultMsg").className = "msg result no show";
  }
}

function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* =============================== Wiring ================================= */
function goNext(){
  if(current < STAGES.length - 1){
    loadStage(current + 1);
  } else {
    $("stageCard").style.display = "none";
    $("doneCard").classList.add("show");
    Buckles.setPos(STAGES.length); // remember they reached the end
    buildProgress();
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

function init(){
  editor = CodeMirror.fromTextArea($("editor"), {
    mode:"python", lineNumbers:true, indentUnit:4, indentWithTabs:false,
    lineWrapping:true, autoCloseBrackets:true, matchBrackets:true,
    extraKeys:{
      "Ctrl-Enter": runCode, "Cmd-Enter": runCode,
      "Tab": cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ","end")
    }
  });

  $("runBtn").addEventListener("click", runCode);
  $("nextBtn").addEventListener("click", goNext);
  $("backBtn").addEventListener("click", ()=>{ if(current>0){ loadStage(current-1); window.scrollTo({top:0,behavior:"smooth"}); } });
  $("hintBtn").addEventListener("click", ()=>{
    const h = $("hintMsg");
    if(h.classList.contains("show")){ h.classList.remove("show"); }
    else { h.innerHTML = '<div class="mlbl">Hint</div>' + escapeHtml(STAGES[current].hint); h.classList.add("show"); }
  });
  $("reviewBtn").addEventListener("click", ()=> loadStage(STAGES.length - 1));

  refreshCount();
  const pos = Buckles.getPos();
  if(pos >= STAGES.length){
    $("stageCard").style.display = "none";
    $("doneCard").classList.add("show");
    buildProgress();
  } else {
    loadStage(pos);
  }
}

(function ready(){
  if(typeof CodeMirror === "undefined" || typeof Sk === "undefined") return setTimeout(ready, 80);
  init();
})();
</script>
