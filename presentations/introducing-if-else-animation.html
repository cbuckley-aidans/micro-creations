<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introducing if / else</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --white: #ffffff;
        --off-white: #f5f5f5;
        --light-grey: #e8e8e8;
        --mid-grey: #9a9a9a;
        --blank: #f0f3f6;
        --mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    [class], .fc text { font-variant-ligatures: none; }
    html, body { height: 100%; }
    body {
        font-family: 'Barlow', Helvetica Neue, Helvetica, Arial, sans-serif;
        margin: 0; background: #eaeaea; color: var(--navy);
        display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    }
    .viewport { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .stage {
        width: 1280px; height: 720px; background: var(--white); border-top: 6px solid var(--navy);
        position: relative; padding: 0; transform-origin: center center; flex-shrink: 0; overflow: hidden;
    }
    .ui-zoomer { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; padding: 36px 64px 0 64px; transform-origin: 0 0; }
    .ui-spot { position: absolute; left: 0; top: 0; width: 1280px; height: 714px; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .35s var(--ease); }
    .ui-spot.on { opacity: 1; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; color: var(--mid-grey); }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 130px; bottom: 110px; }
    .caption {
        position: absolute; left: 64px; right: 64px; bottom: 30px;
        font-size: 27px; font-weight: 500; line-height: 1.35;
        display: flex; align-items: center; gap: 16px; min-height: 60px;
    }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption b { font-weight: 800; color: var(--pink); }
    .caption.in { animation: capIn .45s var(--ease); }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; }

    .hide { opacity: 0; transform: translateY(14px); }
    .rev { transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .35s, color .35s, border-color .35s; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .fact { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 40px; }
    .hrow { display: flex; align-items: center; gap: 48px; }
    .vcol { display: flex; flex-direction: column; align-items: center; gap: 18px; }

    /* bulb */
    .bulb { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .bulb svg { display: block; width: 100%; height: auto; overflow: visible; transition: filter .2s; }
    .bulb .glass { fill: #fff; stroke: var(--navy); stroke-width: 5; stroke-linejoin: round; transition: fill .12s, stroke .12s; }
    .bulb .fil { fill: none; stroke: var(--navy); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; transition: stroke .12s; }
    .bulb .base { fill: var(--navy); }
    .bulb .rays line { stroke: var(--pink); stroke-width: 6; stroke-linecap: round; opacity: 0; transition: opacity .12s; }
    .bulb.on .glass { fill: var(--pink); stroke: var(--pink); }
    .bulb.on .fil { stroke: #fff; }
    .bulb.on .rays line { opacity: 1; }
    .bulb.on svg { filter: drop-shadow(0 0 22px rgba(234,0,138,.35)); }
    .state { font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: #c3c6d0; }
    .state span { color: #c3c6d0; transition: color .15s; }
    .state .lit { color: var(--navy); }
    .state .s1.lit { color: var(--pink); }

    /* sky */
    .sky { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .sky svg { display: block; width: 100%; height: auto; }
    .sky .skbg { fill: var(--blank); stroke: var(--navy); stroke-width: 5; transition: fill .4s; }
    .sky.dark .skbg { fill: var(--navy); }
    .sky .sun circle { fill: #fff; stroke: var(--navy); stroke-width: 5; }
    .sky .sun line { stroke: var(--navy); stroke-width: 5; stroke-linecap: round; }
    .sky .sun, .sky .moon { transition: opacity .4s; }
    .sky .moon { opacity: 0; }
    .sky.dark .sun { opacity: 0; }
    .sky.dark .moon { opacity: 1; }
    .sky .mf, .sky .star { fill: #fff; }
    .sky .mc { fill: var(--navy); }
    .qlbl { font-size: 34px; font-weight: 700; }

    /* chips */
    .chip { display: inline-flex; align-items: center; justify-content: center; min-width: 130px; height: 50px; padding: 0 20px; border: 3px solid #c3c6d0; border-radius: 8px;
        font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #c3c6d0; background: #fff;
        transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .2s, color .2s, border-color .2s; }
    .chip.t { background: var(--pink); border-color: var(--pink); color: #fff; }
    .chip.f { background: var(--navy); border-color: var(--navy); color: #fff; }
    .chip.x { border-color: var(--mid-grey); color: var(--mid-grey); }

    /* sequence track */
    .trk { display: block; overflow: visible; }
    .trk text { font-family: 'Barlow Condensed', sans-serif; }
    .trk .rl { font-size: 22px; font-weight: 800; letter-spacing: .14em; fill: var(--mid-grey); }
    .trk .nd rect, .trk .nd polygon { fill: #fff; stroke: var(--navy); stroke-width: 4; stroke-linejoin: round; transition: fill .25s, stroke .25s; }
    .trk .nd text { font-size: 32px; font-weight: 900; fill: var(--navy); text-anchor: middle; dominant-baseline: central; transition: fill .25s; }
    .trk .nd.on rect, .trk .nd.on polygon { fill: var(--pink); stroke: var(--pink); }
    .trk .nd.on text { fill: #fff; }
    .trk .seg line, .trk .seg path { stroke: var(--navy); stroke-width: 4; fill: none; transition: stroke .25s; }
    .trk .seg polygon { fill: var(--navy); transition: fill .25s; }
    .trk .seg.on line, .trk .seg.on path { stroke: var(--pink); }
    .trk .seg.on polygon { fill: var(--pink); }
    .trk .bra { transition: opacity .45s var(--ease); }
    .trk .bra.dim { opacity: .22; }

    /* flowchart */
    .fc { display: block; overflow: visible; }
    .fc .hide { transform: none; }
    .fc text { font-family: 'Barlow', Helvetica, Arial, sans-serif; }
    .fc .dia { fill: #fff; stroke: var(--pink); stroke-width: 4; stroke-linejoin: round; transition: fill .3s; }
    .fc .qg.on .dia { fill: #fde3f2; }
    .fc .qt { font-size: 26px; font-weight: 700; fill: var(--navy); text-anchor: middle; dominant-baseline: central; }
    .fc .qt.mono { font-family: var(--mono); font-variant-ligatures: none; font-size: 25px; }
    .fc .base { stroke: var(--navy); stroke-width: 3.5; fill: none; }
    .fc .ov { stroke: var(--pink); stroke-width: 5; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .5s var(--ease); }
    .fc .ah { fill: var(--navy); transition: fill .2s .45s; }
    .fc .bx { fill: var(--navy); transition: fill .25s .45s; }
    .fc .bt { font-size: 24px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .fc .yn { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 900; letter-spacing: .08em; fill: var(--pink); }
    .fc .br.on .ov { stroke-dashoffset: 0; }
    .fc .br.on .ah, .fc .br.on .bx { fill: var(--pink); }
    .fc .br.off { opacity: .28; }
    .fc .tag rect { fill: var(--blank); stroke: #c9ccd6; stroke-width: 2; }
    .fc .tag text { font-size: 20px; font-weight: 700; fill: var(--navy); text-anchor: middle; dominant-baseline: central; }
    .fc .tag line { stroke: var(--navy); stroke-width: 3; }
    .fc .tag polygon { fill: var(--navy); }

    /* condition cards */
    .cards { display: flex; gap: 32px; }
    .ccard { width: 340px; border: 3px solid var(--navy); border-radius: 8px; padding: 22px 26px 26px; }
    .ccard .cq { font-size: 32px; font-weight: 700; line-height: 1.2; min-height: 80px; margin: 6px 0 18px; }
    .ccard .ca { font-size: 24px; font-weight: 600; margin: 4px 0 22px; }
    .ccard .chip { font-size: 24px; padding: 0 16px; white-space: nowrap; }

    /* problem */
    .prob { font-size: 46px; font-weight: 500; line-height: 2.3; max-width: 1000px; border-left: 8px solid var(--navy); padding-left: 36px; }
    .mark { position: relative; white-space: nowrap; font-weight: 500; transition: opacity .45s var(--ease), transform .45s var(--ease), box-shadow .35s, color .35s; }
    .mark::after { content: attr(data-tag); position: absolute; left: 0; top: 100%; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800;
        letter-spacing: .14em; text-transform: uppercase; line-height: 1; white-space: nowrap; opacity: 0; transition: opacity .35s; }
    .mark.on::after { opacity: 1; }
    .mark.mc.on { color: var(--pink); box-shadow: inset 0 -0.18em 0 rgba(234,0,138,.22); }
    .mark.mt.on, .mark.mf.on { box-shadow: inset 0 -0.18em 0 rgba(27,31,69,.16); }
    .mark.mc::after { color: var(--pink); }
    .mark.mt::after, .mark.mf::after { color: var(--navy); }

    /* step 1 */
    .s7 { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px; height: 100%; }
    .qbig { font-size: 40px; font-weight: 700; }
    .cbox { font-family: var(--mono); font-variant-ligatures: none; font-size: 46px; font-weight: 700; border: 3px solid var(--navy); border-radius: 8px; padding: 8px 28px; }
    .op { color: var(--pink); }
    .meaning { font-size: 30px; font-weight: 600; }
    .meaning .op { font-family: var(--mono); font-variant-ligatures: none; font-weight: 700; margin-right: 14px; }
    .tester { display: flex; align-items: center; gap: 18px; }
    .rbox { border: 3px solid var(--navy); border-radius: 8px; padding: 10px 30px; text-align: center; }
    .rbox .lbl { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid-grey); }
    .rbox .num { font-family: var(--mono); font-variant-ligatures: none; font-size: 52px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .tres { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-left: 50px; }
    .tres .dlbl { font-family: var(--mono); font-variant-ligatures: none; letter-spacing: 0; text-transform: none; font-size: 22px; font-weight: 700; }
    .sbtn { width: 56px; height: 56px; border: none; border-radius: 8px; background: var(--navy); color: #fff; cursor: pointer;
        font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 800; line-height: 1; padding: 0; }
    .sbtn:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

    /* code panels */
    .cpanel { border: 3px solid var(--navy); border-radius: 8px; background: #fff; width: 100%; }
    .phead { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey);
        padding: 10px 22px; border-bottom: 2px solid var(--light-grey); }
    .cbody { padding: 14px 0; }
    .cl { position: relative; white-space: pre; font-family: var(--mono); font-variant-ligatures: none; font-size: 26px; font-weight: 500; line-height: 46px; height: 46px; padding: 0 22px 0 16px;
        border-left: 6px solid transparent; transition: opacity .45s var(--ease), transform .45s var(--ease), background-color .25s, border-color .25s; }
    .cl .gn { display: inline-block; width: 38px; color: #c3c6d0; font-weight: 500; }
    .cl.act { background: rgba(234,0,138,.10); border-left-color: var(--pink); }
    .cl.skip { opacity: .28; }
    .kw { color: var(--pink); font-weight: 700; }
    .st { color: #5b6192; }
    .nm { font-weight: 700; }
    .ph { color: var(--mid-grey); font-style: italic; }
    .cpanel.lg .cl { font-size: 36px; line-height: 66px; height: 66px; padding-right: 36px; }
    .cpanel.lg .gn { width: 50px; }
    .colon, .ind { border-radius: 4px; transition: background-color .3s, color .3s; }
    .colon.on { background: var(--pink); color: #fff; }
    .ind { display: inline-block; }
    .ind.on { background: rgba(234,0,138,.16); box-shadow: inset 4px 0 0 var(--pink); }
    .ctag { position: absolute; left: calc(100% + 30px); top: 0; height: 100%; display: flex; align-items: center; gap: 14px; white-space: nowrap;
        font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); }
    .ctag::before { content: ''; width: 30px; height: 4px; background: currentColor; }
    .ctag.pk { color: var(--pink); }
    .ctag.gy { color: var(--mid-grey); }
    .opanel { background: var(--navy); border: 3px solid var(--navy); border-radius: 8px; color: #fff; width: 100%; }
    .opanel .phead { color: #9aa0c4; border-bottom-color: rgba(255,255,255,.14); }
    .obody { font-family: var(--mono); font-variant-ligatures: none; font-size: 28px; font-weight: 500; padding: 18px 22px; min-height: 120px; }
    .oline { animation: capIn .45s var(--ease); }
    .runrow { display: flex; gap: 44px; align-items: flex-start; justify-content: center; height: 100%; padding-top: 6px; }
    .runcol { display: flex; flex-direction: column; gap: 22px; }
    .ctrl { display: flex; align-items: center; gap: 12px; }
    .ctrl .dlbl { margin-right: 8px; }
    .tbox { text-align: left; width: 100%; }
    .trow { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 6px; }
    .expr { font-family: var(--mono); font-variant-ligatures: none; font-size: 38px; font-weight: 700; }

    /* summary */
    .sumgrid { display: grid; grid-template-columns: repeat(2, 540px); gap: 26px 32px; }
    .dcard { border: 3px solid var(--navy); border-radius: 8px; padding: 22px 30px; }
    .dcard.pink { border-color: var(--pink); }
    .dex { font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 900; margin: 4px 0 6px 0; line-height: 1; }
    .dhow { font-size: 24px; font-weight: 600; }
    .dcard.pink .dhow { color: var(--pink); }

    /* controls */
    .controls { position: relative; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 24px; padding: 12px 20px 16px; width: 100%; font-family: 'Barlow Condensed', sans-serif; }
    .grp { display: flex; align-items: center; gap: 8px; }
    .controls [hidden] { display: none !important; }
    .controls button {
        font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; line-height: 1.2;
        display: inline-flex; align-items: center; gap: 8px; background: var(--white); color: var(--navy); border: none; border-radius: 6px; padding: 9px 13px; cursor: pointer;
    }
    .controls button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .controls button.on { background: var(--pink); color: var(--white); }
    .controls button.ui-pri { background: var(--navy); color: var(--white); }
    .controls button.ui-fs { background: var(--pink); color: var(--white); }
    .controls button.ui-fs.ui-isfs { background: var(--white); color: var(--navy); }
    .controls button.ui-fs.ui-nudge { animation: nudge 1.6s ease-out 1s 4; }
    @keyframes nudge { 0% { box-shadow: 0 0 0 0 rgba(234,0,138,.55); } 70%, 100% { box-shadow: 0 0 0 14px rgba(234,0,138,0); } }
    .controls svg.ui-ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .controls svg.ui-chev { width: 13px; height: 13px; stroke-width: 3; opacity: .6; transition: transform .2s var(--ease); }
    .ui-menu.ui-open > .ui-mt svg.ui-chev { transform: rotate(180deg); }
    .ui-mt .ui-pdot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 0 2px var(--white); }
    .controls .dots { display: flex; gap: 8px; margin: 0 8px 0 12px; }
    .controls .dots button { width: 14px; height: 14px; padding: 0; border-radius: 50%; background: #c9ccd6; }
    .controls .dots button.cur { background: var(--pink); }
    .steplbl { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); margin-left: 6px; min-width: 110px; }
    .controls kbd { margin-left: 2px; }

    /* menus */
    .ui-menu { position: relative; }
    .ui-pop { display: none; position: absolute; left: 0; bottom: calc(100% + 10px); min-width: 260px; flex-direction: column; gap: 2px; padding: 4px 8px 8px;
        background: var(--white); border-top: 6px solid var(--navy); border-radius: 10px; box-shadow: 0 10px 30px rgba(27,31,69,.25), 0 0 0 1px rgba(27,31,69,.08); }
    .ui-menu.ui-r .ui-pop { left: auto; right: 0; }
    .ui-menu.ui-open .ui-pop { display: flex; animation: popIn .18s var(--ease); }
    @keyframes popIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .ui-ph { font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); padding: 10px 10px 6px; }
    .ui-pop .ui-mi { width: 100%; padding: 9px 10px; background: transparent; white-space: nowrap; }
    .ui-pop .ui-mi:hover { background: var(--off-white); }
    .ui-pop .ui-mi kbd { margin-left: auto; padding-left: 5px; }
    .ui-pop .ui-mi .ui-ind { width: 14px; height: 14px; border: 2.5px solid var(--navy); border-radius: 3px; flex-shrink: 0; margin-right: 4px; }
    .ui-pop .ui-mi .ui-ind.ui-no { border-color: transparent; }
    .ui-pop .ui-mi.on { background: transparent; color: var(--pink); }
    .ui-pop .ui-mi.on:hover { background: var(--off-white); }
    .ui-pop .ui-mi.on .ui-ind { background: var(--pink); border-color: var(--pink); }
    .ui-pop .ui-mi:disabled { opacity: .35; cursor: default; background: transparent; }
    .ui-pop .ui-mi.ui-eng .ui-ind { border: none; border-radius: 50%; }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-pk { background: var(--pink); }
    .ui-pop .ui-mi.ui-eng .ui-ind.ui-nv { background: var(--navy); }
    .ui-pop .ui-swrow { display: flex; gap: 8px; padding: 4px 10px 10px 38px; }
    .ui-pop .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 3px solid var(--white); box-shadow: 0 0 0 1px #c9ccd6; }
    .ui-pop .swatch.cur { box-shadow: 0 0 0 3px var(--navy); }
    .ui-pop .ui-div { height: 1.5px; background: var(--light-grey); margin: 4px 6px; }



    /* highlighter and whiteboard surfaces */
    .ui-hlc { position: absolute; inset: 0; width: 1280px; height: 720px; pointer-events: none; z-index: 4; mix-blend-mode: multiply; }
    .ui-wboard { display: none; position: absolute; left: 0; top: 0; width: 1280px; height: 714px; background: var(--white); z-index: 3; }
    body.ui-wb .ui-wboard { display: block; }
    .ui-wbl { position: absolute; right: 64px; top: 40px; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid-grey); }
    .ui-wbl b { color: var(--navy); }
    .ui-wbg { display: none; }
    body.ui-wb .ui-wbg { display: flex; }
    body.ui-wb .grp.ui-nav { display: none; }
    .ui-wbtag { font-size: 18px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--white); background: var(--pink); border-radius: 6px; padding: 9px 13px; line-height: 1.2; }
    .controls button:disabled { opacity: .35; cursor: default; }
    #ovbtn { padding: 9px 11px; }

    /* overlays */
    .ui-ovw[hidden], .ui-keys[hidden], .ui-blk[hidden] { display: none !important; }
    .ui-ovw { position: fixed; inset: 0; z-index: 45; background: rgba(27,31,69,.96); overflow-y: auto; padding: 40px 48px 60px; opacity: 0; transition: opacity .2s; }
    .ui-ovw.on, .ui-keys.on, .ui-blk.on { opacity: 1; }
    .ui-ovh { display: flex; justify-content: space-between; align-items: flex-end; max-width: 1296px; margin: 0 auto 28px; padding-bottom: 12px; border-bottom: 4px solid var(--white); color: var(--white); }
    .ui-ovh h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 900; text-transform: uppercase; line-height: 1; }
    .ui-ovh h2 span { color: var(--pink); }

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), caption = $('#caption'), titleEl = $('#title'), counter = $('#counter'), progress = $('#progress');
let timers = [], events = [], beats = [], idx = 0, beat = 0, autoplay = false;
let segFrom = 0, segTo = 0, segStart = 0;
let ptimers = [], cleanups = [];
const stage = document.getElementById('stage');

function at(ms, fn) { events.push({ t: ms, fn, done: false }); }
function beatAt(ms, html) { beats.push(ms); at(ms, () => say(html)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function show(e) { e.classList.remove('hide'); }
function say(html) { caption.innerHTML = '<span>' + html + '</span>'; caption.classList.remove('in'); void caption.offsetWidth; caption.classList.add('in'); }
function stopInteractive() { ptimers.forEach(clearTimeout); ptimers = []; cleanups.forEach(f => f()); cleanups = []; }

/* ---------- light bulb ---------- */
function bulb(w, cls = '') {
    const b = el('div', 'bulb' + (cls ? ' ' + cls : ''));
    const rays = [-180, -150, -120, -90, -60, -30, 0].map(a => {
        const r = a * Math.PI / 180;
        return `<line x1="${(80 + Math.cos(r) * 60).toFixed(1)}" y1="${(78 + Math.sin(r) * 60).toFixed(1)}" x2="${(80 + Math.cos(r) * 76).toFixed(1)}" y2="${(78 + Math.sin(r) * 76).toFixed(1)}"/>`;
    }).join('');
    b.innerHTML = `<svg viewBox="0 0 160 200" aria-hidden="true"><g class="rays">${rays}</g>
        <path class="glass" d="M80 30 C53 30 32 51 32 78 C32 96 42 107 51 118 C57 125 59 131 59 140 L101 140 C101 131 103 125 109 118 C118 107 128 96 128 78 C128 51 107 30 80 30 Z"/>
        <path class="fil" d="M68 140 L68 104 Q74 90 80 104 Q86 90 92 104 L92 140"/>
        <rect class="base" x="58" y="146" width="44" height="10" rx="3"/>
        <rect class="base" x="60" y="160" width="40" height="10" rx="3"/>
        <rect class="base" x="67" y="174" width="26" height="9" rx="4.5"/></svg>`;
    b.style.width = w + 'px';
    b.on = false;
    b.set = v => { b.on = v; b.classList.toggle('on', v); if (b.cb) b.cb(v); };
    b.onclick = () => b.set(!b.on);
    return b;
}

/* ---------- sky (day / night) ---------- */
function sky(w, cls = '') {
    const s = el('div', 'sky' + (cls ? ' ' + cls : ''));
    const rays = [0, 45, 90, 135, 180, 225, 270, 315].map(a => {
        const r = a * Math.PI / 180;
        return `<line x1="${(100 + Math.cos(r) * 46).toFixed(1)}" y1="${(100 + Math.sin(r) * 46).toFixed(1)}" x2="${(100 + Math.cos(r) * 62).toFixed(1)}" y2="${(100 + Math.sin(r) * 62).toFixed(1)}"/>`;
    }).join('');
    s.innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true"><rect class="skbg" x="2.5" y="2.5" width="195" height="195" rx="10"/>
        <g class="sun">${rays}<circle cx="100" cy="100" r="30"/></g>
        <g class="moon"><circle class="mf" cx="100" cy="102" r="40"/><circle class="mc" cx="121" cy="88" r="35"/>
        <circle class="star" cx="44" cy="50" r="3.5"/><circle class="star" cx="156" cy="150" r="3.5"/><circle class="star" cx="50" cy="156" r="2.5"/><circle class="star" cx="162" cy="44" r="2.5"/></g></svg>`;
    s.style.width = w + 'px';
    s.dark = false;
    s.set = v => { s.dark = v; s.classList.toggle('dark', v); if (s.cb) s.cb(v); };
    s.onclick = () => s.set(!s.dark);
    return s;
}

/* ---------- chips ---------- */
function setChip(c, v, labels = ['True', 'False']) {
    c.classList.remove('t', 'f', 'n');
    c.classList.add(v === null ? 'n' : v ? 't' : 'f');
    c.textContent = v === null ? '?' : v ? labels[0] : labels[1];
}
function arrowSvg(w = 110) {
    return `<svg width="${w}" height="30" viewBox="0 0 ${w} 30" aria-hidden="true"><line x1="0" y1="15" x2="${w - 16}" y2="15" stroke="#1b1f45" stroke-width="4"/><polygon points="${w - 20},4 ${w},15 ${w - 20},26" fill="#1b1f45"/></svg>`;
}

/* ---------- flowchart ---------- */
function flow(q, yes, no, o = {}) {
    const L = !!o.labels, H = L ? 412 : 336, vx = L ? 0 : 60, vw = L ? 820 : 700;
    const br = (side, x, lbl, txt) => {
        const d = `M410 160 V200 H${x} V236`;
        const lx = side === 'yes' ? x - 14 : x + 14, anc = side === 'yes' ? 'end' : 'start';
        return `<g class="br ${side} rev hide"><path class="base" d="${d}"/><path class="ov" pathLength="1" d="${d}"/>
            <polygon class="ah" points="${x - 11},234 ${x + 11},234 ${x},250"/>
            <text class="yn" x="${lx}" y="226" text-anchor="${anc}">${lbl}</text>
            <rect class="bx" x="${x - 125}" y="250" width="250" height="70" rx="4"/><text class="bt" x="${x}" y="285">${txt}</text></g>`;
    };
    const tagUp = (cls, x, txt) => `<g class="tag ${cls} rev hide"><line x1="${x}" y1="370" x2="${x}" y2="338"/><polygon points="${x - 8},340 ${x + 8},340 ${x},324"/>
        <rect x="${x - 75}" y="370" width="150" height="40" rx="3"/><text x="${x}" y="390">${txt}</text></g>`;
    const tags = L ? `<g class="tag tc rev hide"><rect x="20" y="70" width="150" height="40" rx="3"/><text x="95" y="90">Condition</text>
        <line x1="170" y1="90" x2="220" y2="90"/><polygon points="219,82 219,98 234,90"/></g>${tagUp('tt', 210, 'If true')}${tagUp('tf', 610, 'If false')}` : '';
    const w = el('div', 'fcw');
    w.innerHTML = `<svg class="fc" viewBox="${vx} 0 ${vw} ${H}" width="${o.w || vw}" aria-hidden="true">
        <g class="qg rev hide"><polygon class="dia" points="410,20 585,90 410,160 235,90"/><text class="qt${o.mono ? ' mono' : ''}" x="410" y="90">${q}</text></g>
        ${br('yes', 210, 'YES', yes)}${br('no', 610, 'NO', no)}${tags}</svg>`;
    const g = s => w.querySelector(s);
    w.q = g('.qg'); w.yes = g('.br.yes'); w.no = g('.br.no');
    w.tc = g('.tc'); w.tt = g('.tt'); w.tf = g('.tf');
    w.all = [w.q, w.yes, w.no];
    w.focus = k => {
        w.q.classList.toggle('on', k === 'q');
        w.yes.classList.toggle('on', k === 'yes'); w.no.classList.toggle('on', k === 'no');
        w.yes.classList.toggle('off', k === 'no'); w.no.classList.toggle('off', k === 'yes');
    };
    w.pick = v => w.focus(v === null ? null : v ? 'yes' : 'no');
    return w;
}

/* ---------- code panel ---------- */
function codePanel(lines, head = 'Your code', cls = '') {
    const p = el('div', 'cpanel' + (cls ? ' ' + cls : ''));
    if (head) p.appendChild(el('div', 'phead', head));
    const body = el('div', 'cbody');
    p.lines = lines.map((h, i) => { const l = el('div', 'cl', `<span class="gn">${i + 1}</span>${h}`); body.appendChild(l); return l; });
    p.appendChild(body);
    p.hl = list => p.lines.forEach((l, i) => l.classList.toggle('act', list.includes(i)));
    return p;
}

/* ---------- scenes ---------- */
const scenes = [
{
    title: 'Introducing <span>if / else</span>',
    dur: 15500,
    run() {
        const c = el('div', 'center');
        const nd = (x, y, t) => `<g class="nd"><rect x="${x - 35}" y="${y - 35}" width="70" height="70" rx="6"/><text x="${x}" y="${y}">${t}</text></g>`;
        const seg = (x1, x2, y) => `<g class="seg"><line x1="${x1}" y1="${y}" x2="${x2 - 14}" y2="${y}"/><polygon points="${x2 - 16},${y - 9} ${x2 - 16},${y + 9} ${x2},${y}"/></g>`;
        const branch = (y, t) => `<g class="bra"><g class="seg"><path d="M530 310 H580 V${y} H621"/><polygon points="619,${y - 9} 619,${y + 9} 635,${y}"/></g>${nd(670, y, t)}</g>`;
        const r1 = [nd(70, 80, 1), seg(105, 235, 80), nd(270, 80, 2), seg(305, 435, 80), nd(470, 80, 3), seg(505, 635, 80), nd(670, 80, 4)].join('');
        const r2 = [nd(70, 310, 1), seg(105, 235, 310), nd(270, 310, 2), seg(305, 410, 310),
            `<g class="nd"><polygon points="470,258 530,310 470,362 410,310"/><text x="470" y="310">?</text></g>`, branch(245, 'A'), branch(375, 'B')].join('');
        const svg = el('div', '', `<svg class="trk" viewBox="0 0 740 420" width="740" height="420" aria-hidden="true">
            <g class="r1 rev hide"><text class="rl" x="35" y="20">EVERY STEP, IN ORDER</text>${r1}</g>
            <g class="r2 rev hide"><text class="rl" x="35" y="190">MAKING A DECISION</text>${r2}</g></svg>`);
        c.appendChild(svg); content.appendChild(c);
        const R1 = svg.querySelector('.r1'), R2 = svg.querySelector('.r2');
        const s1 = [...R1.querySelectorAll(':scope > g')], s2 = [...R2.querySelectorAll(':scope > g')];
        const [A, B] = s2.slice(5);
        beatAt(0, 'So far, our programs have run every step in order, one after another.');
        at(400, () => show(R1));
        s1.forEach((g, i) => at(1200 + i * 450, () => g.classList.add('on')));
        beatAt(5000, 'But sometimes a program needs to <b>make a decision</b> and choose between two paths.');
        at(5400, () => show(R2));
        s2.slice(0, 5).forEach((g, i) => at(6000 + i * 450, () => g.classList.add('on')));
        at(8500, () => { A.querySelectorAll('g').forEach(g => g.classList.add('on')); B.classList.add('dim'); });
        beatAt(11000, 'In this lesson, we will learn how a computer makes a decision by <b>testing a condition</b>.');
    }
},
{
    title: 'Everyday <span>decisions</span>',
    dur: 23000,
    run() {
        const c = el('div', 'center');
        const row = el('div', 'hrow');
        const left = el('div', 'vcol rev hide');
        const s = sky(240);
        const q = el('div', 'qlbl', 'Is it dark?');
        const ch = el('span', 'chip f', 'No');
        left.append(s, q, ch);
        const arr = el('div', 'rev hide', arrowSvg(120));
        const right = el('div', 'vcol rev hide');
        const b = bulb(170);
        const st = el('div', 'state', '<span class="s0 lit">Off</span> / <span class="s1">On</span>');
        right.append(b, st);
        row.append(left, arr, right); c.appendChild(row); content.appendChild(c);
        b.cb = v => { st.children[0].classList.toggle('lit', !v); st.children[1].classList.toggle('lit', v); };
        s.cb = v => { setChip(ch, v, ['Yes', 'No']); ptimers.forEach(clearTimeout); ptimers = []; if (exporting) b.set(v); else ptimers.push(setTimeout(() => b.set(v), 700)); };
        b.onclick = () => s.set(!s.dark);
        beatAt(0, 'Every day, you make decisions without even thinking about them.');
        at(500, () => show(left)); at(900, () => show(arr)); at(1200, () => show(right));
        beatAt(4000, 'When you walk into a room, you ask yourself a question: <b>is it dark?</b>');
        beatAt(8000, 'Observe what happens when it gets dark. The answer is <b>yes</b>, so I turn on the light.');
        at(8800, () => s.set(true));
        beatAt(13500, 'When it is light again, the answer is <b>no</b>, so I leave the light off.');
        at(14300, () => s.set(false));
        beatAt(19000, 'Programs make decisions in exactly the same way.');
    }
},
{
    title: 'What is a <span>condition</span>?',
    dur: 25500,
    run() {
        const c = el('div', 'center');
        const fact = el('div', 'fact rev hide', 'A condition is a true or false question');
        const row = el('div', 'cards');
        const data = [['Is it dark?', 'True or false', true], ['Is the score 10 or more?', 'True or false', true], ['What time is it?', '3:15 pm, 9:40 am, and so on', false]];
        const cards = data.map(([q, a, ok]) => {
            const k = el('div', 'ccard rev hide', `<div class="dlbl">Question</div><div class="cq">${q}</div><div class="dlbl">Possible answers</div><div class="ca">${a}</div>`);
            k.v = el('span', 'chip rev hide ' + (ok ? 't' : 'x'), ok ? 'Condition' : 'Not a condition');
            k.appendChild(k.v); row.appendChild(k); return k;
        });
        c.append(fact, row); content.appendChild(c);
        beatAt(0, 'Every decision starts with a <b>condition</b>: a question that can only be answered <b>true</b> or <b>false</b>.');
        at(500, () => show(fact));
        beatAt(5000, 'Is it dark? The answer can only be true or false, so this is a condition.');
        at(5500, () => show(cards[0])); at(6600, () => show(cards[0].v));
        beatAt(10000, 'Is the score 10 or more? Again, the answer is true or false. This is also a condition.');
        at(10500, () => show(cards[1])); at(11800, () => show(cards[1].v));
        beatAt(15500, 'What time is it? The answer is a time, not true or false, so this is <b>not</b> a condition.');
        at(16000, () => show(cards[2])); at(17400, () => show(cards[2].v));
        beatAt(21000, 'A computer can only make a decision when the answer is true or false.');
    }
},
{
    title: 'Drawing a <span>decision</span>',
    dur: 25000,
    run() {
        const c = el('div', 'center');
        const f = flow('Is it dark?', 'Turn on the light', 'Leave it off', { labels: true });
        c.appendChild(f); content.appendChild(c);
        beatAt(0, 'Before we write code, we draw decisions as a <b>flowchart</b>. It shows every path the computer can take.');
        beatAt(5000, 'A conditional statement has <b>three parts</b>. First, the <b>condition</b>, which goes in the diamond.');
        at(5600, () => show(f.q)); at(6400, () => show(f.tc));
        beatAt(10500, 'Second, what happens if the condition is <b>true</b>. We follow the yes path.');
        at(11000, () => show(f.yes)); at(11800, () => show(f.tt));
        beatAt(15500, 'Third, what happens if the condition is <b>false</b>. We follow the no path.');
        at(16000, () => show(f.no)); at(16800, () => show(f.tf));
        beatAt(20500, 'Condition, true path, false path. Every conditional statement has these three parts.');
    }
},
{
    title: 'Following the <span>path</span>',
    dur: 21000,
    run() {
        const c = el('div', 'center');
        const row = el('div', 'hrow');
        const left = el('div', 'vcol rev hide');
        const s = sky(200);
        const ch = el('span', 'chip n', '?');
        left.append(s, ch);
        const f = flow('Is it dark?', 'Turn on the light', 'Leave it off');
        row.append(left, f); c.appendChild(row); content.appendChild(c);
        s.cb = v => { setChip(ch, v); f.pick(v); };
        beatAt(0, 'The computer tests the condition, then follows only <b>one</b> path.');
        at(500, () => show(left)); at(800, () => f.all.forEach(show));
        beatAt(4000, 'Observe what happens when it is dark. The condition is <b>true</b>, so the computer follows the yes path.');
        at(5000, () => s.set(true));
        beatAt(10500, 'Now it is light. The condition is <b>false</b>, so the computer follows the no path.');
        at(11500, () => s.set(false));
        beatAt(16500, 'The computer never follows both paths. It always takes exactly one.');
    }
},
{
    title: 'Modelled <span>example</span>',
    dur: 22500,
    run() {
        const c = el('div', 'center');
        const p = el('div', 'prob rev hide', 'In a game, if <span class="mark mc" data-tag="Condition">the score is 10 or more</span>, <span class="mark mt" data-tag="If true">the player wins</span>. If not, <span class="mark mf" data-tag="If false">the game says try again</span>.');
        c.appendChild(p); content.appendChild(c);
        const [m1, m2, m3] = p.querySelectorAll('.mark');
        beatAt(0, 'Let\u2019s try a modelled example. Here is a problem from a game.');
        at(500, () => show(p));
        beatAt(4500, 'First, find the <b>condition</b>. The question is: is the score 10 or more?');
        at(5200, () => m1.classList.add('on'));
        beatAt(9500, 'Next, the <b>true</b> path. If the condition is true, the player wins.');
        at(10200, () => m2.classList.add('on'));
        beatAt(14000, 'Finally, the <b>false</b> path. If the condition is false, the game says try again.');
        at(14700, () => m3.classList.add('on'));
        beatAt(18500, 'Now we can turn this into a flowchart, then into code.');
    }
},
{
    title: 'Step 1: <span>the condition</span>',
    dur: 25000,
    run() {
        const c = el('div', 's7');
        const a = el('div', 'hrow');
        const q = el('div', 'qbig rev hide', 'Is the score 10 or more?');
        const arr = el('div', 'rev hide', arrowSvg(90));
        const code = el('div', 'cbox rev hide', 'score <span class="op">&gt;=</span> 10');
        a.append(q, arr, code);
        const mean = el('div', 'meaning rev hide', '<span class="op">&gt;=</span>means greater than or equal to');

/* ---------- player ---------- */
const dots = $('#dots');
scenes.forEach((_, i) => { const d = el('button'); d.setAttribute('aria-label', 'Scene ' + (i + 1)); d.onclick = () => go(i); dots.appendChild(d); });

const stepLbl = $('#steplbl');
const dur = () => scenes[idx].dur;
const beatEnd = b => (b + 1 < beats.length ? beats[b + 1] : dur());
function label() { stepLbl.textContent = `Step ${beat + 1} of ${beats.length}`; }

function build(i) {
    clearTimers();
    stopInteractive();
    const ni = Math.max(0, Math.min(scenes.length - 1, i));
    if (ni !== idx) { saveInk(); idx = ni; loadInk(); zoomReset(); renderBadges(); }
    events = []; beats = [];
    const sc = scenes[idx];
    content.innerHTML = ''; caption.innerHTML = '';
    titleEl.innerHTML = sc.title;
    counter.innerHTML = `<b>${idx + 1}</b> / ${scenes.length}`;
    [...dots.children].forEach((d, j) => d.classList.toggle('cur', j === idx));
    sc.run();
    beats = [...new Set(beats)].sort((a, b) => a - b);
}

function jumpTo(to) {
    stage.classList.add('instant');
    events.filter(e => !e.done && e.t < to).sort((a, b) => a.t - b.t).forEach(e => { e.done = true; e.fn(); });
    void stage.offsetWidth;
    requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.remove('instant')));
}

function setProgress(from, to) {
    progress.style.transition = 'none';
    progress.style.width = (from / dur() * 100) + '%';
    void progress.offsetWidth;
    progress.style.transition = `width ${Math.max(0, to - from)}ms linear`;
    progress.style.width = (to / dur() * 100) + '%';
}

function play(from, to, onEnd) {
    clearTimers();
    segFrom = from; segTo = to; segStart = performance.now();
    events.filter(e => !e.done && e.t >= from && e.t < to)
        .forEach(e => timers.push(setTimeout(() => { e.done = true; e.fn(); }, e.t - from)));
    beats.forEach((bt, k) => { if (bt > from && bt < to) timers.push(setTimeout(() => { beat = k; label(); }, bt - from)); });
    if (onEnd) timers.push(setTimeout(onEnd, to - from));
    setProgress(from, to);
}

function now() { return Math.min(segTo, segFrom + performance.now() - segStart); }

function startBeat(b) {
    beat = b; label();
    jumpTo(beats[b]);
    if (autoplay) play(beats[b], dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    else play(beats[b], beatEnd(b));
}

function go(i, b = 0) {
    build(i);
    startBeat(b === 'last' ? beats.length - 1 : b);
}

function next() {
    if (autoplay) { if (idx < scenes.length - 1) go(idx + 1); return; }
    clearTimers();
    if (beat < beats.length - 1) { jumpTo(beatEnd(beat)); startBeat(beat + 1); }
    else if (idx < scenes.length - 1) go(idx + 1);
    else { jumpTo(dur()); setProgress(dur(), dur()); }
}

function back() {
    if (autoplay) { go(idx - 1); return; }
    if (beat > 0) go(idx, beat - 1);
    else if (idx > 0) go(idx - 1, 'last');
    else go(0);
}

function toggleAuto() {
    autoplay = !autoplay;
    autoBtn.classList.toggle('on', autoplay); autoBtn.setAttribute('aria-pressed', autoplay);
    const cur = now();
    clearTimers();
    if (autoplay) {
        play(cur, dur(), () => { if (idx < scenes.length - 1) go(idx + 1); });
    } else {
        let b = 0; beats.forEach((bt, k) => { if (bt <= cur) b = k; });
        beat = b; label();
        jumpTo(beatEnd(b));
        setProgress(beatEnd(b), beatEnd(b));
    }
}

const autoBtn = $('#auto');
$('#next').onclick = next;
$('#back').onclick = back;
$('#replay').onclick = () => { zoomReset(); go(idx); };
autoBtn.onclick = toggleAuto;
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.isContentEditable);
document.addEventListener('keydown', e => {
    if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (wbOpen) {
        if (e.key === 'ArrowRight') wbGo(wbPage + 1);
        if (e.key === 'ArrowLeft') wbGo(wbPage - 1);
        if (e.key === 'n' || e.key === 'N') wbNew();
        if (e.key === ' ') e.preventDefault();
        return;
    }
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') back();
    if (e.key === 'r' || e.key === 'R') { zoomReset(); go(idx); }
    if (e.key === ' ') { e.preventDefault(); toggleAuto(); }
});

        const w = el('div', 'ui-thw'); if (thumbs[i]) w.appendChild(thumbs[i].cloneNode(true));
        c.append(w, el('div', 'ui-lb', `<span class="ui-n">${i + 1}</span><span class="ui-t">${sc.title}</span>`));
        c.onclick = () => { closeModal(); if (i !== idx) go(i); };
        g.appendChild(c);
    });
}

const SHORTCUTS = [
    ['Slides', [['&rarr;', 'Next'], ['&larr;', 'Previous'], ['R', 'Replay scene'], ['Space', 'Autoplay'], ['G', 'Slide overview']]],
    ['Draw', [['P', 'Pen'], ['Y', 'Highlighter'], ['E', 'Eraser'], ['B', 'Text box'], ['C', 'Clear ink'], ['Ctrl|Z', 'Undo'], ['Ctrl|Shift|Z', 'Redo']]],
    ['Focus', [['Z', 'Zoom (scroll to adjust)'], ['L', 'Lock zoom'], ['H', 'Spotlight (scroll to resize)'], ['K', 'Blackout']]],
    ['Engage', [['M', 'Engagement methods'], ['1|5', 'Choose a method'], ['T', 'Timer']]],
    ['Whiteboard', [['W', 'Open or close'], ['&larr;|&rarr;', 'Change page'], ['N', 'New page']]],
    ['View', [['F', 'Fullscreen'], ['U', 'Hide or show UI'], ['S', 'Subtitles'], ['?', 'Shortcuts'], ['Esc', 'Close or stop tool']]]
];
$('#kgrid').innerHTML = SHORTCUTS.map(([h, rows]) => `<div class="ui-kgrp"><h3>${h}</h3>${rows.map(([k, l]) => {
    const keys = k === '1|5' ? '<kbd>1</kbd>to<kbd>5</kbd>' : k.split('|').map(x => `<kbd>${x}</kbd>`).join(k.includes('Ctrl') ? '+' : '');
    return `<div class="ui-krow"><span class="ui-ks">${keys}</span><span>${l}</span></div>`;
}).join('')}</div>`).join('');

/* ---------- export PDF ---------- */
const printBox = $('#print');
function snapStage(boardOnly) {
    stage.querySelectorAll('input').forEach(n => n.setAttribute('value', n.value));
    const page = stage.cloneNode(true), imgs = [];
    page.removeAttribute('id'); page.removeAttribute('style'); page.classList.remove('instant');
    page.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
    page.querySelectorAll('.ui-spot, canvas.hllive').forEach(n => n.remove());
    [['canvas.ink', ink, inkMarked, 'ink'], ['canvas.hlmain', hlc, hlMarked, 'ui-hlc']].forEach(([sel, src, marked, cls]) => {
        const cv = page.querySelector(sel); if (!cv) return;
        if (marked) { const img = new Image(); img.className = cls; img.alt = ''; img.src = src.toDataURL(); cv.replaceWith(img); imgs.push(img); }
        else cv.remove();
    });
    if (boardOnly) page.querySelectorAll('.top, .content, .caption, .progress').forEach(n => n.remove());
    return { page, imgs };
}
function runScene(i) {
    build(i);
    events.slice().sort((a, b) => a.t - b.t).forEach(e => { if (!e.done) { e.done = true; e.fn(); } });
    progress.style.transition = 'none'; progress.style.width = '100%';
}
function buildThumbs() {
    exporting = true;
    for (let i = 0; i < scenes.length; i++) {
        runScene(i);
        const { page } = snapStage(false);
        page.querySelectorAll('canvas, img.ink, img.ui-hlc, .ui-blayer').forEach(n => n.remove());
        thumbs[i] = page;
    }
    exporting = false;
}
async function exportPDF() {
    if (document.activeElement) document.activeElement.blur();
    zoomReset();
    printBox.innerHTML = '';
    const imgs = [];
    if (wbOpen) {
        const keep = wbPage;
        for (let p = 0; p < wbPages; p++) {
            wbPage = p; loadSurface(); syncWB();
            const r = snapStage(true); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        wbPage = keep; loadSurface(); syncWB();
    } else {
        const keepIdx = idx, keepBeat = beat;
        exporting = true;
        for (let i = 0; i < scenes.length; i++) {
            runScene(i);
            const r = snapStage(false); imgs.push(...r.imgs); printBox.appendChild(r.page);
        }
        exporting = false;
        go(keepIdx, keepBeat);
    }
    await Promise.all(imgs.map(im => im.decode().catch(() => {})));
    window.print();
}
$('#pdf').onclick = exportPDF;
$('#wbpdf').onclick = () => { $('#wbpdf').blur(); exportPDF(); };
window.addEventListener('afterprint', () => { printBox.innerHTML = ''; });

document.addEventListener('keydown', e => {
    if (isTyping(e)) return;
    if (e.ctrlKey || e.metaKey) {
        const k = e.key.toLowerCase();
        if (k === 'z') { e.preventDefault(); e.shiftKey ? redoInk() : undoInk(); }
        else if (k === 'y') { e.preventDefault(); redoInk(); }
        return;
    }
    if (e.altKey) return;
    if (e.key === 'p' || e.key === 'P') setTool(tool === 'pen' ? null : 'pen');
    if (e.key === 'e' || e.key === 'E') setTool(tool === 'eraser' ? null : 'eraser');
    if (e.key === 'c' || e.key === 'C') clearInk();
    if (e.key === 's' || e.key === 'S') toggleSubs();
    if (e.key === 't' || e.key === 'T') ftShow(ftEl.hidden);
    if (e.key === 'u' || e.key === 'U') setUI(!document.body.classList.contains('noui'));
    if (e.key === 'z' || e.key === 'Z') setZoom(!Z.on);
    if (e.key === 'l' || e.key === 'L') setLock(!Z.locked);
    if (e.key === 'h' || e.key === 'H') setSpot(!SP.on);
    if (e.key === 'f' || e.key === 'F') toggleFS();
    if (e.key === 'm' || e.key === 'M') toggleMenu(engMenu);
    if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenus(); addText(true); }
    if (e.key === 'y' || e.key === 'Y') setTool(tool === 'hl' ? null : 'hl');
    if (e.key === 'w' || e.key === 'W') toggleWB();
    if (e.key === 'k' || e.key === 'K') openModal('blk');
    if ((e.key === 'g' || e.key === 'G') && !wbOpen) openModal('ovw');
    if (e.key === '?' || e.key === '/') { e.preventDefault(); openModal('keys'); }
    if (/^[1-5]$/.test(e.key) && engMenu.classList.contains('ui-open')) { addBadge(ENG_KEYS[+e.key - 1]); closeMenus(); }
    if (e.key === 'Escape') closeMenus();
    if (e.key === 'Escape') setTool(null);
});

const controlsEl = document.querySelector('.controls');
function fit() {
    const st = $('#stage'), noui = document.body.classList.contains('noui');
    const vw = window.innerWidth - (noui ? 0 : 40), vh = window.innerHeight - (noui ? 0 : controlsEl.offsetHeight + 20);
    const k = Math.min(vw / 1280, vh / 720);
    scaleK = k;
    st.style.transform = `scale(${k})`;
    st.style.margin = `${(720 * k - 720) / 2}px ${(1280 * k - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); buildThumbs(); go(0); });
</script>
