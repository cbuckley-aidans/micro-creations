<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coding Conditional Statements: Checking for Understanding</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --scr: #10132c;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --mono: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Courier New', monospace;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; }
    .sheet-title { font-family: var(--cond); font-size: 44px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .counter { font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; }
    .counter b { color: var(--navy); }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption code, .prompt code, .card code { font-family: var(--mono); font-size: .88em; font-weight: 700; }
    .prompt code { color: var(--pink); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }
    .next { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pink); color: #fff;
        border: none; border-radius: 8px; padding: 12px 30px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; gap: 10px; }
    .next svg { width: 18px; height: 18px; fill: currentColor; }
    .next[hidden] { display: none; }
    .next:disabled { background: #c3c6d0; cursor: default; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes blink { 50% { opacity: 0; } }

    /* question frame */
    .q { display: flex; flex-direction: column; height: 100%; }
    .qhead { display: flex; align-items: center; gap: 18px; }
    .qtitle { font-size: 38px; font-weight: 800; line-height: 1.15; }
    .tchip { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 3px 12px 2px; }
    .prompt { font-size: 25px; font-weight: 600; margin-top: 4px; line-height: 1.3; }
    .body { flex: 1; min-height: 0; margin-top: 12px; display: flex; gap: 26px; }
    .center { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .dlbl { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }

    /* code colouring */
    .dk .k { color: #ff5cb3; font-weight: 700; } .dk .s { color: #ffb0d9; } .dk .n, .dk .v { color: #fff; } .dk .f, .dk .o { color: #9aa3cf; }
    .lt .k { color: var(--pink); font-weight: 800; } .lt .s { color: #c2307f; } .lt .n, .lt .v { color: var(--navy); } .lt .f, .lt .o { color: #6b7199; }
    .l-k { fill: var(--pink); font-weight: 800; } .l-s { fill: #c2307f; } .l-n, .l-v { fill: var(--navy); } .l-f, .l-o { fill: #6b7199; }

    /* svg classes */
    svg { overflow: visible; display: block; }
    .plab { font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; fill: var(--mid-grey); }
    .vname { font-family: var(--mono); font-size: 24px; font-weight: 700; fill: var(--pink); }
    .vval { font-family: var(--mono); font-size: 24px; font-weight: 700; }
    .cd { font-family: var(--mono); font-size: 20px; font-weight: 500; white-space: pre; }
    .pt { font-family: var(--mono); font-size: 17px; font-weight: 700; }
    .note { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: var(--mid-grey); }

    /* left column: editor and screen */
    .left { width: 620px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .lab { display: block; font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a90b8; }
    .editor { background: var(--navy); border-radius: 8px; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 4px; }
    .ehead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
    .reset { font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #c3c6d0; background: transparent; border: 2px solid #3b4170;
        border-radius: 5px; padding: 3px 10px 2px; cursor: pointer; }
    .reset:hover { border-color: #8a90b8; color: #fff; }
    .tools { display: flex; gap: 8px; }
    .card.ex { position: relative; }
    .xbtn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border: 2px solid #c3c6d0; border-radius: 6px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .xbtn svg { width: 12px; height: 12px; stroke: var(--navy); stroke-width: 2.4; stroke-linecap: round; }
    .xbtn:hover { border-color: var(--navy); }
    .erow { display: flex; align-items: center; gap: 12px; min-height: 46px; border-radius: 6px; padding: 0 6px 0 0; transition: background-color .25s, box-shadow .25s, opacity .25s; }
    .erow .ln2 { color: #6d7299; font-family: var(--mono); font-size: 20px; width: 30px; text-align: right; flex-shrink: 0; }
    .editor.compact .erow { min-height: 40px; }
    .editor.compact .code, .editor.compact .full, .editor.compact .blank { font-size: 24px; }
    .editor.compact .full { padding: 1px 10px; }
    .editor.xcompact { gap: 2px; }
    .editor.xcompact .erow { min-height: 33px; }
    .editor.xcompact .code, .editor.xcompact .full, .editor.xcompact .blank { font-size: 22px; }
    .editor.xcompact .full { padding: 0 9px; }
    .erow.on { background: rgba(234,0,138,.26); box-shadow: inset 5px 0 0 var(--pink); }
    .erow.bad { background: rgba(255,92,179,.14); box-shadow: inset 5px 0 0 #ff5cb3; }
    .erow.skip { opacity: .32; }
    .code { font-family: var(--mono); font-size: 27px; font-weight: 500; white-space: pre; color: #fff; padding: 0 2px; }
    .full { flex: 1; min-width: 0; font-family: var(--mono); font-size: 27px; font-weight: 500; color: #fff; background: rgba(255,255,255,.06); border: 3px solid #3b4170; border-radius: 6px;
        padding: 4px 10px; caret-color: var(--pink); outline: none; white-space: pre; -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s; }
    .blank { font-family: var(--mono); font-size: 27px; font-weight: 500; color: #fff; background: rgba(255,255,255,.08); border: 2px dashed #8a90b8; border-radius: 5px;
        padding: 1px 4px; margin: 0 2px; text-align: center; caret-color: var(--pink); outline: none; -webkit-user-select: text; user-select: text; transition: border-color .2s, background-color .2s; }
    .full:focus, .blank:focus { border-color: var(--pink); border-style: solid; }
    .full:focus-visible, .blank:focus-visible { outline: none; }
    .full::placeholder { color: #5d6390; }
    .full.done, .blank.done { border-color: var(--pink); border-style: solid; background: rgba(234,0,138,.25); }
    .screen { flex: 1; min-height: 84px; background: var(--scr); border-radius: 8px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
    .screen > div { padding: 7px 18px 8px; font-family: var(--mono); color: #fff; font-size: 22px; font-weight: 700; line-height: 1.28; white-space: pre-wrap; overflow: hidden; }
    .screen .goal { border-left: 2px dashed #3b4170; color: #8a90b8; }
    .screen .err { color: #ff5cb3; font-size: 16px; line-height: 1.3; }
    .screen .errl { color: #8a90b8; font-size: 15px; font-family: var(--cond); letter-spacing: .1em; text-transform: uppercase; font-weight: 800; margin-top: 4px; }
    .screen .match { color: var(--pink); }
    .curs { display: inline-block; width: 12px; height: 22px; background: var(--pink); vertical-align: -3px; animation: blink 1s steps(1) infinite; }

    /* right column: support card and memory */
    .right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .card { border: 3px solid var(--navy); border-radius: 8px; padding: 8px 16px 12px; flex-shrink: 0; }
    .card .lab2 { font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 6px; }
    .excode { background: var(--navy); border-radius: 6px; padding: 5px 14px; font-family: var(--mono); font-size: 17px; font-weight: 500; white-space: pre; line-height: 1.38; color: #fff; }
    .excode .ln3 { color: #6d7299; font-size: 15px; display: inline-block; width: 22px; }
    .exout { margin-top: 6px; display: flex; align-items: center; gap: 12px; }
    .exout span { font-family: var(--cond); font-size: 16px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); }
    .exout b { font-family: var(--mono); font-size: 20px; background: var(--scr); color: #fff; border-radius: 6px; padding: 3px 12px; }
    .pat { display: flex; flex-direction: column; gap: 4px; }
    .pline { font-family: var(--mono); font-size: 22px; font-weight: 500; white-space: pre; line-height: 1.45; }
    .ph { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-style: italic; font-weight: 700; font-size: 20px; color: var(--pink); border: 2px solid var(--pink); border-radius: 5px; padding: 0 7px; margin: 0 1px; }
    .pnote { font-size: 19px; font-weight: 600; color: var(--mid-grey); }
    .syms { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; }
    .syms div { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; }
    .syms code { font-family: var(--mono); font-size: 21px; font-weight: 700; color: #fff !important; background: var(--navy); border-radius: 5px; padding: 1px 0; width: 48px; text-align: center; flex-shrink: 0; }
    .card .htxt { font-size: 22px; font-weight: 600; line-height: 1.3; }
    .mem { flex: 1; min-height: 0; background: #f5f6fa; border-radius: 8px; position: relative; }
    .mem svg { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* end */
    .scorecard { border: 3px solid var(--pink); border-radius: 8px; padding: 22px 60px 26px; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .scorecard .big { font-family: var(--cond); font-size: 96px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: 8px; }
    .scorecard .dlbl { margin-top: 8px; }
    .dots { display: flex; gap: 8px; justify-content: center; margin-top: 22px; }
    .dots span { width: 34px; height: 34px; border-radius: 6px; border: 3px solid var(--navy); font-family: var(--cond); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .dots span.y { background: var(--pink); border-color: var(--pink); color: #fff; }
    .again { margin-top: 26px; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 8px; padding: 8px 22px; cursor: pointer; }
    /* buckles */
    .hright { display: flex; align-items: flex-end; gap: 28px; }
    .bcount { display: flex; align-items: center; gap: 10px; }
    .counter-icon { width: 34px; height: 34px; display: block; }
    .bcount .num { font-family: var(--cond); font-size: 34px; font-weight: 900; line-height: 1; }
    .bcount .lbl { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); }
    .done-buckle { width: 90px; height: 90px; }
    .scorecard .sub { margin-top: 22px; }
    .award { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.8); opacity: 0; pointer-events: none; z-index: 30;
        background: #fff; border: 3px solid var(--pink); border-radius: 12px; padding: 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 10px;
        box-shadow: 0 20px 50px rgba(27,31,69,.25); transition: opacity .3s, transform .35s var(--ease); }
    .award.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .award.hide { opacity: 0; transform: translate(-50%, -60%) scale(.95); }
    .award-img { width: 140px; height: auto; }
    .award-text { font-family: var(--cond); font-size: 40px; font-weight: 900; color: var(--pink); text-transform: uppercase; letter-spacing: .04em; }
    .confetti-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 29; }
</style>
</head>
<body>
<div class="stage" id="stage">
    <div class="top">
        <h1 class="sheet-title">Coding <span>conditionals</span></h1>
        <div class="hright">
            <div class="counter" id="counter"></div>
            <div class="bcount" title="Buckles earned">
                <img src="buckle.svg" alt="" class="counter-icon" onerror="this.style.visibility='hidden'">
                <div class="num" id="buckleCount">0</div>
                <div class="lbl">Buckles</div>
            </div>
        </div>
    </div>
    <div class="content" id="content"></div>
    <div class="caption"><div class="txt" id="cap"></div><button class="next" id="next" hidden>Run</button></div>
    <div class="progress" id="progress"></div>
</div>

<div class="award" id="award" role="status" aria-live="polite">
    <img src="penguin-with-buckle.svg" alt="" class="award-img" onerror="this.style.display='none'">
    <div class="award-text" id="awardText">+1 Buckle!</div>
</div>

<script>
const $ = s => document.querySelector(s);
const content = $('#content'), cap = $('#cap'), btn = $('#next'), counter = $('#counter'), progress = $('#progress');
const PK = '#ea008a', NV = '#1b1f45', GR = '#c9ccd6', LT = '#f0f3f6', NS = 'http://www.w3.org/2000/svg';
let scaleK = 1;
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function sel(tag, attrs = {}, html) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (html !== undefined) e.innerHTML = html; return e; }
function say(html) { cap.innerHTML = `<span class="in">${html}</span>`; }
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const RUN_ICON = '<svg viewBox="0 0 16 16"><path d="M3 1.5v13l11-6.5z"/></svg>';

/* ---------- animation helpers ---------- */
let runId = 0;
const easeOut = t => 1 - (1 - t) * (1 - t), easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function play(dur, step, guard) {
    const id = runId, ok = guard || (() => id === runId);
    return new Promise(res => {
        const st = performance.now();
        const f = n => { if (!ok()) return; const t = Math.min(1, (n - st) / dur); step(t); if (t < 1) requestAnimationFrame(f); else res(); };
        requestAnimationFrame(f);
    });
}
function wait(ms) { const id = runId; return new Promise(r => setTimeout(() => { if (id === runId) r(); }, ms)); }
const fadeIn = (node, d = 280) => { node.setAttribute('opacity', 0); return play(d, k => node.setAttribute('opacity', k)); };

/* ---------- syntax colouring ---------- */
const KW = new Set(['if', 'else', 'elif', 'True', 'False', 'and', 'or', 'not']);
function tokens(line) {
    const re = /("[^"]*"?|'[^']*'?)|(-?\d+(?:\.\d+)?)|([A-Za-z_]\w*)|(\s+)|(==|!=|<=|>=|.)/g, out = [];
    let m;
    while ((m = re.exec(line))) { const t = m[0]; out.push({ t, k: m[1] ? 's' : m[2] ? 'n' : m[3] ? (KW.has(t) ? 'k' : t === 'print' ? 'f' : 'v') : m[4] ? 'w' : 'o' }); }
    return out;
}
const codeHTML = line => tokens(line).map(x => x.k === 'w' ? x.t : `<span class="${x.k}">${esc(x.t)}</span>`).join('');
const codeTS = (line, p = 'l-') => tokens(line).map(x => x.k === 'w' ? x.t : `<tspan class="${p}${x.k}">${esc(x.t)}</tspan>`).join('');
const subTS = s => s.split(/\[(.+?)\]/).map((x, i) => i % 2 ? `<tspan fill="${PK}" font-weight="700">${esc(x)}</tspan>` : codeTS(x)).join('');

/* ---------- memory box ---------- */
const REST = -18;
function chipSVG(val) {
    const w = Math.max(64, String(val).length * 14.4 + 30), str = /^["']/.test(val);
    return `<rect x="${-w / 2}" y="-22" width="${w}" height="44" rx="8" fill="#fff" stroke="${NV}" stroke-width="3"/><text class="vval" y="8" text-anchor="middle" fill="${str ? PK : NV}">${esc(val)}</text>`;
}
function boxShape(name) {
    const pw = Math.max(96, name.length * 14.4 + 30), fw = Math.max(170, pw + 36), hw = fw / 2, ins = 22;
    const flap = sx => `<polygon points="${sx * hw},0 ${sx * (hw - ins)},-24 ${sx * (hw + 12)},-38 ${sx * (hw + 34)},-14" fill="${LT}" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>`;
    return { pw, fw, hw,
        back: `${flap(-1)}${flap(1)}<polygon points="${-hw},0 ${-hw + ins},-24 ${hw - ins},-24 ${hw},0" fill="#cfd3df" stroke="${NV}" stroke-width="3" stroke-linejoin="round"/>`,
        front: `<rect x="${-hw}" y="0" width="${fw}" height="96" fill="${LT}" stroke="${NV}" stroke-width="4" stroke-linejoin="round"/>
            <rect x="${-pw / 2}" y="30" width="${pw}" height="40" rx="6" fill="#fff" stroke="${PK}" stroke-width="3"/>
            <text class="vname" x="0" y="58" text-anchor="middle">${esc(name)}</text>` };
}
function vbox(layer, cx, ry, name, s = 1) {
    const sh = boxShape(name);
    const g = sel('g', { transform: `translate(${cx} ${ry}) scale(${s})` });
    g.innerHTML = `${sh.back}<g class="vals"></g>${sh.front}`;
    layer.appendChild(g);
    const vals = g.querySelector('.vals');
    return {
        g, cur: null, val: null,
        appear() { return play(380, k => { const e = easeOut(k); g.setAttribute('opacity', k); g.setAttribute('transform', `translate(${cx} ${ry + 14 * (1 - e)}) scale(${s})`); }); },
        async put(val) {
            const old = this.cur, c = sel('g', {}, chipSVG(val));
            vals.appendChild(c); this.cur = c; this.val = val;
            c.setAttribute('transform', `translate(0 -170)`); c.setAttribute('opacity', 0);
            const outP = old ? play(480, k => { const e = easeInOut(k); old.setAttribute('transform', `translate(${150 * e} ${REST - 110 * easeOut(k)}) rotate(${18 * e})`); old.setAttribute('opacity', 1 - k); }).then(() => old.remove()) : Promise.resolve();
            if (old) await wait(260);
            await play(520, k => { c.setAttribute('transform', `translate(0 ${-170 + (REST + 170) * easeOut(k)})`); c.setAttribute('opacity', Math.min(1, k * 2.5)); });
            await outP;
        },
        pulse() {
            const r = this.cur && this.cur.querySelector('rect'); if (!r) return Promise.resolve();
            return play(600, k => { const p = Math.sin(k * Math.PI); r.setAttribute('stroke', p > .15 ? PK : NV); r.setAttribute('stroke-width', 3 + 3 * p); });
        }
    };
}

/* ---------- condition readout ---------- */
function pillSVG(cx, cy, v) {
    const w = 80, h = 28, fill = v === true ? PK : '#fff', tf = v === true ? '#fff' : NV, st = v === true ? '' : `stroke="${NV}" stroke-width="2.5"`;
    return `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="${h / 2}" fill="${fill}" ${st}/><text class="pt" x="${cx}" y="${cy + 6}" text-anchor="middle" fill="${tf}">${v ? 'True' : 'False'}</text>`;
}
function condBox(layer, x, y, w, h) {
    const g = sel('g'); layer.appendChild(g);
    const cy = y + h / 2, tx = x + 136, px = x + w - 52;

        return L + `Python can\u2019t find a variable called <code>${esc(name)}</code>. Create it on an earlier line, spelled exactly the same.`;
    }
    if (err.type === 'TypeError') {
        if (/not supported between/.test(m)) return L + 'you can\u2019t compare text with a number. Numbers don\u2019t go in quotes.';
        if (/concatenate/.test(m)) return L + 'you can\u2019t join text and a number with <code>+</code>. Inside <code>print</code>, use a comma instead.';
        if (/unsupported operand|non-int/.test(m)) return L + 'one of these values is text in quotes, so Python can\u2019t do maths with it.';
        if (/not callable/.test(m)) return L + 'only <code>print</code> uses brackets like this.';

    return L + esc(err.type + ': ' + m);

function judge(q, lines, res) {

    const ctx = { src: lines.join('\n'), lines, env: res.env, out: res.out };
    if (!/^\s*if\s/m.test(ctx.src) || !/^\s*else\s*:/m.test(ctx.src)) return { ok: false, hint: 'Keep the <code>if</code> and the <code>else</code>. The goal is to make the decision work, not to skip it.' };
    for (const [test, h] of (q.rules || [])) if (test(ctx)) return { ok: false, hint: h };
    const out = res.out, exp = q.expect;
    if (out.length === exp.length && out.every((l, i) => l === exp[i])) return { ok: true };
    if (!out.length) return { ok: false, hint: 'Nothing appeared on the screen. Trace each line and check which branch runs.' };
    if (out.length > exp.length) return { ok: false, hint: `Your code shows ${out.length} lines, but the goal only has ${exp.length}. Only one branch should run.` };
    return { ok: false, hint: `Your screen shows <code>${esc(out.join(' / '))}</code>, but the goal is <code>${esc(exp.join(' / '))}</code>.` };
}

function burstConfetti() {
    const canvas = document.createElement('canvas');

    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);

    }

                const p = i.selectionStart, before = i.value.slice(0, p);
                if (!e.shiftKey && before.trim() === '') { e.preventDefault(); i.value = '    ' + i.value; i.setSelectionRange(p + 4, p + 4); i.dispatchEvent(new Event('input')); return; }
                if (e.shiftKey && /^ {1,4}/.test(i.value) && before.trim() === '') { e.preventDefault(); const k = i.value.match(/^ {1,4}/)[0].length; i.value = i.value.slice(k); i.setSelectionRange(Math.max(0, p - k), Math.max(0, p - k)); i.dispatchEvent(new Event('input')); return; }
            }
            if (e.key !== 'Enter') return; e.preventDefault();
            const k = inputs.indexOf(i);
            if (k < inputs.length - 1) {
                const nx = inputs[k + 1];
                if (nx.classList.contains('full') && !nx.value && /:\s*$/.test(i.value)) { nx.value = (i.value.match(/^\s*/)[0]) + '    '; nx.dispatchEvent(new Event('input')); }
                nx.focus(); nx.setSelectionRange(nx.value.length, nx.value.length);
            } else if (!btn.disabled && mode === 'check') run();
        });
        inputs.push(i); return i;
    };
    const getters = q.lines.map((ln, li) => {
        const r = el('div', 'erow', `<span class="ln2">${li + 1}</span>`); rows.push(r); ed.appendChild(r);
        if (typeof ln === 'string') { r.appendChild(el('span', 'code', codeHTML(ln))); return () => ln; }
        if ('e' in ln) { const i = mkInput('full', ln.e, ln.ph); i.setAttribute('aria-label', 'Line ' + (li + 1)); r.appendChild(i); return () => i.value; }
        const holder = el('span', 'code'), parts = ln.p.map(pt => {
            if (typeof pt === 'string') { holder.appendChild(el('span', '', codeHTML(pt))); return () => pt; }
            const i = mkInput('blank', '', '', pt.b); i.setAttribute('aria-label', 'Blank on line ' + (li + 1)); holder.appendChild(i); return () => i.value;
        });
        r.appendChild(holder); return () => parts.map(f => f()).join('');
    });
    const scr = el('div', 'screen'), outEl = el('div', 'outp'), goalEl = el('div', 'goal');
    goalEl.innerHTML = `<span class="lab">Goal</span>${esc(q.expect.join('\n'))}`;
    const clearOut = () => { outEl.innerHTML = `<span class="lab">Your screen</span><span class="curs"></span>`; };
    clearOut(); scr.append(outEl, goalEl);
    left.append(ed, scr);
    const card = supportCard(q), mem = el('div', 'mem');
    if (card && !q.example) right.appendChild(card);
    if (card && q.example) {
        const x = el('button', 'xbtn', '<svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg>'); x.setAttribute('aria-label', 'Hide example');
        card.classList.add('ex'); card.appendChild(x);
        const toggle = on => {
            if (on === !!card.parentNode) return;
            if (on) { right.insertBefore(card, right.firstChild); card.classList.remove('pop-in'); void card.offsetWidth; card.classList.add('pop-in'); } else card.remove();
            exBtn.textContent = on ? 'Hide example' : 'Show example';
            relayout();
        };
        exBtn.onclick = () => toggle(!card.parentNode);
        x.onclick = () => toggle(false);
    }
    right.appendChild(mem);
    body.append(left, right);
    let H = mem.offsetHeight || 180, W = mem.offsetWidth || 500;
    mem.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><text class="plab" x="14" y="26">Memory</text><text class="note emp" text-anchor="middle">Empty until your code runs</text><g class="m"></g><g class="cl"></g></svg>`;
    const memG = mem.querySelector('.m'), emp = mem.querySelector('.emp'), cl = mem.querySelector('.cl');
    let cb = null, last = null, CH = 52;
    const remeasure = () => {
        H = mem.offsetHeight || H; W = mem.offsetWidth || W; mem.querySelector('svg').setAttribute('viewBox', `0 0 ${W} ${H}`);
        CH = H < 200 ? 44 : 52; emp.setAttribute('x', W / 2); emp.setAttribute('y', (30 + H - CH - 18) / 2 + 6);
        cl.innerHTML = ''; cb = condBox(cl, 10, H - CH - 10, W - 20, CH);
    };
    remeasure();
    const resetMem = () => { memG.innerHTML = ''; emp.style.display = ''; cb.reset(); };
    /* replay the last run instantly after a layout change */
    const relayout = () => { remeasure(); if (last) { resetMem(); drawStatic(last); } };
    const layout = n => {
        const top = 34, bot = H - CH - 20, s = Math.min(n <= 2 ? .66 : n === 3 ? .55 : .48, (bot - top - 6) / 140), gapX = W / n, mid = (top + bot) / 2;
        return [...Array(n)].map((_, i) => ({ x: gapX * (i + .5), y: mid + 4 - 28 * s, s }));
    };
    function drawStatic(res) {
        const names = [...new Set(res.events.filter(e => e.a).map(e => e.name))], pos = layout(names.length), fin = {};
        res.events.forEach(e => { if (e.a) fin[e.name] = e.disp; });
        if (names.length) emp.style.display = 'none';
        names.forEach((nm, k) => { const p = pos[k], b = vbox(memG, p.x, p.y, nm, p.s); b.g.querySelector('.vals').innerHTML = `<g transform="translate(0 ${REST})">${chipSVG(fin[nm])}</g>`; });
    }
    rst.onclick = () => { if (mode !== 'check') return; inputs.forEach(i => { i.value = i.dataset.init; i.dispatchEvent(new Event('input')); }); rows.forEach(r => r.classList.remove('on', 'bad', 'skip')); clearOut(); resetMem(); last = null; goalEl.classList.remove('match'); refresh(); inputs[0] && inputs[0].focus(); };
    setTimeout(() => { const f = inputs.find(i => !i.value) || inputs[0]; if (f) f.focus({ preventScroll: true }); }, 60);
    return {
        ready: () => inputs.every(i => i.value.trim() !== '') && (!q.fix || inputs.some(i => i.value !== i.dataset.init)),
        lines: () => getters.map(g => g()),
        async animate(res) {
            rows.forEach(r => r.classList.remove('on', 'bad', 'skip'));
            outEl.innerHTML = '<span class="lab">Your screen</span>'; goalEl.classList.remove('match');
            remeasure(); resetMem(); last = res;
            const names = [...new Set(res.events.filter(e => e.a).map(e => e.name))], pos = layout(names.length), boxes = {};
            if (names.length) emp.style.display = 'none';
            for (const e of res.events) {
                if (e.skip) { e.skip.forEach(k => rows[k] && rows[k].classList.add('skip')); await wait(300); continue; }
                rows.forEach(r => r.classList.remove('on')); rows[e.i].classList.add('on');
                await wait(170);
                if (e.a) {
                    let b = boxes[e.name];
                    if (!b) { const p = pos[names.indexOf(e.name)]; b = boxes[e.name] = vbox(memG, p.x, p.y, e.name, p.s); b.g.setAttribute('opacity', 0); await b.appear(); }
                    await b.put(e.disp);
                } else if (e.c) {
                    await cb.expr(e.c.e); await wait(220);
                    for (const v of e.c.vars) if (boxes[v]) await boxes[v].pulse();
                    await cb.sub(e.c.s); await wait(220);
                    await cb.res(e.c.r); await wait(380);
                } else if (e.mark) {
                    await wait(260);
                } else {
                    const d = el('div', ''); outEl.appendChild(d);
                    await play(Math.max(200, e.text.length * 40), k => { d.textContent = e.text.slice(0, Math.round(k * e.text.length)); });
                }
                await wait(140);
            }
            rows.forEach(r => r.classList.remove('on'));
            if (res.err) {
                rows[res.err.line].classList.add('bad');
                outEl.insertAdjacentHTML('beforeend', `<div class="err">${esc(res.err.type)} on line ${res.err.line + 1}: ${esc(res.err.msg.replace(/ after '\w+' statement.*$/, '').replace(/\. Maybe you meant.*$/, ''))}</div>`);
            } else if (judge(q, getters.map(g => g()), res).ok) goalEl.classList.add('match');
        },
        lock() { inputs.forEach(i => { i.readOnly = true; i.classList.add('done'); }); },
        unlock() {
            if (right.querySelector('.card')) return;
            right.insertBefore(el('div', 'card pop-in', `<div class="lab2">Hint</div><div class="htxt">${q.hint}</div>`), mem);
            relayout();
        }
    };
}

/* ---------- scale to window ---------- */
function fit() {
    const st = $('#stage');
    scaleK = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.transform = `scale(${scaleK})`;
    st.style.margin = `${(720 * scaleK - 720) / 2}px ${(1280 * scaleK - 1280) / 2}px`;
}
window.addEventListener('resize', fit);
fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
    fit(); refreshCount();
    const pos = Buckles.getPos();
    if (pos >= SEQ.length) { si = SEQ.length - 1; finish(); } else { si = Math.max(0, pos); render(); }
});
</script>
</body>
