<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro Creations Flashcards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='7' y='13' width='32' height='44' rx='5' fill='%231b1f45' stroke='%23fff' stroke-width='2.5' transform='rotate(-12 23 35)'/%3E%3Crect x='24' y='8' width='32' height='44' rx='5' fill='%23ea008a' stroke='%23fff' stroke-width='2.5' transform='rotate(9 40 30)'/%3E%3Crect x='31' y='17' width='15' height='4' rx='2' fill='%23fff' transform='rotate(9 40 30)'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #1b1f45;
        --pink: #ea008a;
        --mid-grey: #9a9a9a;
        --light-grey: #e8e8e8;
        --blank: #f0f3f6;
        --tint: #e9ecf5;
        --cond: 'Barlow Condensed', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --ease: cubic-bezier(.2,.8,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #eaeaea; color: var(--navy);
        display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; }
    .stage { width: 1280px; height: 720px; background: #fff; border-top: 6px solid var(--navy); position: relative; padding: 36px 64px 0; flex-shrink: 0; overflow: hidden; transform-origin: center; }
    .top { gap: 24px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid var(--navy); padding-bottom: 12px; height: 70px; }
    .sheet-title { white-space: nowrap; flex: 1; min-width: 0; overflow: hidden; font-family: var(--cond); font-size: 42px; font-weight: 900; text-transform: uppercase; letter-spacing: .01em; margin: 0; line-height: 1; }
    .sheet-title span { color: var(--pink); }
    .topr { display: flex; align-items: center; gap: 22px; }
    .counter { white-space: nowrap; font-family: var(--cond); font-size: 22px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); text-transform: uppercase; display: flex; align-items: center; gap: 22px; }
    .counter b { color: var(--navy); }
    .snd { width: 40px; height: 40px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; color: var(--navy); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
    .snd svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .snd.on { background: var(--navy); color: #fff; }
    .content { position: absolute; left: 64px; right: 64px; top: 124px; bottom: 108px; }
    .caption { position: absolute; left: 64px; right: 64px; bottom: 28px; min-height: 60px; display: flex; align-items: center; gap: 16px; font-size: 25px; font-weight: 500; line-height: 1.32; }
    .caption::before { content: ''; width: 10px; height: 10px; background: var(--pink); flex-shrink: 0; }
    .caption .txt { flex: 1; }
    .caption b { color: var(--pink); font-weight: 800; }
    .caption b.no { color: var(--navy); }
    .caption .in { animation: capIn .45s var(--ease); display: block; }
    @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .progress { position: absolute; left: 0; bottom: 0; height: 6px; background: var(--pink); width: 0; transition: width .6s var(--ease); }
    .btns { display: flex; gap: 12px; flex-shrink: 0; }
    .next, .btn2 { font-family: var(--cond); font-size: 26px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-radius: 8px; padding: 12px 30px; cursor: pointer; }
    .next { background: var(--pink); color: #fff; border: 3px solid var(--pink); }
    .next:disabled { background: #c3c6d0; border-color: #c3c6d0; cursor: default; }
    .btn2 { background: #fff; color: var(--navy); border: 3px solid var(--navy); }
    .btn2:hover { background: var(--blank); }
    button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
    .next:focus-visible { outline-color: var(--navy); }
    .pop-in { animation: capIn .45s var(--ease); }
    @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* svg text */
    svg { display: block; }
    .vis { overflow: hidden; }
    .halo { paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    .num { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: var(--navy); }
    .lb { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .lbg { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--mid-grey); }
    .lbs { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: var(--navy); }
    .lg { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: var(--navy); }
    .tiny { font-family: var(--cond); font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; fill: var(--navy); }
    .bd { font-family: var(--cond); font-size: 19px; font-weight: 900; }
    .big { font-family: var(--cond); font-size: 44px; font-weight: 900; }
    .sm { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; }
    .qm { font-family: var(--cond); font-size: 28px; font-weight: 900; }
    .ax { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: var(--mid-grey); }
    .axp { font-family: 'Barlow', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: var(--pink); }
    .bigl { font-family: var(--cond); font-size: 36px; font-weight: 900; fill: var(--navy); }

    /* home */
    .decks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; height: 100%; align-items: center; padding-right: 12px; }
    .deck { position: relative; height: 430px; background: none; border: none; padding: 0; cursor: pointer; font-family: inherit; color: var(--navy); text-align: left; }
    .deck::before, .deck::after { content: ''; position: absolute; inset: 0; border: 3px solid var(--navy); border-radius: 14px; transition: transform .35s var(--ease); }
    .deck::before { transform: translate(12px, 12px); background: var(--navy); }
    .deck::after { transform: translate(6px, 6px); background: #fff; }
    .dface { position: absolute; inset: 0; z-index: 1; border: 3px solid var(--navy); border-radius: 14px; background: #fff; padding: 20px 20px 18px; display: flex; flex-direction: column; transition: transform .35s var(--ease), border-color .2s; }
    .deck:hover .dface, .deck:focus-visible .dface { transform: translate(-4px, -10px) rotate(-1.5deg); border-color: var(--pink); }
    .deck:hover::after { transform: translate(9px, 4px) rotate(1.5deg); }
    .deck:focus-visible { outline: none; }
    .dface svg { width: 100%; height: 112px; }
    .dcode { font-family: var(--cond); font-size: 66px; font-weight: 900; color: var(--pink); line-height: 1; margin-top: auto; }
    .dname { font-size: 25px; font-weight: 800; line-height: 1.15; margin-top: 4px; min-height: 58px; }
    .dmeta span { white-space: nowrap; }
    .dmeta { gap: 8px; font-size: 17px !important; display: flex; justify-content: space-between; border-top: 3px solid var(--navy); margin-top: 14px; padding-top: 10px; font-family: var(--cond); font-size: 19px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mid-grey); }

    /* deck screen */
    .dscreen { display: grid; grid-template-columns: 340px 1fr; gap: 48px; height: 100%; }
    .dscreen .deck { height: 470px; cursor: default; }
    .dscreen .deck:hover .dface { transform: none; border-color: var(--navy); }
    .dscreen .deck:hover::after { transform: translate(6px, 6px); }
    .dstate { font-size: 19px; font-weight: 600; line-height: 1.3; margin-top: 10px; }
    .sccol { display: flex; flex-direction: column; min-height: 0; }
    .sch { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mid-grey); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .sch button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--navy); background: none; border: none; cursor: pointer; padding: 0; }
    .sclist { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding: 2px 8px 4px 2px; }
    .scrow { display: grid; grid-template-columns: 30px 60px 1fr auto auto; align-items: center; gap: 14px; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 14px; background: #fff; font-family: inherit;
        font-size: 17px; font-weight: 600; color: var(--navy); text-align: left; cursor: pointer; line-height: 1.2; min-height: 58px; transition: opacity .2s, background-color .2s; }
    .scrow:hover { background: #f6f7fb; }
    .scrow .box { width: 30px; height: 30px; border: 3px solid var(--navy); border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: background-color .2s, border-color .2s; }
    .scrow .box svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
    .scrow.on .box { background: var(--pink); border-color: var(--pink); }
    .scrow.on .box svg { opacity: 1; }
    .scrow:not(.on) { opacity: .5; border-style: dashed; }
    .scrow .code { font-family: var(--cond); font-size: 25px; font-weight: 900; }
    .scrow .n { font-family: var(--cond); font-size: 18px; font-weight: 800; color: var(--mid-grey); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }

    /* play */
    .play { display: grid; grid-template-columns: 612px 1fr; gap: 32px; height: 100%; align-items: center; }
    .cwrap { position: relative; width: 584px; height: 470px; perspective: 1800px; }
    .stk { position: absolute; inset: 0; border-radius: 14px; background: var(--navy); border: 3px solid var(--navy); transition: transform .4s var(--ease), opacity .3s; }
    .stk::after { content: ''; position: absolute; inset: 8px; border: 2px solid rgba(234,0,138,.5); border-radius: 8px; }
    .card { position: absolute; inset: 0; transform-style: preserve-3d; z-index: 5; }
    .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; border: 3px solid var(--navy); border-radius: 14px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
    .face.back { transform: rotateY(180deg); }
    .front { padding: 22px 28px 20px; }
    .fmeta { display: flex; align-items: center; gap: 12px; position: relative; z-index: 1; }
    .sctag { font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; background: var(--navy); border-radius: 6px; padding: 5px 12px 4px; line-height: 1; }
    .tchip { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink); border: 3px solid var(--pink); border-radius: 6px; padding: 2px 10px 1px; }
    .lgc { margin-left: auto; font-family: var(--cond); font-size: 20px; font-weight: 800; letter-spacing: .08em; color: var(--mid-grey); }
    .fq { font-size: 26px; font-weight: 700; line-height: 1.25; margin-top: 14px; position: relative; z-index: 1; }
    .front.t .fq { font-size: 37px; font-weight: 800; line-height: 1.18; margin: auto 0; padding-bottom: 30px; }
    .ghost { position: absolute; right: 16px; bottom: -40px; font-family: var(--cond); font-weight: 900; font-size: 210px; color: var(--blank); line-height: 1; pointer-events: none; }
    .fvis { flex: 1; min-height: 0; margin-top: 10px; display: flex; align-items: center; justify-content: center; }
    .fvis svg { width: 100%; height: 100%; }
    .pat { background: var(--navy); border-color: var(--navy); }
    .pat svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .pcode { position: absolute; left: 30px; top: 22px; font-family: var(--cond); font-size: 70px; font-weight: 900; color: #fff; line-height: 1; }
    .bhead { display: flex; align-items: center; gap: 12px; padding: 14px 26px; color: #fff; font-family: var(--cond); font-size: 40px; font-weight: 900; text-transform: uppercase; letter-spacing: .02em; line-height: 1; }
    .bhead.ok { background: var(--pink); }
    .bhead.no { background: var(--navy); }
    .bhead svg { width: 36px; height: 36px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .bsc { margin-left: auto; font-size: 22px; letter-spacing: .08em; opacity: .85; }
    .bbody { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px 28px 18px; }
    .alab { font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mid-grey); }
    .ans { font-size: 28px; font-weight: 800; line-height: 1.2; margin-top: 4px; }
    .bhead.ok + .bbody .ans { color: var(--pink); }
    .apic { height: 118px; margin-top: 6px; }
    .apic svg { height: 100%; width: auto; }
    .exp { font-size: 21px; font-weight: 500; line-height: 1.38; margin: 10px 0 0; }
    .bbody.nov .exp { font-size: 24px; }
    .bbody.nov .ans { font-size: 32px; }
    .back .ghost { z-index: 0; }
    .bbody { position: relative; z-index: 1; }
    .bvis { flex: 1; min-height: 0; margin-top: 10px; display: flex; justify-content: center; }
    .bvis svg { width: 100%; height: 100%; }

    /* options */
    .opts { display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; }
    .opt { display: flex; align-items: center; gap: 16px; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 18px; min-height: 96px;
        font-family: inherit; font-size: 23px; font-weight: 600; color: var(--navy); text-align: left; line-height: 1.25; cursor: pointer;
        transition: background-color .2s, border-color .2s, color .2s, opacity .25s, box-shadow .2s; position: relative; }
    .opt.short { font-size: 28px; font-weight: 700; }
    .l { flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; background: var(--navy); color: #fff; font-family: var(--cond); font-size: 24px; font-weight: 900;
        display: flex; align-items: center; justify-content: center; transition: background-color .2s, color .2s; }
    .l svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .l svg path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .35s .12s var(--ease) forwards; }
    .opt:hover:not(:disabled), .pcard:hover:not(:disabled) { background: #f6f7fb; }
    .opt:disabled, .pcard:disabled { cursor: default; }
    .opt.right, .opt.right:hover { background: var(--pink); border-color: var(--pink); color: #fff; }
    .opt.right .l { background: #fff; color: var(--pink); }
    .wrong { border-style: dashed !important; opacity: .5; animation: shake .4s; }
    .reveal { border-color: var(--pink) !important; box-shadow: 0 0 0 5px rgba(234,0,138,.18); }
    .reveal .l { background: var(--pink); }
    .dim { opacity: .3; }
    .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pcard { position: relative; border: 3px solid var(--navy); border-radius: 8px; background: #fff; padding: 12px 8px 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; height: 214px;
        font-family: inherit; color: var(--navy); transition: background-color .2s, border-color .2s, opacity .25s, box-shadow .2s; }
    .pcard .l { position: absolute; left: 10px; top: 10px; width: 36px; height: 36px; font-size: 22px; }
    .pcard svg.vis { width: 100%; height: 170px; }
    .pcard.right, .pcard.right:hover { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 6px rgba(234,0,138,.22); }
    .pcard.right .l { background: var(--pink); color: #fff; }


    /* interactive cards */
    .fvis { position: relative; }
    .replay { position: absolute; right: 0; top: 0; display: flex; align-items: center; gap: 6px; font-family: var(--cond); font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        background: #fff; color: var(--navy); border: 3px solid var(--navy); border-radius: 6px; padding: 4px 11px 3px 8px; cursor: pointer; }
    .replay svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .replay:hover { background: var(--blank); }
    .tile { display: inline-flex; align-items: center; gap: 10px; font-family: inherit; font-size: 21px; font-weight: 700; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 8px; padding: 6px 14px;
        line-height: 1.2; cursor: grab; touch-action: none; position: relative; z-index: 2; box-shadow: 0 4px 0 #c3c6d0; white-space: nowrap; transition: box-shadow .2s, border-color .2s, background-color .2s; }
    .tile:hover { background: #f6f7fb; }
    .tile .mini { width: 32px; height: 32px; flex-shrink: 0; overflow: visible; }
    .tile.sel { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(234,0,138,.22); }
    .tile.drag { cursor: grabbing; z-index: 40; box-shadow: 0 14px 30px rgba(27,31,69,.25); border-color: var(--pink); }
    .tile.right { background: var(--pink); color: #fff; border-color: var(--pink); box-shadow: none; }
    .tile.wrong { border-style: dashed; background: var(--tint); box-shadow: none; animation: shake .4s; }
    .tile:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }
    .pool { display: flex; flex-wrap: wrap; gap: 12px; align-content: center; justify-content: center; background: var(--blank); border-radius: 12px; padding: 16px; height: 100%; }
    .pool2 { display: grid; grid-template-columns: 1fr 1fr; align-content: center; gap: 14px; }
    .pool2 .tile { justify-content: flex-start; font-size: 22px; padding: 8px 14px; }
    .pool3 { display: grid; grid-template-columns: repeat(3, 1fr); align-content: center; justify-items: center; gap: 16px; }
    .mtile { padding: 6px; }
    .mtile svg { width: 92px; height: 92px; display: block; }
    .mtile.right svg circle[fill="#fbfbf7"], .mtile.right svg path[fill="#fbfbf7"] { fill: #fff; }
    .wtile { font-size: 26px; padding: 10px 24px; }
    .kz { flex-direction: column; align-items: stretch; justify-content: center; gap: 14px; }
    .ordtop { display: flex; align-items: center; gap: 10px; font-family: var(--cond); font-size: 17px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--mid-grey); white-space: nowrap; }
    .ordtop i { flex: 1; height: 3px; background: linear-gradient(90deg, var(--pink), var(--light-grey)); }
    .ordtop .mini { width: 36px; height: 36px; overflow: visible; flex-shrink: 0; }
    .ogrid { display: grid; gap: 10px; }
    .slot { position: relative; border: 3px dashed #c3c6d0; border-radius: 10px; min-height: 96px; display: flex; align-items: center; justify-content: center; padding: 20px 4px 6px; transition: border-color .2s, background-color .2s, box-shadow .2s; }
    .slot > b { position: absolute; left: 8px; top: 3px; font-family: var(--cond); font-size: 16px; font-weight: 900; color: var(--mid-grey); letter-spacing: .04em; }
    .slot .sb { display: flex; justify-content: center; width: 100%; }
    .slot:has(.tile) { border-style: solid; border-color: var(--light-grey); }
    .slot .tile { box-shadow: none; flex-direction: column; gap: 2px; font-size: 15px; padding: 4px 6px; min-width: 100px; }
    .slot .tile .mini { width: 30px; height: 30px; }
    .slot .mtile { min-width: 0; padding: 4px; }
    .slot .mtile svg { width: 74px; height: 74px; }
    .slot.hover, .slot.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }
    .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; height: 100%; }
    .bin { border: 3px solid var(--navy); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; transition: box-shadow .2s; }
    .bin h3 { margin: 0; padding: 6px 14px 5px; font-family: var(--cond); font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; color: #fff; background: var(--navy); }
    .bin.pk { border-color: var(--pink); }
    .bin.pk h3 { background: var(--pink); }
    .bin .sub { font-size: 15px; font-weight: 600; color: var(--mid-grey); padding: 5px 14px 0; }
    .bin .area { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; justify-content: center; padding: 8px; }
    .bin .mtile svg { width: 54px; height: 54px; }
    .pool4 { display: grid; grid-template-columns: 1fr 1fr; align-content: center; justify-items: center; gap: 20px; }
    .ai.am svg { width: 60px; height: 60px; }
    .ai small { font-size: 14px; }
    .pair { display: flex; gap: 10px; width: 100%; justify-content: center; }
    .pair svg { width: 48%; height: 100%; }
    .bin.hover, .bin.armed { box-shadow: 0 0 0 5px rgba(234,0,138,.18); cursor: pointer; }
    .ctext { font-size: 24px; font-weight: 600; line-height: 1.95; margin: 0; }
    .blank { display: inline-flex; vertical-align: middle; min-width: 112px; height: 48px; border: 3px dashed #c3c6d0; border-radius: 8px; margin: 0 3px; align-items: center; justify-content: center; transition: border-color .2s, background-color .2s; }
    .blank:has(.tile) { border-color: transparent; min-width: 0; }
    .blank .bb { display: flex; }
    .blank .tile { box-shadow: none; font-size: 22px; padding: 4px 12px; }
    .blank.hover, .blank.armed:hover { border-color: var(--pink); background: rgba(234,0,138,.06); }

<script>
/* =====================================================================================
   MICRO CREATIONS FLASHCARDS: MAINTENANCE GUIDE
   Built from the Earth and space flashcards template. Read this before adding, editing
   or removing cards.

   1. DECKS AND SUB-DECKS
      - Decks are checkpoints (CP1 Variables, CP2 Conditional statements). They live in DECKS.
      - Each deck is split into sub-decks, one per learning intention (Predict, Run,
        Investigate, Modify). They live in SUBS. A card's second argument is its sub-deck key.
      - CP2 is a locked placeholder. To open it: remove locked: true, list its sub-deck keys
        in subs, add those keys to SUBS (with deck: 'CP2') and write its cards.

   2. BUCKLES (shared reward system)
      - Buckles are stored in localStorage under 'buckles-shared', the same record used by
        the other checking for understanding pages. Each entry is 'PAGE_ID:card-id': 1.
      - One buckle per card, awarded the first time the card is answered correctly and
        never again. A wrong answer awards nothing, so the card can still be earned later.
      - PAGE_ID must never change. Changing it would orphan every buckle already earned.

   3. CARD IDS (permanent)
      - The first argument of C() is the card's buckle ID, for example 'var-run-tap-the-bug'.
      - Use lowercase letters, numbers and hyphens. Start with the deck and sub-deck
        (var-predict-, var-run-, ... and cond- for the conditional statements deck).
      - Once a card is published its ID is permanent. Everything else can be edited freely.
      - Adding a card: write a new C('new-id', ...) and add 'new-id' to RELEASED_IDS.
      - Deleting a card: remove the C(...) entry and add its ID to RETIRED_IDS. Leave it in
        RELEASED_IDS. Never reuse a retired ID.
      - If an ID ever has to change, add 'old-id': 'new-id' to ID_ALIASES.

   4. DATA CHECK
      - validateCards() runs on every load. Problems and reminders are listed in the browser
        console, and a small strip appears at the top left of the page.

   5. CARD TYPES (opts[0] is correct unless ans is given)
      Multiple choice:  C(id, sub, label, question, [4 options], explanation, { vis?, backVis?, codeOpts?, type?, ordered?, ans? })
                        vis: codeHTML('line 1\nline 2')   backVis: io('code', 'output')   codeOpts: show options as code
      Predict (watch):  { scene: 'mem', mem: {...}, vis: memSVG(mem) }  code runs into a named box (see memSVG)

/* ---------- Python syntax colouring ----------
   tokenize() splits one line of Python into coloured pieces.
   k: 's' string, 'n' number, 'f' function, 'c' comment, 'ws' space, '' everything else.
   split: true breaks strings into separate quote marks and text (used by tap-the-code cards). */
const FNS = new Set(['print', 'input', 'int', 'float', 'str', 'if', 'elif', 'else']);
const COL = { s: '#7ee2b8', n: '#ff8fcf', f: '#8fd3ff', c: '#8a90b8' };
function tokenize(s, split = false) {
    const out = [], rx = split ? /(")|(#.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g : /("[^"]*"?|'[^']*'?)|(#.*$)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)|(\s+)|(.)/g;
    let inStr = false;
    for (const m of s.matchAll(rx)) {
        const t = m[0];
        if (split && m[1]) { out.push({ t, k: 's' }); inStr = !inStr; continue; }
        if (inStr) { out.push({ t, k: m[5] ? 'ws' : 's' }); continue; }
        let k = '';
        if (m[1]) k = 's'; else if (m[2]) k = 'c'; else if (m[3]) k = 'n'; else if (m[5]) k = 'ws';
        else if (m[4] && (FNS.has(t) || /^\s*\(/.test(s.slice(m.index + t.length)))) k = 'f';
        out.push({ t, k });
    }
    return out;
}
/* hl: one line of code as coloured HTML. Wrap part of a line in ⟦ ⟧ to highlight it in pink. */
const hl = src => src.split(/(⟦[^⟧]*⟧)/).map(seg => {
    const mk = seg.startsWith('⟦'), body = tokenize(mk ? seg.slice(1, -1) : seg).map(t => t.k && t.k !== 'ws' ? `<span class="k-${t.k}">${esc(t.t)}</span>` : esc(t.t)).join('');
    return mk ? `<mark>${body}</mark>` : body;
}).join('');
/* codeHTML: a numbered code panel. Use \n between lines. */
const codeHTML = (src, o = {}) => `<div class="cb"><div class="cbh"><span>${o.label || 'Code'}</span></div><ol>${src.split('\n').map(l => `<li>${hl(l) || ' '}</li>`).join('')}</ol></div>`;
/* io: code on the left, what appears on the screen on the right */
const io = (src, out) => `<div class="io">${codeHTML(src)}<i></i><div class="scr"><div class="cbh"><span>Output</span></div><pre>${out}</pre></div></div>`;
/* lab: a line of code with each part labelled underneath. parts: [[code, label, pink?], ...] */
const lab = (parts, o = {}) => `<div class="lab3"${o.tight ? ' style="gap:10px;padding:14px 16px 12px"' : ''}>${parts.map(([c, l, p]) => `<span class="${p ? 'nm' : ''}"><code${o.tight ? ' style="font-size:28px"' : ''}>${esc(c)}</code><small${o.tight ? ' style="font-size:13px"' : ''}>${l}</small></span>`).join('')}</div>`;
const svgLine = s => tokenize(s).map(t => `<tspan fill="${COL[t.k] || '#fff'}">${esc(t.t)}</tspan>`).join('');

/* ---------- tap-the-code hotspots ----------
   hsCode(lines, hits, { split }) draws code as tappable pieces and returns { hsSVG, correct }.
   hits lists the text of every correct piece, for example ['Age'] or ['"']. */
function hsCode(lines, hits, o = {}) {
    const fs = 30, cw = 18, LH = 64, x0 = 74, gap = 12;
    let s = '', k = 0, maxX = 0;
    const correct = [];
    lines.forEach((line, i) => {
        const y = 92 + i * LH, toks = tokenize(line, o.split);
        s += `<text x="${x0 - 22}" y="${y}" text-anchor="end" class="mln" style="font-size:18px">${i + 1}</text>`;
        let x = x0;
        toks.forEach((t, j) => {
            if (t.k === 'ws') { x += t.t.length * cw; return; }
            const w = t.t.length * cw, col = COL[t.k] || '#fff';
            if (hits.includes(t.t)) correct.push(k);
            s += `<g class="hs" data-k="${k}" tabindex="0" role="button" aria-label="${esc(t.t)}">`
                + `<rect class="hdot" x="${x - 6}" y="${y - 32}" width="${w + 12}" height="44" rx="7" fill="#262b5c" stroke="#3a4080" stroke-width="2"/>`
                + `<rect class="hpl" x="${x - 6}" y="${y - 32}" width="${w + 12}" height="44" rx="7" fill="none" stroke="${PK}" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".9;.12;.9" dur="1.8s" begin="${(k * .15).toFixed(2)}s" repeatCount="indefinite"/></rect>`
                + `<text x="${x}" y="${y}" xml:space="preserve" textLength="${w}" lengthAdjust="spacingAndGlyphs" style="font-family:var(--mono);font-size:${fs}px;font-weight:600;fill:${col}">${esc(t.t)}</text></g>`;
            k++;
            x += w + (toks[j + 1] && toks[j + 1].k !== 'ws' ? gap : 0);
        });
        maxX = Math.max(maxX, x);
    });
    const W = Math.max(440, maxX + 40), H = 92 + (lines.length - 1) * LH + 40;
    const head = `<text x="22" y="30" class="mlab">Code</text><line x1="0" x2="${W}" y1="44" y2="44" stroke="#2c3168" stroke-width="2"/>`;
    return { hsSVG: `<svg class="vis hsv chs" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${head}${s}</svg>`, correct };
}

/* ---------- memory model: code on the left, a named box on the right ----------
   mem: { name, lines: [...], pause, steps: [{ ln, val?, calc?: [...], out?, err? }] }
   The front of the card plays the steps before pause, then stops on the next line.

const MLY = i => 84 + i * 46;
function memSVG(m) {

    m.lines.forEach((l, i) => { s += `<text x="46" y="${MLY(i)}" text-anchor="end" class="mln">${i + 1}</text><text x="60" y="${MLY(i)}" class="mcode" xml:space="preserve">${svgLine(l)}</text>`; });
    s += `<polygon points="360,110 374,96 486,96 500,110" fill="${NV}"/>`;

    s += `<rect x="360" y="110" width="140" height="110" fill="#fff" stroke="${NV}" stroke-width="3"/>`;
    s += `<rect x="380" y="176" width="100" height="32" rx="6" fill="${PK}"/><text x="430" y="198" text-anchor="middle" class="mtag">${esc(m.name)}</text>`;
    s += `<g class="mvals"></g><text class="mcalc" x="430" y="58" text-anchor="middle" opacity="0"></text>`;
    s += `<rect x="14" y="232" width="512" height="56" rx="10" fill="#0f1230"/><text x="30" y="265" class="mlab">Output</text><line x1="100" x2="100" y1="244" y2="276" stroke="#2c3168" stroke-width="2"/><text class="mout" x="116" y="268" xml:space="preserve"></text>`;
    return V(540, 300, s);

/* ---------- animated scenes (Predict cards) ---------- */
const SCENE = {
    mem(svg, c) {
        const m = c.mem, q = s => svg.querySelector(s);
        const hlg = q('.mhl'), nx = q('.mnx'), vals = q('.mvals'), calc = q('.mcalc'), outt = q('.mout');
        let tok = 0, cur = null, hy = null;
        const live = my => my === tok && document.body.contains(svg);
        const tw = (my, dur, f) => new Promise(res => { const st = performance.now(); const fr = n => { if (!live(my)) return; const k = Math.min(1, (n - st) / dur); f(easeInOut(k)); if (k < 1) requestAnimationFrame(fr); else res(); }; requestAnimationFrame(fr); });
        const wait = (my, ms) => new Promise(res => setTimeout(() => { if (live(my)) res(); }, ms));
        const reset = () => { vals.innerHTML = ''; cur = null; calc.textContent = ''; calc.setAttribute('opacity', 0); outt.textContent = ''; hlg.setAttribute('opacity', 0); nx.setAttribute('opacity', 0); hy = null; };
        const newVal = v => { const t = document.createElementNS(SVGNS, 'text'); t.setAttribute('x', 430); t.setAttribute('y', 158); t.setAttribute('text-anchor', 'middle'); t.setAttribute('class', 'mval'); t.textContent = v; vals.appendChild(t); return t; };
        async function moveHL(my, ln, inst) {
            const y = MLY(ln);
            if (inst || hy === null) { hlg.setAttribute('transform', `translate(0 ${y})`); hy = y; if (inst) { hlg.setAttribute('opacity', 1); return; } await tw(my, 260, k => hlg.setAttribute('opacity', k)); return; }
            const y0 = hy; hy = y;
            await tw(my, 380, k => hlg.setAttribute('transform', `translate(0 ${f1(y0 + (y - y0) * k)})`));
        }
        async function step(my, s, inst) {
            nx.setAttribute('opacity', 0);
            await moveHL(my, s.ln, inst);
            if (!inst) { tone([[440, .05, 'triangle', .04]]); await wait(my, 420); }
            if (s.calc && !inst) for (const part of s.calc) { calc.textContent = part; calc.setAttribute('opacity', 1); await tw(my, 200, k => calc.setAttribute('opacity', k)); await wait(my, 760); }
            if (s.val !== undefined) {
                const old = cur, t = newVal(s.val); cur = t;
                if (inst) { if (old) old.remove(); }
                else {
                    const y0 = s.calc ? 58 : 34;
                    t.setAttribute('y', y0); t.setAttribute('opacity', 0);
                    if (old) tw(my, 520, k => { old.setAttribute('x', f1(430 + 70 * k)); old.setAttribute('y', f1(158 - 80 * k)); old.setAttribute('opacity', f1(1 - k)); }).then(() => old.remove());
                    if (s.calc) calc.setAttribute('opacity', 0);
                    await tw(my, 620, k => { t.setAttribute('y', f1(y0 + (158 - y0) * k)); t.setAttribute('opacity', f1(Math.min(1, k * 2))); });
                    tone([[660, .06, 'triangle', .05]]);
                }
            }
            if (s.out !== undefined) {
                outt.textContent = s.out;
                outt.style.fill = s.err ? '#ff6fb8' : '#fff'; outt.style.fontSize = s.err ? '16px' : '22px';
                if (!inst) await tw(my, 300, k => outt.setAttribute('opacity', k));
            }
        }
        reset();
        return {
            async intro() {
                const my = ++tok; reset(); await wait(my, 150);
                for (let i = 0; i < m.pause; i++) { await step(my, m.steps[i]); await wait(my, 380); }
                await moveHL(my, m.steps[m.pause].ln);
                await tw(my, 240, k => nx.setAttribute('opacity', k));
            },
            async outcome() {
                const my = ++tok; reset();
                for (let i = 0; i < m.pause; i++) await step(my, m.steps[i], true);
                await wait(my, 250);
                for (let i = m.pause; i < m.steps.length; i++) { await step(my, m.steps[i]); await wait(my, 300); }
            }
        };
    }
};

/* ========================== Buckles (localStorage) ======================= */
/* Same storage and rules as the other checking for understanding pages: one shared
   'buckles-shared' record, keys namespaced by page, one buckle per question, awarded
   the first time the question is answered correctly and never again. */
const PAGE_ID = 'micro-creations-flashcards';   /* NEVER CHANGE: it namespaces every buckle this page has awarded */
CARDS.forEach(c => { c.buckles = 1; });

/* ---------- card ID registry (see the maintenance guide at the top of this script) ---------- */
/* Every ID ever published. Add new IDs here when you publish new cards. Never remove an ID from this list. */
const RELEASED_IDS = [
    'var-predict-what-is-a-variable', 'var-predict-two-parts', 'var-predict-tap-the-name',
    'var-predict-spot-the-value', 'var-predict-what-print-does', 'var-predict-print-a-variable',

    'var-run-numbers-without-quotes', 'var-run-two-print-lines', 'var-run-quotes-around-a-name',
    'var-run-what-a-nameerror-means', 'var-run-predict-the-error', 'var-run-tap-the-bug',
    'var-run-works-or-nameerror', 'var-investigate-three-parts-in-order', 'var-investigate-name-or-value',
    'var-investigate-sort-the-data-types', 'var-investigate-type-of-37-5', 'var-investigate-a-number-in-quotes',
    'var-investigate-why-string', 'var-investigate-the-assignment-rule', 'var-investigate-age-plus-one',

    'var-modify-commas-in-print', 'var-modify-build-a-print-line', 'var-modify-spot-the-error',
];
/* IDs of cards that have been deleted. Keep them here (and in RELEASED_IDS) so they are never reused. */
const RETIRED_IDS = [];
/* Only if an ID ever has to change: 'old-id': 'new-id'. Earned buckles are moved across once, never doubled. */
const ID_ALIASES = {};
const Buckles = {
    key: 'buckles-shared',
    ns(id) { return PAGE_ID + ':' + id; },
    load() { try { const d = JSON.parse(localStorage.getItem(this.key)); return d && typeof d === 'object' && !Array.isArray(d) ? d : {}; } catch (e) { return {}; } },
    save(d) { try { localStorage.setItem(this.key, JSON.stringify(d)); } catch (e) {} },
    isDone(id) { return !!this.load()[this.ns(id)]; },
    award(id, n) { const d = this.load(); const k = this.ns(id); if (!d[k]) { d[k] = n; this.save(d); } },
    total() { return Object.values(this.load()).reduce((a, b) => a + (Number(b) || 0), 0); },
    /* moves buckles saved under an old ID to its new ID, so a renamed card is never earned twice */
    migrate() {
        const d = this.load(); let changed = false;
        Object.entries(ID_ALIASES).forEach(([from, to]) => {
            const kf = this.ns(from), kt = this.ns(to);
            if (d[kf] !== undefined) { if (d[kt] === undefined) d[kt] = d[kf]; delete d[kf]; changed = true; }
        });
        if (changed) this.save(d);
    }
};
Buckles.migrate();
const BK = '<img src="buckle.svg" alt="" onerror="this.style.display=\'none\'">';
const earnedIn = list => list.filter(c => Buckles.isDone(c.id)).length;
function refreshCount() { $('#buckleCount').textContent = Buckles.total(); }
function celebrate(n) {
    const a = $('#award');
    $('#awardText').textContent = '+' + n + ' Buckle' + (n > 1 ? 's' : '') + '!';
    a.classList.remove('hide'); a.classList.add('show');
    burstConfetti();
    setTimeout(() => { a.classList.remove('show'); a.classList.add('hide'); setTimeout(() => a.classList.remove('hide'), 360); }, 1100);
}
function burstConfetti() {
    const canvas = document.createElement('canvas');
    canvas.className = 'confetti-canvas';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d'), dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const colors = ['#ea008a', '#1b1f45', '#f7a8d4', '#c3c6d0'], cx = innerWidth / 2, cy = innerHeight / 2, parts = [];
    for (let i = 0; i < 150; i++) {
        const angle = Math.random() * Math.PI * 2, speed = 4 + Math.random() * 10;
        parts.push({ x: cx, y: cy, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 4, size: 5 + Math.random() * 7,
            color: colors[Math.floor(Math.random() * colors.length)], rot: Math.random() * Math.PI, vrot: (Math.random() - .5) * .3, life: 0 });
    }
    const gravity = 0.22, drag = 0.992; let frame = 0;
    (function tick() {
        frame++;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        parts.forEach(p => {
            p.vx *= drag; p.vy = p.vy * drag + gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.max(0, 1 - p.life / 95);
            ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore();
        });
        if (frame < 95) requestAnimationFrame(tick); else canvas.remove();
    })();
}

let screen = 'home', S = null;

    const g = el('div', 'decks two');

        if (d.locked) {

function deckScreen(d) {
    screen = 'deck'; clearAll();
    counter.innerHTML = `<b>${d.title}</b>&nbsp;${d.short}`;
    const sel = new Set(d.subs);
    const wrap = el('div', 'dscreen');

    const right = el('div', 'sccol');
    const head = el('div', 'sch', '<span>Learning intentions</span>');
    const allBtn = el('button', '', 'Select all'); head.appendChild(allBtn);
    const list = el('div', 'sclist');
    const rows = d.subs.map(k => {
        const s = SUBS[k], cs = CARDS.filter(c => c.sc === k), n = cs.length;
        const r = el('button', 'scrow li on', `<span class="box">${TICK}</span><span class="lit"><span class="lh"><b>${s.title}</b><span class="stg">${s.stage}</span></span><span class="ltx">${s.li}</span><span class="lsc">${s.sc}</span></span><span class="n">${n} cards</span><span class="bk">${BK}${earnedIn(cs)}/${n}</span>`);
        r.onclick = () => { sel.has(k) ? sel.delete(k) : sel.add(k); r.classList.toggle('on', sel.has(k)); upd(); };
        list.appendChild(r); return r;
    });
    allBtn.onclick = () => { d.subs.forEach(s => sel.add(s)); rows.forEach(r => r.classList.add('on')); upd(); };
    right.append(head, list); wrap.append(left, right); content.appendChild(wrap);
    A(left, [{ opacity: 0, transform: 'translateX(-40px) rotate(-3deg)' }, { opacity: 1, transform: 'none' }], { duration: 550 });
    rows.forEach((r, i) => A(r, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 400, delay: 120 + i * 60, fill: 'backwards' }));
    say('Tap a learning intention to leave it out, then press <b>Start</b>.');
    addBtn('Back', 'btn2', home);

    function upd() { const n = CARDS.filter(c => sel.has(c.sc)).length; go.textContent = n ? `Start ${n} cards` : 'Start'; go.disabled = !n; }
    upd();
}

        const tag = f === 1 ? '<span class="tag sec">Secure</span>' : f >= .5 ? '<span class="tag near">Nearly</span>' : '<span class="tag rev">Revise</span>';
        const chips = rs.map(r => compact && r.ok ? `<span class="chip y dot" title="${r.c.label}">${TICK}</span>` : `<span class="chip ${r.ok ? 'y' : 'n'}">${r.ok ? TICK : CROSS}${r.c.label}</span>`).join('');
        const b = el('div', 'rblock', `<div class="rbh"><span class="rsc">${SUBS[sc].title}</span>${tag}<b>${k} / ${rs.length}</b></div>${compact ? '' : `<div class="rtx">${SUBS[sc].sc}</div>`}<div class="chips">${chips}</div>`);
        list.appendChild(b); return b;
    });

    wrap.append(left, right); content.appendChild(wrap);
    let rsz = 1;
    while (list.scrollHeight > list.clientHeight + 1 && rsz > .62) { rsz -= .03; list.style.setProperty('--rs', rsz.toFixed(2)); }
    blocks.forEach((b, i) => A(b, [{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }], { duration: 420, delay: 250 + i * 60, fill: 'backwards' }));
    say('Take a screenshot of this screen and paste it into Stile as evidence of your work.');
    const ring = left.querySelector('.rg'), frac = N ? n / N : 0;

    const tick = t => { if (!S || S.tok !== tok || screen !== 'results') return; const k = Math.max(0, Math.min(1, (t - t0) / 1300)); rn.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); else if (frac >= .8) ringCelebrate(); };

}
function ringCelebrate() {

/* ---------- scale to window ---------- */
function fit() {

function fitTitle() { const t = document.querySelector('.sheet-title'); t.style.fontSize = ''; let f = 42; while (t.scrollWidth > t.clientWidth + 1 && f > 20) { f--; t.style.fontSize = f + 'px'; } }
new MutationObserver(fitTitle).observe(counter, { childList: true, subtree: true, characterData: true });

/* ---------- data check: runs on every load and reports problems before students find them ---------- */
function validateCards() {
    const err = [], warn = [], seen = new Map(), labels = new Set(), idRx = /^[a-z0-9]+(-[a-z0-9]+)*$/;
    const released = new Set(RELEASED_IDS), retired = new Set(RETIRED_IDS);
    CARDS.forEach((c, i) => {
        const at = `Card ${i + 1} (${c.id || 'no id'})`;
        if (typeof c.id !== 'string' || !idRx.test(c.id)) err.push(`${at}: the ID must use lowercase letters, numbers and hyphens only.`);
        if (seen.has(c.id)) err.push(`${at}: duplicate ID, also used by card ${seen.get(c.id) + 1}. Both would share one buckle.`); else seen.set(c.id, i);
        if (retired.has(c.id)) err.push(`${at}: this ID was retired and must not be reused. Choose a new ID.`);
        if (!released.has(c.id)) warn.push(`${at}: new ID. Add '${c.id}' to RELEASED_IDS when you publish this card.`);
        if (!SUBS[c.sc] || !DECKS.find(d => d.id === SUBS[c.sc].deck && d.subs.includes(c.sc))) err.push(`${at}: ${c.sc} is not listed in SUBS and DECKS.`);
        if (!c.label || !c.q || !c.exp) err.push(`${at}: label, question and explanation are all required.`);
        const lk = c.sc + '|' + c.label; if (labels.has(lk)) warn.push(`${at}: another ${c.sc} card has the label "${c.label}", which makes the results screen confusing.`); labels.add(lk);
        if (c.scene && (!SCENE[c.scene] || !c.vis)) err.push(`${at}: scene "${c.scene}" needs a matching SCENE entry and a vis.`);
        if (c.kind) {
            if (!KIND[c.kind]) { err.push(`${at}: unknown kind "${c.kind}".`); return; }
            if (!c.instr) warn.push(`${at}: add an instr line so students know what to do.`);
            if (c.kind === 'order' && (!Array.isArray(c.seq) || c.seq.length < 2 || typeof c.tile !== 'function')) err.push(`${at}: order cards need seq (2 or more) and a tile function.`);
            if (c.kind === 'sort' && (!Array.isArray(c.bins) || c.bins.length < 2 || c.bins.length > 3 || !Array.isArray(c.items) || c.items.some(it => !(Number.isInteger(it[1]) && it[1] >= 0 && it[1] < c.bins.length)))) err.push(`${at}: sort cards need 2 or 3 bins and items tagged with a bin number.`);
            if (c.kind === 'cloze') {
                const gaps = (c.text.match(/\[\]/g) || []).length, bank = (c.bank || []).slice();
                if (gaps !== (c.answers || []).length) err.push(`${at}: the text has ${gaps} gaps but ${(c.answers || []).length} answers.`);
                (c.answers || []).forEach(a => { const k = bank.indexOf(a); if (k < 0) err.push(`${at}: the answer "${a}" is missing from the word bank.`); else bank.splice(k, 1); });
            }
            if (c.kind === 'hotspot' && (!c.hsSVG || !Array.isArray(c.correct) || !c.correct.length)) err.push(`${at}: hotspot cards need hsSVG and a correct list.`);
        } else {
            if (!Array.isArray(c.opts) || c.opts.length !== 4) err.push(`${at}: multiple choice cards need exactly 4 options.`);
            if (!Number.isInteger(c.ans) || c.ans < 0 || c.ans > 3) err.push(`${at}: ans must be 0, 1, 2 or 3.`);
        }
    });
    RELEASED_IDS.forEach(id => { if (!seen.has(id) && !retired.has(id) && !ID_ALIASES[id]) err.push(`Released ID '${id}' is missing. If the card was deleted, add it to RETIRED_IDS. If it was renamed, restore the old ID or add an ID_ALIASES entry.`); });
    Object.entries(ID_ALIASES).forEach(([a, b]) => { if (!seen.has(b)) err.push(`ID_ALIASES points '${a}' to '${b}', but no card has the ID '${b}'.`); });
    if (err.length || warn.length) {
        console.group(`Card data check: ${err.length} problem${err.length === 1 ? '' : 's'}, ${warn.length} reminder${warn.length === 1 ? '' : 's'}`);
        err.forEach(m => console.error(m)); warn.forEach(m => console.warn(m)); console.groupEnd();
        const b = el('button', 'devcheck' + (err.length ? ' bad' : ''), `Card data check: ${err.length ? `${err.length} problem${err.length === 1 ? '' : 's'}` : `${warn.length} reminder${warn.length === 1 ? '' : 's'}`}. Open the browser console for details.`);
        b.title = 'Click to hide'; b.onclick = () => b.remove(); stage.appendChild(b);
    }
    return { err, warn };
}
window.addEventListener('storage', e => { if (e.key === 'buckles-shared') refreshCount(); });
refreshCount();
validateCards();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { fit(); refreshCount(); home(); fitTitle(); });
